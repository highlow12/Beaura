schemaVersion: 1
tracks:
  - id: python
    revision: 1
    title: Python 기초
    description: 자료구조 학습에 필요한 Python 기초
    order: 10

  - id: computer-architecture
    revision: 1
    title: 컴퓨터 구조
    description: 컴퓨터가 프로그램을 실행하는 방식을 이해한다.
    order: 20

  - id: discrete-math
    revision: 1
    title: 이산수학
    description: 컴퓨터과학의 논리적 기초가 되는 명제와 논리를 익힌다.
    order: 30

  - id: data-structures
    revision: 1
    title: 자료구조
    description: 데이터를 저장하고 다루는 기본 구조
    order: 40

  - id: algorithms
    revision: 1
    title: 알고리즘
    description: 탐색, 정렬, 순회와 최단 경로의 기본
    order: 45

  # 영구 ID 정책에 따라 보존한다. 소속 레슨은 networks와 computer-graphics로 이전했다.
  - id: computer-systems
    revision: 1
    title: 컴퓨터 시스템 응용
    description: 네트워크와 그래픽스의 기초 개념을 익힌다.
    order: 50

  - id: operating-systems
    revision: 1
    title: 운영체제
    description: 프로세스, 동시성, 메모리와 입출원을 관리하는 운영체제의 핵심 원리를 익힌다.
    order: 55

  - id: networks
    revision: 2
    title: 네트워크
    description: 링크 계층부터 웹 보안까지 데이터가 네트워크를 이동하는 원리를 익힌다.
    order: 60

  - id: linear-algebra
    revision: 1
    title: 선형대수
    description: 그래픽스와 계산에 필요한 벡터, 행렬, 좌표 변환의 직관을 익힌다.
    order: 70

  - id: calculus
    revision: 1
    title: 미적분
    description: 변화율과 누적을 중심으로 CS에서 사용하는 미분과 적분을 익힌다.
    order: 75

  - id: probability-statistics
    revision: 1
    title: 확률과 통계
    description: 불확실성을 모델링하고 데이터의 분포와 요약을 해석하는 기초를 익힌다.
    order: 80

  - id: computer-graphics
    revision: 2
    title: 컴퓨터 그래픽스
    description: 좌표 변환부터 래스터화, 셰이딩과 광선 추적까지 그래픽 파이프라인을 익힌다.
    order: 90

  - id: databases
    revision: 1
    title: 데이터베이스
    description: 관계 모델, SQL, 인덱스와 트랜잭션을 통해 데이터를 신뢰성 있게 다루는 원리를 익힌다.
    order: 95

  - id: theory-of-computation
    revision: 1
    title: 계산이론
    description: 형식 언어와 계산 모델을 통해 무엇을 계산할 수 있는지 탐구한다.
    order: 100

  - id: programming-languages
    revision: 1
    title: 프로그래밍 언어와 컴파일러
    description: 소스 코드가 분석되고 중간 표현과 실행 코드로 바뀌는 과정을 익힌다.
    order: 110

  - id: software-engineering
    revision: 1
    title: 소프트웨어 공학
    description: 큰 소프트웨어를 설계하고 검증하고 운영하며 안전하게 변경하는 방법을 익힌다.
    order: 120
