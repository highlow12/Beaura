id: algo.big-o.complete-01
type: code-completion
prompt:
- type: text
  text: "Choose the Big-O term for a loop nested inside another loop, with each loop running n times."
language: python
template: complexity = O({{blank:term}})
blanks:
- id: term
  choices:
  - n^2
  - n
  - '1'
  acceptedAnswers:
  - n^2
explanation:
- type: text
  text: "Each loop runs a number of times proportional to n, and the loops are nested, so their costs multiply to n²."
schemaVersion: 1
revision: 1
tags:
- complexity
- big-o
difficulty: 2
