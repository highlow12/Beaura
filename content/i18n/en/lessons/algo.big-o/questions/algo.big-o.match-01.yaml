  content:
  - type: text
    text: "O(1)"
- id: linear
  content:
  - type: text
    text: "O(n)"
- id: quadratic
  content:
  - type: text
    text: "O(n^2)"
rightItems:
- id: fixed
  content:
  - type: text
    text: "A constant number of operations, independent of the input"
- id: scan
  content:
  - type: text
    text: "The cost of scanning the input once"
- id: nested
  content:
  - type: text
    text: "The cost of nesting two linear loops"
correctPairs:
