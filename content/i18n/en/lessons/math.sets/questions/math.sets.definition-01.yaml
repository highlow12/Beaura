schemaVersion: 1
id: math.sets.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "When A={1, 2, 3}, which statement is true?"
options:
  - id: member
    content:
      - type: text
        text: "2 ∈ A"
  - id: not-member
    content:
      - type: text
        text: "4 ∈ A"
  - id: set-member
    content:
      - type: text
        text: "{2} ∈ A"
  - id: empty
    content:
      - type: text
        text: "A = ∅"
correctOptionId: member
shuffleOptions: true
explanation:
  - type: text
    text: "2 is an element of A, so 2 ∈ A."
  - type: text
    text: "{2} is a separate set containing the element 2, so do not confuse it with the element-membership relation."
tags:
  - discrete-math
  - sets
  - membership
difficulty: 1
