schemaVersion: 1
id: math.sets.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each set symbol with its meaning."
leftItems:
  - id: member
    content:
      - type: text
        text: "x ∈ A"
  - id: subset
    content:
      - type: text
        text: "A ⊆ B"
  - id: union
    content:
      - type: text
        text: "A ∪ B"
  - id: intersection
    content:
      - type: text
        text: "A ∩ B"
rightItems:
  - id: member-desc
    content:
      - type: text
        text: "x is an element of A"
  - id: subset-desc
    content:
      - type: text
        text: "Every element of A is also in B"
  - id: union-desc
    content:
      - type: text
        text: "The collection of elements in A or B"
  - id: intersection-desc
    content:
      - type: text
        text: "The collection of elements common to A and B"
correctPairs:
  - leftId: member
    rightId: member-desc
  - leftId: subset
    rightId: subset-desc
  - leftId: union
    rightId: union-desc
  - leftId: intersection
    rightId: intersection-desc
explanation:
  - type: text
    text: "∈ indicates membership between an element and a set, while ⊆ indicates inclusion between sets. ∪ and ∩ denote union and intersection, respectively."
  - type: text
    text: "It is easier to read the symbols if you first identify whether each side is an element or a set."
tags:
  - discrete-math
  - sets
  - notation
difficulty: 2
