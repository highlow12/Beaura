schemaVersion: 1
id: math.relations.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each relation term with its description."
leftItems:
  - id: product
    content:
      - type: text
        text: "A × B"
  - id: relation
    content:
      - type: text
        text: "R ⊆ A × B"
  - id: domain
    content:
      - type: text
        text: "domain"
  - id: range
    content:
      - type: text
        text: "range"
rightItems:
  - id: product-desc
    content:
      - type: text
        text: "All ordered pairs chosen from A and B"
  - id: relation-desc
    content:
      - type: text
        text: "A collection of ordered pairs selected from a Cartesian product"
  - id: domain-desc
    content:
      - type: text
        text: "The collection of first components in the relation's pairs"
  - id: range-desc
    content:
      - type: text
        text: "The collection of second components in the relation's pairs"
correctPairs:
  - leftId: product
    rightId: product-desc
  - leftId: relation
    rightId: relation-desc
  - leftId: domain
    rightId: domain-desc
  - leftId: range
    rightId: range-desc
explanation:
  - type: text
    text: "A relation uses ordered pairs, so the domain and range are distinguished by first and second components."
  - type: text
    text: "The relation itself is distinct from the full Cartesian product containing it."
tags:
  - discrete-math
  - relations
  - domain-range
difficulty: 2
