id: algo.insertion-sort.steps-01
type: ordering
prompt:
- type: text
  text: "Put the steps in one insertion-sort iteration in order."
items:
- id: key
  content:
  - type: text
    text: "Store the next element as key"
- id: shift
  content:
  - type: text
    text: "Shift earlier elements larger than key to the right"
- id: gap
  content:
  - type: text
    text: "The correct insertion position becomes empty"
- id: place
  content:
  - type: text
    text: "Put key in the empty position"
correctOrder:
- key
- shift
- gap
- place
explanation:
- type: text
  text: "Save the next element, shift larger elements, then put key in the empty position to extend the sorted prefix."
schemaVersion: 1
revision: 1
tags:
- sorting
- insertion-sort
difficulty: 2
