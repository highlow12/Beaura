id: algo.insertion-sort.trace-01
type: code-output
prompt:
- type: text
  text: "Choose the output of this insertion-sort code."
language: python
code: "values = [3, 1, 2]\nfor i in range(1, len(values)):\n    key = values[i]\n    j = i - 1\n    while j >= 0 and values[j] > key:\n        values[j + 1] = values[j]\n        j -= 1\n    values[j + 1] = key\nprint(values)"
choices:
- '[1, 2, 3]'
- '[3, 1, 2]'
- '[2, 1, 3]'
acceptedOutputs:
- '[1, 2, 3]'
explanation:
- type: text
  text: "The code inserts 1 at the front, then inserts 2 between 1 and 3, so the final array is [1, 2, 3]."
schemaVersion: 1
revision: 1
tags:
