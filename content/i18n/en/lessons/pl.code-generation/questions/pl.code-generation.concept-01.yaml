schemaVersion: 1
id: pl.code-generation.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "What must a code generator consider when translating IR into target code?"
options:
  - id: isa-abi
    content:
      - type: text
        text: "The target ISA's instructions and registers, as well as its calling convention"
  - id: comments-only
    content:
      - type: text
        text: "Only the style of source-code comments"
  - id: ui-layout
    content:
      - type: text
        text: "Only the layout of the user interface"
  - id: random-order
    content:
      - type: text
        text: "A random instruction order, regardless of meaning"
correctOptionId: isa-abi
shuffleOptions: true
explanation:
  - type: text
    text: "The generated code must select target instructions, allocate registers, and follow the ABI so callers and callees exchange values correctly."
tags:
  - programming-languages
  - code-generation
  - abi
difficulty: 1
