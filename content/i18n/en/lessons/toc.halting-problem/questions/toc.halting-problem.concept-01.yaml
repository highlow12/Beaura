schemaVersion: 1
id: toc.halting-problem.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: What is the conclusion of the general halting problem?
options:
  - id: undecidable
    content:
      - type: text
        text: There is no algorithm that decides whether every program halts on every input.
  - id: always-easy
    content:
      - type: text
        text: Running a program long enough reveals whether every program halts.
  - id: random-only
    content:
      - type: text
        text: Only randomized programs cannot have their halting status decided.
  - id: finite-input
    content:
      - type: text
        text: A program must halt if its input is finite.
correctOptionId: undecidable
shuffleOptions: true
explanation:
  - type: text
    text: Assuming a halting decider H lets us construct a program that contradicts its prediction about itself, so a general H cannot exist.
tags:
  - theory-of-computation
  - halting-problem
  - undecidability
difficulty: 1
