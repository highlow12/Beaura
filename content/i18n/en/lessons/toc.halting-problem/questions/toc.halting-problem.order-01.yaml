schemaVersion: 1
id: toc.halting-problem.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: Arrange the diagonal argument that refutes the existence of a halting decider H.
items:
  - id: assume-h
    content:
      - type: text
        text: Assume there is an H that decides whether every program halts.
  - id: define-d
    content:
      - type: text
        text: Define D to act opposite to H’s prediction.
  - id: self-run
    content:
      - type: text
        text: Give D itself as input and run D(D).
  - id: contradiction
    content:
      - type: text
        text: Show that either prediction by H contradicts the execution result.
correctOrder:
  - assume-h
  - define-d
  - self-run
  - contradiction
explanation:
  - type: text
    text: The argument first assumes a decider, then constructs a self-referential input that makes the decider’s output contradictory.
tags:
  - theory-of-computation
  - halting-problem
  - proof
difficulty: 3
