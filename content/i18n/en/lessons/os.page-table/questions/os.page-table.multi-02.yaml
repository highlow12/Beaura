schemaVersion: 1
id: os.page-table.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that apply to page tables and the TLB."
options:
  - id: correct-a
    content:
      - type: text
        text: "A TLB miss may require an additional page-table lookup."
  - id: correct-b
    content:
      - type: text
        text: "A page-table entry can include access-permission bits."
  - id: wrong-a
    content:
      - type: text
        text: "A TLB hit always means a page fault occurred."
  - id: wrong-b
    content:
      - type: text
        text: "Existing mappings are reused without any tagging, even when the address space changes."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "A TLB miss may require an additional page-table lookup. A page-table entry can include access-permission bits."
  - type: text
    text: "The TLB reduces translation latency, but it is a small, expensive cache and cannot hold every page. Larger pages increase TLB reach but can also increase internal fragmentation."
tags: [page-table, tlb, mmu]
difficulty: 4
