schemaVersion: 1
id: net.subnet.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that apply to subnets and CIDR."
options:
  - id: correct-a
    content:
      - type: text
        text: "The network address can be calculated by bitwise-ANDing the IP address with the subnet mask."
  - id: correct-b
    content:
      - type: text
        text: "An IPv4 `/24` subnet has a 24-bit prefix and an 8-bit host portion."
  - id: wrong-a
    content:
      - type: text
        text: "The prefix in `/24` is the last 24 bits of the address."
  - id: wrong-b
    content:
      - type: text
        text: "A broadcast address can be freely assigned to a host in any subnet."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "The network address can be calculated by bitwise-ANDing the IP address with the subnet mask. An IPv4 `/24` subnet has a 24-bit prefix and an 8-bit host portion."
  - type: text
    text: "A shorter prefix accommodates more hosts but creates a larger broadcast domain. A longer prefix uses addresses more efficiently but creates more subnets. VLSM and CIDR let networks divide address ranges to fit their needs."
tags: [subnet, cidr, ipv4]
difficulty: 3
