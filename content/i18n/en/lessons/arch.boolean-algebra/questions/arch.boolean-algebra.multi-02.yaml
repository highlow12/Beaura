schemaVersion: 1
id: arch.boolean-algebra.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that describe Boolean algebra and XOR."
options:
  - id: correct-a
    content:
      - type: text
        text: "A XOR A is 0 for every value of A."
  - id: correct-b
    content:
      - type: text
        text: "By De Morgan’s law, NOT(A AND B) equals (NOT A) OR (NOT B)."
  - id: wrong-a
    content:
      - type: text
        text: "A XOR 0 is 0 for every value of A."
  - id: wrong-b
    content:
      - type: text
        text: "Variables in Boolean algebra can take any real value besides 0 and 1."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "A XOR A is 0 for every value of A. By De Morgan’s law, NOT(A AND B) equals (NOT A) OR (NOT B)."
  - type: text
    text: "Simplifying an expression can reduce the number of gates and delay, but missing parentheses or precedence during a transformation can change its meaning. In circuit design, verify the result again with a truth table."
tags: [boolean-algebra, xor, logic]
difficulty: 3
