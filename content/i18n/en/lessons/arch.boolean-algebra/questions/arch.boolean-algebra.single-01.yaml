explanation:
  - type: text
    text: "XOR outputs 1 when exactly one of its two inputs is 1."
  - type: text
    text: "In Boolean algebra, variables are 0 or 1; AND behaves like multiplication, OR like addition, and NOT like complement. XOR produces 1 only when its two inputs differ."
