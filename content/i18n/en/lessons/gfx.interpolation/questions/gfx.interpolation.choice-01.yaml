    text: "When the barycentric weights are (1, 0, 0), which vertex's value is interpolated?"
options:
  - id: first
    content:
      - type: text
        text: "The first vertex"
  - id: second
    content:
      - type: text
        text: "The second vertex"
  - id: average
    content:
      - type: text
        text: "The average of the three vertices"
correctOptionId: first
