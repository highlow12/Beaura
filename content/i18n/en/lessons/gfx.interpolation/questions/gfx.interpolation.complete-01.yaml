schemaVersion: 1
id: gfx.interpolation.complete-01
revision: 1
type: code-completion
prompt:
  - type: text
    text: "Complete the expression that interpolates a value using three weights."
language: python
template: |-
  values = [10, 20, 40]
  weights = [0.5, 0.25, 0.25]
  result = values[0] {{blank:op1}} weights[0] {{blank:op2}} values[1] * weights[1] + values[2] * weights[2]
blanks:
  - id: op1
    choices: ["*", "+", "-"]
    acceptedAnswers: ["*"]
  - id: op2
    choices: ["+", "-", "*"]
    acceptedAnswers: ["+"]
explanation:
  - type: text
    text: "Multiply each vertex value by its corresponding weight, then add the products. The first term is `values[0] * weights[0]`, and the operator between terms is `+`."
tags: [graphics, interpolation, code-completion]
difficulty: 2
