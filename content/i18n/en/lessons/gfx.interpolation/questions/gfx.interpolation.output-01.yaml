schemaVersion: 1
id: gfx.interpolation.output-01
revision: 1
type: code-output
prompt:
  - type: text
    text: "Choose the result of calculating a barycentric weighted sum of three vertex values."
language: python
code: |-
  values = [10, 20, 40]
  weights = [0.5, 0.25, 0.25]
  value = sum(v * w for v, w in zip(values, weights))
  print(value)
choices: ["20.0", "25.0", "70.0"]
acceptedOutputs: ["20.0"]
explanation:
  - type: text
    text: "10×0.5 + 20×0.25 + 40×0.25 = 5 + 5 + 10 = 20.0. Since the weights sum to 1, this is an average-like interpolation."
tags: [graphics, interpolation, barycentric, code-output]
difficulty: 2
