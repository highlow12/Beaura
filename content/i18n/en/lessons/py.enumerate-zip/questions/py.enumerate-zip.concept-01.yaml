id: py.enumerate-zip.concept-01
type: single-choice
prompt:
- type: text
  text: "What does `enumerate(values)` provide during iteration?"
options:
- id: pair
  content:
  - type: text
    text: "A pair containing each item’s index and the item"
- id: value
  content:
  - type: text
    text: "An infinite repetition of item values only"
- id: sort
  content:
  - type: text
    text: "A list with the items automatically sorted"
- id: key
  content:
  - type: text
    text: "A dictionary’s keys and values"
correctOptionId: pair
shuffleOptions: true
explanation:
- type: text
  text: "enumerate creates `(index, value)` pairs so you can iterate over both position and item. If you need only the values, a regular `for` loop is enough."
schemaVersion: 1
revision: 1
tags:
- iteration
- enumerate
- zip
difficulty: 2
