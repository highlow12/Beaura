schemaVersion: 1
id: toc.turing-machine.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: Arrange the steps for a Turing machine to execute one step at the current cell.
items:
  - id: read
    content:
      - type: text
        text: Read the symbol under the head and the current state.
  - id: choose
    content:
      - type: text
        text: Find the matching transition rule.
  - id: write
    content:
      - type: text
        text: Write the specified symbol in the current cell.
  - id: move-state
    content:
      - type: text
        text: Move the head and change to the new state.
correctOrder:
  - read
  - choose
  - write
  - move-state
explanation:
  - type: text
    text: The transition depends on the state and symbol read; then apply the selected rule’s write, move, and state change.
tags:
  - theory-of-computation
  - turing-machine
  - execution
difficulty: 2
