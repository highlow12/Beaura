schemaVersion: 1
id: toc.turing-machine.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: What three actions does a Turing machine transition generally perform?
options:
  - id: write-move-state
    content:
      - type: text
        text: Write a symbol, move the head, and change state.
  - id: delete-input
    content:
      - type: text
        text: Delete all input and choose a state at random.
  - id: push-pop
    content:
      - type: text
        text: Only push and pop symbols on a stack.
  - id: compile-run-stop
    content:
      - type: text
        text: Compile a program and create an executable.
correctOptionId: write-move-state
shuffleOptions: true
explanation:
  - type: text
    text: A transition uses the current state and symbol read to determine the symbol to write, the left or right move, and the new state.
tags:
  - theory-of-computation
  - turing-machine
  - transition
difficulty: 1
