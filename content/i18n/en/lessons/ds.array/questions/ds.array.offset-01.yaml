    content:
      - type: text
        text: "12 bytes"
  - id: offset-3
    content:
      - type: text
        text: "3 bytes"
  - id: offset-16
    content:
      - type: text
        text: "16 bytes"
correctOptionId: offset-12
shuffleOptions: true
explanation:
  - type: text
    text: "The offset of index 3 is 3 × 4 = 12 bytes."
