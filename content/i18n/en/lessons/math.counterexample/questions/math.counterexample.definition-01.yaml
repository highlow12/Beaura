schemaVersion: 1
id: math.counterexample.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "What is needed to disprove the universal statement “`P(x)` holds for every `x`”?"
options:
  - id: one
    content:
      - type: text
        text: "One `x` for which `P(x)` is false"
  - id: all
    content:
      - type: text
        text: "One `x` for which `P(x)` is true"
  - id: average
    content:
      - type: text
        text: "Several `x` values for which `P` is true on average"
  - id: proof
    content:
      - type: text
        text: "A calculation that proves `P`"
correctOptionId: one
shuffleOptions: true
explanation:
  - type: text
    text: "A universal statement is false if its conclusion fails for even one case."
  - type: text
    text: "Also check that the case satisfies the conditions of the statement."
tags:
  - discrete-math
  - proof
  - counterexample
difficulty: 1
