schemaVersion: 1
id: algo.connected-components.trace-01
revision: 1
type: code-output
prompt:
- type: text
  text: "Choose the number of connected components counted by this code."
language: python
code: |-
  graph = {"A": ["B"], "B": ["A"], "C": []}
  seen = set()
  count = 0
  for node in graph:
      if node not in seen:
          count += 1
          stack = [node]
          while stack:
              current = stack.pop()
              if current in seen:
                  continue
              seen.add(current)
              stack.extend(graph[current])
  print(count)
choices:
- '2'
- '1'
- '3'
acceptedOutputs:
- '2'
explanation:
- type: text
  text: "A and B form one component, while C forms another, so the code starts two traversals in total."
