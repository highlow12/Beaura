type: matching
prompt:
- type: text
  text: Match each version control term with its role.
leftItems:
- id: commit
  content:
  - type: text
    text: Commit
- id: branch
  content:
  - type: text
    text: Branch
- id: merge
  content:
  - type: text
    text: Merge
rightItems:
- id: snapshot
  content:
  - type: text
    text: A history snapshot containing a logical change
- id: workflow-name
  content:
  - type: text
    text: A name that points to a particular history for independent work
- id: histories-combine
  content:
  - type: text
    text: The process of combining changes from different histories into one result
correctPairs:
- leftId: commit
  rightId: snapshot
- leftId: branch
  rightId: workflow-name
- leftId: merge
  rightId: histories-combine
explanation:
- type: text
  text: A commit is a unit of recorded history, a branch points to a workflow, and a merge integrates histories.
