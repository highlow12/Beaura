schemaVersion: 1
id: os.mutex.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that apply to mutexes and critical sections."
options:
  - id: correct-a
    content:
      - type: text
        text: "The entire atomic operation that reads and writes shared state must be protected by the same mutex."
  - id: correct-b
    content:
      - type: text
        text: "Other flows may wait if the flow that acquired a mutex does not release it."
  - id: wrong-a
    content:
      - type: text
        text: "A mutex guarantees critical-section safety even when no lock is acquired."
  - id: wrong-b
    content:
      - type: text
        text: "Long I/O operations inside a critical section impose no waiting cost on other flows."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "The entire atomic operation that reads and writes shared state must be protected by the same mutex. Other flows may wait if the flow that acquired a mutex does not release it."
  - type: text
    text: "A mutex provides a simple way to prevent race conditions, but holding a lock too long reduces parallelism, and a bad lock order can cause deadlock. The lock must also be released on exception paths."
tags: [mutex, lock, critical-section]
difficulty: 3
