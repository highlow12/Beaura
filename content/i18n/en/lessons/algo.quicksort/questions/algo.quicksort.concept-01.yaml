id: algo.quicksort.concept-01
type: single-choice
prompt:
- type: text
  text: "What is the role of the pivot in quicksort?"
options:
- id: partition
  content:
  - type: text
    text: "A reference for dividing values into those smaller and larger than it"
- id: minimum
  content:
  - type: text
    text: "A place that always stores the overall minimum"
- id: queue
  content:
  - type: text
    text: "A data structure that removes the next task in FIFO order"
- id: merge
  content:
  - type: text
    text: "A buffer that directly merges two sorted arrays"
correctOptionId: partition
shuffleOptions: true
explanation:
- type: text
  text: "The pivot is the reference used to partition the array. It does not mean the overall minimum or a queue."
schemaVersion: 1
revision: 1
tags:
- sorting
- quicksort
- partition
difficulty: 2
