id: algo.quicksort.trace-01
type: code-output
prompt:
- type: text
  text: "Choose the output of this pivot partition."
language: python
code: 'values = [3, 1, 2]

  pivot = 2

  smaller = [x for x in values if x < pivot]

  larger = [x for x in values if x > pivot]

  print(smaller + [pivot] + larger)'
choices:
- '[1, 2, 3]'
- '[2, 1, 3]'
- '[3, 1, 2]'
acceptedOutputs:
- '[1, 2, 3]'
explanation:
- type: text
  text: "The value 1 is smaller than pivot 2 and goes to the left; 3 is larger and goes to the right. Joining them gives [1, 2, 3]."
schemaVersion: 1
revision: 1
tags:
- sorting
