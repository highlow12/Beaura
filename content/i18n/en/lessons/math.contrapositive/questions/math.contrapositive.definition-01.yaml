schemaVersion: 1
id: math.contrapositive.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "What is the contrapositive of `P → Q`?"
options:
  - id: a
    content:
      - type: text
        text: "Q → P"
  - id: b
    content:
      - type: text
        text: "¬P → ¬Q"
  - id: c
    content:
      - type: text
        text: "¬Q → ¬P"
  - id: d
    content:
      - type: text
        text: "P ∧ Q"
correctOptionId: c
shuffleOptions: true
explanation:
  - type: text
    text: "The contrapositive swaps the antecedent and consequent and negates both: `¬Q → ¬P`."
  - type: text
    text: "`Q → P` is the converse, and `¬P → ¬Q` is the inverse."
tags:
  - discrete-math
  - proof
  - contrapositive
difficulty: 1
