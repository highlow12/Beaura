schemaVersion: 1
id: os.semaphore.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "With a resource semaphore initialized to 3, if three `wait` operations succeed and none has returned its resource, the number of available resources is ___."
choices:
  - "0"
  - "1"
  - "3"
acceptedAnswers:
  - "0"
explanation:
  - type: text
    text: "A semaphore initialized to 3 can represent three available connections. Each successful `wait` decrements the counter; when it reaches 0, additional tasks wait. When a task finishes, `signal` returns the resource so another task can proceed."
tags: [semaphore, synchronization, producer-consumer]
difficulty: 2
