schemaVersion: 1
id: os.semaphore.matching-05
revision: 2
type: matching
prompt:
  - type: text
    text: "Match each semaphore and resource-count term with its role."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "wait"
  - id: left-b
    content:
      - type: text
        text: "signal"
  - id: left-c
    content:
      - type: text
        text: "Counter"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "An operation that acquires a resource or waits when the count is 0"
  - id: right-b
    content:
      - type: text
        text: "An operation that returns a resource and increments the counter"
  - id: right-c
    content:
      - type: text
        text: "A value representing the number of available resources"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "`wait` acquires a resource or waits when the count is 0; `signal` returns a resource and increments the counter; the counter represents the number of available resources."
tags: [semaphore, synchronization, producer-consumer]
difficulty: 2
