schemaVersion: 1
id: arch.pipeline.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that describe pipelines and hazards."
options:
  - id: correct-a
    content:
      - type: text
        text: "A data hazard can occur when a later instruction immediately needs the result of an earlier instruction."
  - id: correct-b
    content:
      - type: text
        text: "A branch misprediction incurs the cost of discarding fetched instructions and refilling the pipeline."
  - id: wrong-a
    content:
      - type: text
        text: "Only one instruction can be present in the pipeline at a time."
  - id: wrong-b
    content:
      - type: text
        text: "A stall makes the pipeline proceed faster despite a hazard."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "A data hazard can occur when a later instruction immediately needs the result of an earlier instruction. A branch misprediction incurs the cost of discarding fetched instructions and refilling the pipeline."
  - type: text
    text: "A deeper pipeline may target a higher clock frequency, but increases hazard and branch-misprediction costs. Real designs consider clock speed, power, prediction accuracy, and circuit complexity together."
tags: [pipeline, hazard, cpu-performance]
difficulty: 4
