schemaVersion: 1
id: db.transactions.output-01
revision: 1
type: code-output
prompt:
  - type: text
    text: "Choose the output balance of this transaction model that restores the previous value on failure."
language: python
code: |-
  balance = 100
  before = balance
  balance -= 30
  transfer_ok = False
  if not transfer_ok:
      balance = before
  print(balance)
choices: ["100", "70", "30"]
acceptedOutputs: ["100"]
explanation:
  - type: text
    text: "Since transfer_ok is False, the balance is restored to before, which is 100. Rollback removes intermediate transaction changes from the final state visible externally."
tags: [database, transactions, rollback, code-output]
difficulty: 2
