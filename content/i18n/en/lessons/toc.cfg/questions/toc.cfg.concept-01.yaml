schemaVersion: 1
id: toc.cfg.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: What form must every production rule in a context-free grammar (CFG) have?
options:
  - id: one-left
    content:
      - type: text
        text: A single nonterminal appears on the left.
  - id: two-terminal-left
    content:
      - type: text
        text: Two terminals appear on the left.
  - id: no-nonterminal
    content:
      - type: text
        text: A nonterminal cannot appear on the right.
  - id: fixed-length
    content:
      - type: text
        text: Every right-hand string must have the same length.
correctOptionId: one-left
shuffleOptions: true
explanation:
  - type: text
    text: In a CFG, one nonterminal can be replaced by a string of symbols regardless of context. The right side may contain both terminals and nonterminals.
tags:
  - theory-of-computation
  - cfg
  - grammar
difficulty: 1
