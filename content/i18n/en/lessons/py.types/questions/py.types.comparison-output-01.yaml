schemaVersion: 1
id: py.types.comparison-output-01
revision: 1
type: code-output
prompt:
  - type: text
    text: "Choose the value printed by the following comparison expression."
language: python
code: |-
  left = 4
  right = 6
  print(left < right)
choices:
  - "True"
  - "False"
  - "6"
acceptedOutputs:
  - "True"
explanation:
  - type: text
    text: "Because 4 is less than 6, `left < right` evaluates to the Boolean value `True`."
