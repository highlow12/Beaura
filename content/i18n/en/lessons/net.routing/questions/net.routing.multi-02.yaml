schemaVersion: 1
id: net.routing.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that apply to routing and next hops."
options:
  - id: correct-a
    content:
      - type: text
        text: "Longest prefix match prefers the longer network prefix."
  - id: correct-b
    content:
      - type: text
        text: "A routing table can include a next hop or output interface."
  - id: wrong-a
    content:
      - type: text
        text: "A configured default route always overrides more specific routes."
  - id: wrong-b
    content:
      - type: text
        text: "Dynamic routing cannot update routes after a link failure."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "Longest prefix match prefers the longer network prefix. A routing table can include a next hop or output interface."
  - type: text
    text: "Static routes are predictable, but they must be updated manually when the topology changes. Dynamic routing can adapt to failures, but requires protocol exchanges and time to converge."
tags: [routing, router, forwarding]
difficulty: 3
