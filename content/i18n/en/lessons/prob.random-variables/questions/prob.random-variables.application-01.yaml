type: multi-select
prompt:
  - type: text
    text: "Select all correct conditions for a probability mass function."
options:
  - id: nonnegative
    content:
      - type: text
        text: "Each probability is nonnegative"
  - id: sum-one
    content:
      - type: text
        text: "The probabilities of all possible values sum to 1"
  - id: discrete
    content:
      - type: text
        text: "It represents the probability of each discrete value"
