schemaVersion: 1
id: pl.virtual-machine.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: What is the main role of a bytecode virtual machine (VM)?
options:
  - id: execute-bytecode
    content:
      - type: text
        text: Interpret portable intermediate instructions or translate them into machine code for execution.
  - id: parse-only
    content:
      - type: text
        text: Only split source code into tokens without executing it.
  - id: hardware-only
    content:
      - type: text
        text: Act as physical CPU hardware that depends on no operating system.
  - id: database
    content:
      - type: text
        text: Permanently store a program's user data in a DBMS.
correctOptionId: execute-bytecode
shuffleOptions: true
explanation:
  - type: text
    text: A VM sits between bytecode and its runtime environment, executing instructions through an interpreter or JIT.
tags:
  - programming-languages
  - virtual-machine
  - bytecode
difficulty: 1
