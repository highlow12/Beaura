schemaVersion: 1
id: pl.virtual-machine.trace-01
revision: 1
type: code-output
prompt:
  - type: text
    text: This code directly computes the PUSH and ADD operations of a stack VM. Choose the value at the top of the final stack.
language: python
code: |-
  stack = []
  stack.append(2)
  stack.append(3)
  right = stack.pop()
  left = stack.pop()
  stack.append(left + right)
  print(stack[-1])
choices:
  - "5"
  - "6"
  - "1"
acceptedOutputs:
  - "5"
explanation:
  - type: text
    text: It pops 3 and 2, adds them to get 5, and pushes that value back, so the final stack's top is 5.
tags:
  - programming-languages
  - virtual-machine
  - trace
difficulty: 1
