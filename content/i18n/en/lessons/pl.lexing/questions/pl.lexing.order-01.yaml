schemaVersion: 1
id: pl.lexing.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: Arrange the lexer tasks for converting a source string into tokens.
items:
  - id: cursor
    content:
      - type: text
        text: Inspect the character at the current cursor position.
  - id: candidate
    content:
      - type: text
        text: Find the token patterns that could match.
  - id: choose
    content:
      - type: text
        text: Choose one using precedence and the longest-match rule.
  - id: emit
    content:
      - type: text
        text: Emit the token and its location, then advance the cursor.
correctOrder:
  - cursor
  - candidate
  - choose
  - emit
explanation:
  - type: text
    text: The lexer must evaluate candidates without consuming input, then commit to one token so overlapping operators and identifiers are handled correctly.
tags:
  - programming-languages
  - lexer
  - pipeline
difficulty: 2
