schemaVersion: 1
id: pl.lexing.trace-01
revision: 1
type: code-output
prompt:
  - type: text
    text: This simple lexer prints the tokens obtained by splitting on whitespace. Choose the result.
language: python
code: |-
  source = "sum = 3"
  tokens = source.split()
  print(len(tokens))
choices:
  - "3"
  - "2"
  - "7"
acceptedOutputs:
  - "3"
explanation:
  - type: text
    text: "Splitting on whitespace yields three tokens: sum, =, and 3. A real lexer also handles operators and source locations more carefully."
tags:
  - programming-languages
  - lexer
  - trace
difficulty: 1
