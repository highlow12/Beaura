schemaVersion: 1
id: algo.traversal.bfs-steps-01
revision: 1
type: ordering
prompt:
- type: text
  text: "Put the basic steps of one BFS iteration in order."
items:
- id: dequeue
  content:
  - type: text
    text: "Remove a node from the front of the queue"
- id: visit
  content:
  - type: text
    text: "Mark the removed node as visited"
- id: enqueue
  content:
  - type: text
    text: "Add unvisited neighbors to the back of the queue"
- id: repeat
  content:
  - type: text
    text: "Repeat until the queue is empty"
correctOrder:
- dequeue
- visit
- enqueue
- repeat
explanation:
- type: text
  text: "BFS repeatedly removes a node from the queue, visits it, and adds its neighbors to the back until the queue is empty."
- type: text
  text: "Checking visited before adding a neighbor prevents the same node from being processed repeatedly in a cycle."
tags:
- traversal
- bfs
- queue
difficulty: 2
