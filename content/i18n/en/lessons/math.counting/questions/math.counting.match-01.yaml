schemaVersion: 1
id: math.counting.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each counting situation with the rule to use."
leftItems:
  - id: exclusive
    content:
      - type: text
        text: "Choose either a bus or a subway"
  - id: sequential
    content:
      - type: text
        text: "Choose one top and one bottom"
  - id: sum
    content:
      - type: text
        text: "Add mutually exclusive cases"
  - id: product
    content:
      - type: text
        text: "Multiply the choices at sequential steps"
rightItems:
  - id: exclusive-desc
    content:
      - type: text
        text: "A situation where the sum rule applies"
  - id: sequential-desc
    content:
      - type: text
        text: "A situation where the product rule applies"
  - id: sum-desc
    content:
      - type: text
        text: "The total across non-overlapping paths"
  - id: product-desc
    content:
      - type: text
        text: "The total combinations across each step"
correctPairs:
  - leftId: exclusive
    rightId: exclusive-desc
  - leftId: sequential
    rightId: sequential-desc
  - leftId: sum
    rightId: sum-desc
  - leftId: product
    rightId: product-desc
explanation:
  - type: text
    text: "Use addition for mutually exclusive choices separated by “or,” and multiplication for steps joined by “and.”"
  - type: text
    text: "It is easier to choose the rule when you translate the connecting words into a choice structure."
tags:
  - discrete-math
  - combinatorics
  - rules
difficulty: 2
