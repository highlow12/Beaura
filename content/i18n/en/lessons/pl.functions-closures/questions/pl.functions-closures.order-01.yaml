schemaVersion: 1
id: pl.functions-closures.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "Arrange the steps for creating and calling a closure with make_adder(2)."
items:
  - id: define-outer
    content:
      - type: text
        text: "The outer function receives n as a parameter."
  - id: define-inner
    content:
      - type: text
        text: "The inner function is defined so that it refers to n."
  - id: return-closure
    content:
      - type: text
        text: "The inner function is returned together with the environment containing n."
  - id: call
    content:
      - type: text
        text: "Call the returned function with 3 to compute n + 3."
correctOrder:
  - define-outer
  - define-inner
  - return-closure
  - call
explanation:
  - type: text
    text: "The returned function must still find n after the outer call has ended, so both the code and its captured environment are preserved."
tags:
  - programming-languages
  - closure
  - execution
difficulty: 2
