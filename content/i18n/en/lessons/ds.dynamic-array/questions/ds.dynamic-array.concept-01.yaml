id: ds.dynamic-array.concept-01
type: single-choice
prompt:
- type: text
  text: "What does capacity mean in a dynamic array?"
options:
- id: reserved
  content:
  - type: text
    text: "The number of allocated storage slots, separate from the current number of elements"
- id: used
  content:
  - type: text
    text: "Only the number of elements currently stored"
- id: index
  content:
  - type: text
    text: "A location that points to a particular element"
- id: hash
  content:
  - type: text
    text: "The result of converting a key to a number"
correctOptionId: reserved
shuffleOptions: true
explanation:
- type: text
  text: "size is the number of elements in use, while capacity is the number of slots allocated before reallocation is needed."
schemaVersion: 1
revision: 1
tags:
- array
- dynamic-array
- amortized
difficulty: 2
