prompt:
  - type: text
    text: "Choose the final applied version after a replica applies the primary’s change log versions 3, 4, and 5 in order."
language: python
code: |-
  primary_version = 5
  replica_version = 2
  for logged_version in [3, 4, 5]:
      replica_version = logged_version
  print(replica_version)
