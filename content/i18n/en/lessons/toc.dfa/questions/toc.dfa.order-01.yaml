schemaVersion: 1
id: toc.dfa.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: Arrange the steps for deciding whether a DFA accepts a string.
items:
  - id: start
    content:
      - type: text
        text: Set the current state to the start state q₀.
  - id: read
    content:
      - type: text
        text: Read the next input symbol from left to right.
  - id: transition
    content:
      - type: text
        text: Update the current state using δ.
  - id: accept-check
    content:
      - type: text
        text: After the input ends, check whether the state is in F.
correctOrder:
  - start
  - read
  - transition
  - accept-check
explanation:
  - type: text
    text: Check whether the state after consuming all symbols is accepting; visiting an accepting state partway through does not decide the result.
tags:
  - theory-of-computation
  - dfa
  - acceptance
difficulty: 2
