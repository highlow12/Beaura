schemaVersion: 1
id: os.context-switch.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "To resume an interrupted task at the exact instruction, the system must save and restore the ___."
choices:
  - "program counter"
  - "file name"
  - "screen resolution"
acceptedAnswers:
  - "program counter"
explanation:
  - type: text
    text: "When a timer interrupts thread A, the system saves A’s program counter (the next instruction) and stack pointer (the current stack location), among other state. If the scheduler chooses B, it restores B’s state and resumes execution. Switching has a cost for saving and restoring state."
tags: [context-switch, scheduler, process]
difficulty: 2
