schemaVersion: 1
id: toc.language.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: Which best describes a language in formal language theory?
options:
  - id: set-of-strings
    content:
      - type: text
        text: A set of strings over an alphabet.
  - id: single-symbol
    content:
      - type: text
        text: A single symbol that can be used.
  - id: machine-state
    content:
      - type: text
        text: The current position of an automaton while it reads input.
  - id: input-number
    content:
      - type: text
        text: A number representing the length of a string.
correctOptionId: set-of-strings
shuffleOptions: true
explanation:
  - type: text
    text: An alphabet is a set of symbols, a string is a sequence of symbols, and a language is a set of strings that satisfy a condition.
