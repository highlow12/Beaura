  text: "Choose the two lines printed by the following Python code."
language: python
code: |-
  numbers = [2, 4]
  numbers.append(6)
  numbers[0] = 3
  print(numbers[1])
  print(len(numbers))
choices:
- '4

  3'
- '3

  3'
- '4

  2'
acceptedOutputs:
