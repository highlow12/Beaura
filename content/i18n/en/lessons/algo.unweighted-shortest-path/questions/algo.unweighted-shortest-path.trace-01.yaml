schemaVersion: 1
id: algo.unweighted-shortest-path.trace-01
revision: 1
type: code-output
prompt:
- type: text
  text: "Choose the shortest distance from A to D recorded by BFS."
language: python
code: |-
  graph = {"A": ["B", "C"], "B": ["D"], "C": ["D"], "D": []}
  distance = {"A": 0}
  queue = ["A"]
  while queue:
      current = queue.pop(0)
      for nxt in graph[current]:
          if nxt not in distance:
              distance[nxt] = distance[current] + 1
              queue.append(nxt)
  print(distance["D"])
choices:
- '2'
- '1'
- '3'
acceptedOutputs:
- '2'
explanation:
- type: text
  text: "It takes one edge to reach B or C from A and one more edge to reach D, so the distance to D is 2."
tags:
- graph
