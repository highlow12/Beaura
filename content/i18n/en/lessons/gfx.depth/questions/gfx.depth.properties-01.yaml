schemaVersion: 1
id: gfx.depth.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all correct statements about the depth buffer."
options:
  - id: opaque
    content:
      - type: text
        text: "It is useful for determining visibility among opaque surfaces."
  - id: transparent-limit
    content:
      - type: text
        text: "Correctly blending translucent colors must be handled separately."
  - id: precision
    content:
      - type: text
        text: "Insufficient depth precision can cause z-fighting."
  - id: only-color
    content:
      - type: text
        text: "The depth buffer stores only color channels."
correctOptionIds: [opaque, transparent-limit, precision]
shuffleOptions: true
explanation:
  - type: text
    text: "The depth buffer works well for opaque visibility but does not replace translucent blending. Quantizing nearby depth values also creates a risk of z-fighting."
tags: [graphics, depth-buffer, transparency]
difficulty: 3
