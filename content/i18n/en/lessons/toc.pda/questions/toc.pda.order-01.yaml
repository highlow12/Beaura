schemaVersion: 1
id: toc.pda.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "Arrange the input-processing steps of a PDA that recognizes `a^n b^n`."
items:
  - id: push-as
    content:
      - type: text
        text: Push a marker each time an `a` is read.
  - id: switch-phase
    content:
      - type: text
        text: Switch to processing the b-part when the first `b` is read.
  - id: pop-bs
    content:
      - type: text
        text: Pop a marker each time a `b` is read.
  - id: verify
    content:
      - type: text
        text: Check both input completion and the stack condition.
correctOrder:
  - push-as
  - switch-phase
  - pop-bs
  - verify
explanation:
  - type: text
    text: The two parts must have separate roles so that after reading `b`s, the stored count of `a`s can be consumed one at a time.
tags:
  - theory-of-computation
  - pda
  - simulation
difficulty: 2
