schemaVersion: 1
id: algo.sort.bubble-output-01
revision: 1
type: code-output
prompt:
- type: text
  text: "Choose the output of this bubble-sort code."
language: python
code: |-
  values = [3, 1, 2]
  for i in range(len(values)):
      for j in range(len(values) - 1 - i):
          if values[j] > values[j + 1]:
              values[j], values[j + 1] = values[j + 1], values[j]
  print(values)
choices:
- '[1, 2, 3]'
- '[3, 2, 1]'
- '[1, 3, 2]'
acceptedOutputs:
- '[1, 2, 3]'
explanation:
- type: text
  text: "In the first pass, 3 moves to the right; the next comparison puts 2 in order, producing [1, 2, 3]."
- type: text
  text: "The key step in bubble sort is swapping adjacent values when the condition is true."
tags:
- sorting
- bubble-sort
