schemaVersion: 1
id: toc.nfa.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: When does an NFA accept an input string?
options:
  - id: one-accepting-path
    content:
      - type: text
        text: It accepts if at least one possible path ends in an accepting state.
  - id: all-paths
    content:
      - type: text
        text: Every possible path must end in an accepting state.
  - id: random-path
    content:
      - type: text
        text: A randomly chosen path must end in an accepting state.
  - id: first-state
    content:
      - type: text
        text: It accepts every input if the start state is accepting.
correctOptionId: one-accepting-path
shuffleOptions: true
explanation:
  - type: text
    text: An NFA represents possible paths, so one accepting path is enough for it to accept a string.
tags:
  - theory-of-computation
  - nfa
  - acceptance
difficulty: 1
