type: fill-blank
prompt:
  - type: text
    text: "The probability of rolling an even number on a fair die is 3/6=___."
choices:
  - "0"
  - "1/3"
  - "1/2"
  - "1"
acceptedAnswers:
  - "1/2"
explanation:
  - type: text
    text: "There are 3 even outcomes among 6 possible outcomes, so the probability is 1/2."
  - type: text
    text: "You can simplify the fraction by dividing the numerator and denominator by the same number."
