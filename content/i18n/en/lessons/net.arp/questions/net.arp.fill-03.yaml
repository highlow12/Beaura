schemaVersion: 1
id: net.arp.fill-03
revision: 2
type: fill-blank
prompt:
- type: text
  text: When sending to a server on another network, the first Ethernet frame needs the MAC address of the ___.
choices:
- default gateway
- final server
- authoritative DNS server
acceptedAnswers:
- default gateway
explanation:
- type: text
  text: Suppose Host A wants to send data to `192.168.1.20` on the same LAN but does not know its MAC address. A broadcasts
    an ARP request on the local link. When the device with that IP replies, A stores the IP-to-MAC mapping in its cache. If
    the destination is on another network, A looks up the default gateway’s MAC address and sends the first frame there instead
    of sending it directly to the final server.
tags:
- arp
- ipv4
- mac
difficulty: 2
