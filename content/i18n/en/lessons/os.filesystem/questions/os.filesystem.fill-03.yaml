schemaVersion: 1
id: os.filesystem.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "The per-process handle that refers to an open file is a ___."
choices:
  - "file descriptor"
  - "file extension"
  - "directory name"
acceptedAnswers:
  - "file descriptor"
explanation:
  - type: text
    text: "To open `/home/a/note.txt`, the system follows the names from the root through `home` and `a` to `note.txt`. A directory maps names to files or subdirectories, while metadata stores information such as size and permissions. A file descriptor is a per-process handle that refers to an open file."
tags: [filesystem, file, directory]
difficulty: 2
