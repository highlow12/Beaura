schemaVersion: 1
id: os.filesystem.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that apply to files, directories, and file systems."
options:
  - id: correct-a
    content:
      - type: text
        text: "File metadata can include size, owner, permissions, and block locations."
  - id: correct-b
    content:
      - type: text
        text: "The current position in an open file can be stored in its file descriptor or open-file state."
  - id: wrong-a
    content:
      - type: text
        text: "A file system stores no mapping between file names and file contents."
  - id: wrong-b
    content:
      - type: text
        text: "A file can always be found by checking only one directory level in its path."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "File metadata can include size, owner, permissions, and block locations. The current position in an open file can be stored in its file descriptor or open-file state."
  - type: text
    text: "A file system uses block allocation and caching for convenience, but must also manage metadata consistency, permissions, and recovery from failures. With many small files, directory lookups and metadata can add overhead."
tags: [filesystem, file, directory]
difficulty: 3
