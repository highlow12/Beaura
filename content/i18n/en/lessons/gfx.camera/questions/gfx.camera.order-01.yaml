schemaVersion: 1
id: gfx.camera.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "Put the basic look-at direction calculations in order."
items:
  - id: direction
    content:
      - type: text
        text: "Find the viewing direction with target - eye."
  - id: basis
    content:
      - type: text
        text: "Build an orthogonal basis from the direction and up."
  - id: matrix
    content:
      - type: text
        text: "Build the view matrix from the basis and camera position."
  - id: transform
    content:
      - type: text
        text: "Apply the view matrix to the world-space point."
correctOrder: [direction, basis, matrix, transform]
explanation:
  - type: text
    text: "First determine the viewing direction, build a matching basis and matrix, and then transform the point."
tags: [graphics, camera, look-at, order]
difficulty: 3
