schemaVersion: 1
id: math.functions.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each function classification with its criterion."
leftItems:
  - id: function
    content:
      - type: text
        text: "Function"
  - id: injective
    content:
      - type: text
        text: "Injective"
  - id: surjective
    content:
      - type: text
        text: "Surjective"
  - id: bijective
    content:
      - type: text
        text: "bijective"
rightItems:
  - id: function-desc
    content:
      - type: text
        text: "Exactly one output for each input"
  - id: injective-desc
    content:
      - type: text
        text: "Different inputs have different outputs"
  - id: surjective-desc
    content:
      - type: text
        text: "Every codomain value appears at least once"
