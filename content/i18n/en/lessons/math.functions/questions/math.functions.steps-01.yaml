schemaVersion: 1
id: math.functions.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "Arrange the steps for checking whether a function is surjective with an arrow diagram."
items:
  - id: list-codomain
    content:
      - type: text
        text: "List every element of the codomain"
  - id: trace
    content:
      - type: text
        text: "Count the arrows entering each codomain element"
  - id: decide
    content:
      - type: text
        text: "Classify it as surjective if every element has at least one arrow"
correctOrder:
  - list-codomain
  - trace
  - decide
explanation:
  - type: text
    text: "Surjectivity checks that there are no unused outputs in the codomain."
  - type: text
    text: "Several arrows entering one element do not determine surjectivity; they are related to injectivity."
tags:
  - discrete-math
  - functions
  - surjective
difficulty: 2
