schemaVersion: 1
id: algo.search.linear-steps-01
revision: 2
type: ordering
prompt:
  - type: text
    text: "Put the steps for finding target with linear search in order."
items:
  - id: inspect
    content:
      - type: text
        text: "Check the element at the current position"
  - id: compare
    content:
      - type: text
        text: "Compare the element with target"
  - id: decide
    content:
      - type: text
        text: "If they match, return the position. Otherwise, move to the next position and repeat. If the search reaches the end, report that the target was not found."
correctOrder:
  - inspect
  - compare
  - decide
explanation:
  - type: text
    text: "Check the current element and compare it with target. Return the position if they match; otherwise, move to the next element. If the search reaches the end without a match, report that the target was not found."
tags:
  - search
  - linear-search
  - execution-order
difficulty: 2
