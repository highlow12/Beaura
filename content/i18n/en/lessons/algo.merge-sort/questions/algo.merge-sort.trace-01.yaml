id: algo.merge-sort.trace-01
type: code-output
prompt:
- type: text
  text: "Choose the result of merging these two sorted lists."
language: python
code: "left = [1, 4]\nright = [2, 3]\nresult = []\ni = j = 0\nwhile i < len(left) and j < len(right):\n    if left[i] <= right[j]:\n        result.append(left[i]); i += 1\n    else:\n        result.append(right[j]); j += 1\nresult += left[i:]\nresult += right[j:]\nprint(result)"
choices:
- '[1, 2, 3, 4]'
- '[1, 4, 2, 3]'
- '[2, 3, 1, 4]'
acceptedOutputs:
- '[1, 2, 3, 4]'
explanation:
- type: text
  text: "Add the smaller of the first remaining elements to the result each time, then append the leftovers. The result is [1, 2, 3, 4]."
