id: algo.heap-sort.trace-01
type: code-output
prompt:
- type: text
  text: "Choose the output of this heap-sort code."
language: python
code: 'import heapq

  values = [3, 1, 2]

  heapq.heapify(values)

  ordered = [heapq.heappop(values) for _ in range(len(values))]

  print(ordered)'
choices:
- '[1, 2, 3]'
- '[3, 2, 1]'
- '[1, 3, 2]'
acceptedOutputs:
- '[1, 2, 3]'
explanation:
- type: text
  text: "The code removes the minimum three times from a min-heap, so ordered is [1, 2, 3] in ascending order."
