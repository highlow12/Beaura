schemaVersion: 1
id: net.tls.matching-05
revision: 2
type: matching
prompt:
  - type: text
    text: "Match each TLS and certificate term with its role."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "Certificate"
  - id: left-b
    content:
      - type: text
        text: "Session key"
  - id: left-c
    content:
      - type: text
        text: "Certificate authority"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "A credential that binds a public key to a server identity"
  - id: right-b
    content:
      - type: text
        text: "A temporary symmetric key used to encrypt connection data"
  - id: right-c
    content:
      - type: text
        text: "A trusted party that verifies certificate signatures"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "A certificate binds a public key to a server identity; a session key is a temporary symmetric key used to encrypt connection data; a certificate authority is a trusted party that verifies certificate signatures."
tags: [tls, https, security]
difficulty: 2
