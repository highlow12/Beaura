schemaVersion: 1
id: db.joins.output-01
revision: 1
type: code-output
prompt:
  - type: text
    text: "Choose the result length of this LEFT JOIN model: it repeats a student’s name for each enrollment and uses None when there is no enrollment."
language: python
code: |-
  students = [("A", 1), ("B", 2)]
  enrollments = [(1, "CS"), (1, "Math")]
  joined = []
  for name, student_id in students:
      matches = [course for sid, course in enrollments if sid == student_id]
      joined.extend((name, course) for course in (matches or [None]))
  print(len(joined))
choices: ["3", "2", "1"]
acceptedOutputs: ["3"]
explanation:
  - type: text
    text: "A matches two courses and produces two rows. B has no match and remains as one row with None, so the result has 3 rows. This illustrates how LEFT JOIN preserves left-side rows."
tags: [database, sql, joins, code-output]
difficulty: 3
