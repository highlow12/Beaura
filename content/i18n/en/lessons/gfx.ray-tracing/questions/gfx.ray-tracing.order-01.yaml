schemaVersion: 1
id: gfx.ray-tracing.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "Arrange the steps for testing the direct shadow of a pixel in order."
items:
  - id: primary-ray
    content:
      - type: text
        text: "Create a ray from the camera through the pixel"
  - id: hit
    content:
      - type: text
        text: "Find the nearest surface intersection"
  - id: shadow-ray
    content:
      - type: text
        text: "Create a shadow ray from the intersection toward the light"
  - id: occlusion
    content:
      - type: text
        text: "Check whether another object lies between the intersection and the light"
  - id: shade
    content:
      - type: text
        text: "Calculate the color based on whether the light is occluded"
correctOrder: [primary-ray, hit, shadow-ray, occlusion, shade]
explanation:
  - type: text
    text: "First find the visible surface, then test visibility from that point to the light, and use the result to calculate lighting."
tags: [graphics, ray-tracing, shadows, order]
difficulty: 3
