schemaVersion: 1
id: pl.runtime-gc.trace-01
revision: 1
type: code-output
prompt:
  - type: text
    text: In this graph, mark only objects reachable from root. How many objects are reclaimed after sweep?
language: python
code: |-
  references = {"root": {"a"}, "a": set(), "orphan": set()}
  reachable = {"root", "a"}
  collected = set(references) - reachable
  print(len(collected))
choices:
  - "1"
  - "2"
  - "0"
acceptedOutputs:
  - "1"
explanation:
  - type: text
    text: The object a is reachable from root, but orphan is not. Therefore, one object is reclaimed.
tags:
  - programming-languages
  - garbage-collection
  - trace
difficulty: 2
