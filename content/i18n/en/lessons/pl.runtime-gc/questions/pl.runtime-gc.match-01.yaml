schemaVersion: 1
id: pl.runtime-gc.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: Match each mark-sweep garbage-collection term with its description.
leftItems:
  - id: root
    content:
      - type: text
        text: Root
  - id: mark
    content:
      - type: text
        text: Mark
  - id: sweep
    content:
      - type: text
        text: Sweep
rightItems:
  - id: entry-points
    content:
      - type: text
        text: A reference that starts traversal from the stack or globals
  - id: reachable
    content:
      - type: text
        text: Mark an object that is reachable
  - id: reclaim
    content:
      - type: text
        text: Reclaim objects that have not been marked
correctPairs:
  - leftId: root
    rightId: entry-points
  - leftId: mark
    rightId: reachable
  - leftId: sweep
    rightId: reclaim
explanation:
  - type: text
    text: Mark-sweep separates root traversal from heap cleanup, so an isolated cycle of objects that reference each other can still be reclaimed.
