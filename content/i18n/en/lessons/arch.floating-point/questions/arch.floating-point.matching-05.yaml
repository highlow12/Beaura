schemaVersion: 1
id: arch.floating-point.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each floating-point term with its role."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "sign"
  - id: left-b
    content:
      - type: text
        text: "exponent"
  - id: left-c
    content:
      - type: text
        text: "significand"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "The field that indicates whether the value is positive or negative"
  - id: right-b
    content:
      - type: text
        text: "The field that controls the decimal point position and range"
  - id: right-c
    content:
      - type: text
        text: "The field that holds the precision of the significant digits"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "The sign field indicates whether the value is positive or negative, and the exponent field controls the decimal point position and range."
  - type: text
    text: "The significand field holds the precision of the significant digits, so distinguish these three roles."
