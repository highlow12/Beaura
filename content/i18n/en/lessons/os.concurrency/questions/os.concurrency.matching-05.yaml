schemaVersion: 1
id: os.concurrency.matching-05
revision: 2
type: matching
prompt:
  - type: text
    text: "Match each concurrency and atomicity term with its role."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "Concurrency"
  - id: left-b
    content:
      - type: text
        text: "Parallelism"
  - id: left-c
    content:
      - type: text
        text: "Atomicity"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "A structure in which multiple tasks can overlap in progress"
  - id: right-b
    content:
      - type: text
        text: "The property of multiple cores executing tasks at the same time"
  - id: right-c
    content:
      - type: text
        text: "The property of an operation being one indivisible observable unit"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "Concurrency allows multiple tasks to overlap in progress; parallelism means multiple cores actually execute at the same time; atomicity means an operation behaves as one indivisible observable unit."
