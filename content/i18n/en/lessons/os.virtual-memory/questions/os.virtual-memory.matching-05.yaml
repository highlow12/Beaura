schemaVersion: 1
id: os.virtual-memory.matching-05
revision: 2
type: matching
prompt:
  - type: text
    text: "Match each virtual-memory term with its role."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "Virtual page"
  - id: left-b
    content:
      - type: text
        text: "Physical frame"
  - id: left-c
    content:
      - type: text
        text: "page fault"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "A fixed-size address block visible to a process"
  - id: right-b
    content:
      - type: text
        text: "A block in RAM that holds a page"
  - id: right-c
    content:
      - type: text
        text: "An exception raised when the required page mapping is unavailable"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "A virtual page is a fixed-size address block visible to a process; a physical frame is a block in RAM that holds a page; a page fault is raised when the required page mapping is unavailable."
tags: [virtual-memory, page, memory-protection]
difficulty: 2
