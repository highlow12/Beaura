schemaVersion: 1
id: os.virtual-memory.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that apply to virtual memory."
options:
  - id: correct-a
    content:
      - type: text
        text: "A page fault can occur when the physical frame needed for an accessed page is not currently available."
  - id: correct-b
    content:
      - type: text
        text: "Virtual memory helps separate address spaces between processes."
  - id: wrong-a
    content:
      - type: text
        text: "Every page in a virtual address space must be loaded into RAM as soon as the program starts."
  - id: wrong-b
    content:
      - type: text
        text: "Virtual memory cannot be used with memory-protection permissions."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "A page fault can occur when the physical frame needed for an accessed page is not currently available. Virtual memory helps separate address spaces between processes."
  - type: text
    text: "Virtual memory enables protection, sharing, and overcommit, but address translation and page faults are costly. If RAM is insufficient and faults happen repeatedly, thrashing can occur."
tags: [virtual-memory, page, memory-protection]
difficulty: 3
