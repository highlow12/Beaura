- id: host
  content:
  - type: text
    text: Host
- id: packet
  content:
  - type: text
    text: Packet
- id: protocol
  content:
  - type: text
    text: Protocol
rightItems:
- id: endpoint
  content:
  - type: text
    text: An endpoint device that produces or consumes data
- id: unit
  content:
  - type: text
    text: A small unit of data delivered across a network
- id: rules
