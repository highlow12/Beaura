prompt:
  - type: text
    text: "Which statement about registers and state storage is most accurate?"
options:
  - id: correct
    content:
      - type: text
        text: "A register is a limited-width storage location inside the CPU that stores frequently used values with low latency."
  - id: wrong-a
    content:
      - type: text
        text: "Registers preserve every file when powered off, like an SSD."
  - id: wrong-b
