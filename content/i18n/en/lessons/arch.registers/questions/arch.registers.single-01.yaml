explanation:
  - type: text
    text: "A register is a limited-width storage location inside the CPU that stores frequently used values with low latency."
  - type: text
    text: "Registers are very small storage locations built from groups of flip-flops. They hold instruction operands, addresses, and intermediate results, and may have defined purposes and bit widths."
