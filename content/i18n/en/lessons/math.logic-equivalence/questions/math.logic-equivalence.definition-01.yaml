schemaVersion: 1
id: math.logic-equivalence.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "Which expression is logically equivalent to ¬(P ∧ Q)?"
options:
  - id: a
    content:
      - type: text
        text: "¬P ∧ ¬Q"
  - id: b
    content:
      - type: text
        text: "¬P ∨ ¬Q"
  - id: c
    content:
      - type: text
        text: "P ∨ Q"
  - id: d
    content:
      - type: text
        text: "P ∧ ¬Q"
correctOptionId: b
shuffleOptions: true
explanation:
  - type: text
    text: "When an entire AND expression is negated, De Morgan's law negates each term and connects them with OR."
  - type: text
    text: "Therefore, ¬(P ∧ Q) is equivalent to ¬P ∨ ¬Q."
tags:
  - discrete-math
  - logic
  - demorgan
difficulty: 1
