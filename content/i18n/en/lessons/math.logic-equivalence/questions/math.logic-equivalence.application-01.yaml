schemaVersion: 1
id: math.logic-equivalence.application-01
revision: 2
type: multi-select
prompt:
  - type: text
    text: "Select all logical expressions below that are in DNF."
options:
  - id: dnf-one
    content:
      - type: text
        text: "(P ∧ Q) ∨ R"
  - id: dnf-two
    content:
      - type: text
        text: "(¬P ∧ R) ∨ (Q ∧ S)"
  - id: cnf-one
    content:
      - type: text
        text: "(P ∨ Q) ∧ R"
  - id: plain
    content:
      - type: text
        text: "P ∧ Q"
correctOptionIds: [dnf-one, dnf-two, plain]
shuffleOptions: true
explanation:
  - type: text
    text: "DNF combines one or more AND terms with OR. P ∧ Q is also DNF even though it has only one term."
  - type: text
    text: "(P ∨ Q) ∧ R is in CNF."
tags:
  - discrete-math
  - logic
  - dnf
difficulty: 2
