schemaVersion: 1
id: math.logic-equivalence.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each logical form with its characteristic."
leftItems:
  - id: cnf
    content:
      - type: text
        text: "CNF"
  - id: dnf
    content:
      - type: text
        text: "DNF"
  - id: demorgan-and
    content:
      - type: text
        text: "¬(P ∧ Q)"
  - id: demorgan-or
    content:
      - type: text
        text: "¬(P ∨ Q)"
rightItems:
  - id: cnf-desc
    content:
      - type: text
        text: "A form that combines OR clauses with AND"
  - id: dnf-desc
    content:
      - type: text
        text: "A form that combines AND terms with OR"
  - id: and-desc
    content:
      - type: text
        text: "Transforms into ¬P ∨ ¬Q"
  - id: or-desc
    content:
      - type: text
        text: "Transforms into ¬P ∧ ¬Q"
correctPairs:
  - leftId: cnf
    rightId: cnf-desc
  - leftId: dnf
    rightId: dnf-desc
  - leftId: demorgan-and
    rightId: and-desc
  - leftId: demorgan-or
    rightId: or-desc
explanation:
  - type: text
    text: "CNF and DNF differ in the outer operator that connects their clauses or terms, while De Morgan's laws switch AND and OR when negating."
  - type: text
    text: "When reading a form, examine the terms inside the parentheses and the outer connecting operator separately."
tags:
  - discrete-math
  - logic
  - cnf
  - dnf
difficulty: 2
