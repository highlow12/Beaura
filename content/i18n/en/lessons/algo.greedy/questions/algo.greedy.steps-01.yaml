schemaVersion: 1
id: algo.greedy.steps-01
revision: 1
type: ordering
prompt:
- type: text
  text: "Put the activity-selection greedy algorithm steps in order."
items:
- id: sort
  content:
  - type: text
    text: "Sort activities by finish time"
- id: candidate
  content:
  - type: text
    text: "Examine the next activity not yet considered"
- id: compatible
  content:
  - type: text
    text: "Select the activity if it does not overlap with the last selection"
- id: boundary
  content:
  - type: text
    text: "Update the last finish time"
correctOrder:
- sort
- candidate
- compatible
- boundary
explanation:
- type: text
  text: "Considering activities in order of finish time and selecting only compatible ones leaves room for more activities."
tags:
- greedy
- activity-selection
- execution-order
difficulty: 2
