schemaVersion: 1
id: algo.greedy.trace-01
revision: 1
type: code-output
prompt:
- type: text
  text: "Choose how many activities the greedy algorithm selects from this list sorted by finish time."
language: python
code: |-
  activities = [(1, 3), (2, 4), (3, 5)]
  last_finish = 0
  count = 0
  for start, finish in activities:
      if start >= last_finish:
          count += 1
          last_finish = finish
  print(count)
choices:
- '2'
- '1'
- '3'
acceptedOutputs:
- '2'
explanation:
- type: text
  text: "After selecting (1, 3), skip (2, 4) because it overlaps, then select (3, 5), for a total of two activities."
tags:
- greedy
- activity-selection
- code-output
difficulty: 3
