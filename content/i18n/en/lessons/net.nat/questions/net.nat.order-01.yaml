schemaVersion: 1
id: net.nat.order-01
revision: 1
type: ordering
prompt:
- type: text
  text: Arrange the steps that occur when a response returns to a request sent by an internal device.
items:
- id: outbound
  content:
  - type: text
    text: The router translates the internal source address and port.
- id: remember
  content:
  - type: text
    text: The router records the translation mapping in a table.
- id: response
  content:
  - type: text
    text: The response arrives at the public address and translated port.
- id: restore
  content:
  - type: text
    text: The router restores the original internal destination and forwards the response.
correctOrder:
- outbound
- remember
- response
- restore
explanation:
- type: text
  text: The router must translate the outgoing packet and remember the mapping so it can restore the response destination
    to the original internal socket.
tags:
- network
- nat
- packet-flow
difficulty: 3
