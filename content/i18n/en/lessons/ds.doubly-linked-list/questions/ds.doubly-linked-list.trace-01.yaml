id: ds.doubly-linked-list.trace-01
type: code-output
prompt:
- type: text
  text: "Choose the output of the following bidirectional-link code."
language: python
code: 'second = {"value": "B", "prev": None, "next": None}

  first = {"value": "A", "prev": None, "next": second}

  second["prev"] = first

  print(second["prev"]["value"])'
choices:
- A
- B
- None
acceptedOutputs:
- A
explanation:
- type: text
  text: "Since second.prev points to first, the value of the prev node, A, is printed."
