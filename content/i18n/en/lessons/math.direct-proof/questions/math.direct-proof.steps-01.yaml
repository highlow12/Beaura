schemaVersion: 1
id: math.direct-proof.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "Arrange the steps in a direct proof that the sum of two even numbers is even."
items:
  - id: represent
    content:
      - type: text
        text: "Write the two even numbers as `2m` and `2n`"
  - id: add
    content:
      - type: text
        text: "Write the sum as `2m + 2n`"
  - id: factor
    content:
      - type: text
        text: "Factor it as `2(m + n)`"
  - id: conclude
    content:
      - type: text
        text: "Conclude that it is even because it is a multiple of 2"
correctOrder:
  - represent
  - add
  - factor
  - conclude
explanation:
  - type: text
    text: "Substituting the definition of even numbers and factoring out 2 gives an expression that matches the definition of even."
  - type: text
    text: "Avoid skipping equations so that each step justifies the next."
tags:
  - discrete-math
  - proof
  - proof-steps
difficulty: 2
