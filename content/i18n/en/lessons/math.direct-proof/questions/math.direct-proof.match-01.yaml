schemaVersion: 1
id: math.direct-proof.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each element of a direct proof with its role."
leftItems:
  - id: assumption
    content:
      - type: text
        text: "Assumption"
  - id: definition
    content:
      - type: text
        text: "definition"
  - id: derivation
    content:
      - type: text
        text: "Derivation"
  - id: conclusion
    content:
      - type: text
        text: "Conclusion"
rightItems:
  - id: assumption-desc
    content:
      - type: text
        text: "A condition assumed true at the start of a proof"
  - id: definition-desc
    content:
      - type: text
        text: "A precise description of an object"
  - id: derivation-desc
    content:
      - type: text
        text: "The process of deriving the next statement from a reason"
  - id: conclusion-desc
    content:
      - type: text
        text: "The statement that the original goal holds"
correctPairs:
  - leftId: assumption
    rightId: assumption-desc
  - leftId: definition
    rightId: definition-desc
  - leftId: derivation
    rightId: derivation-desc
  - leftId: conclusion
    rightId: conclusion-desc
explanation:
  - type: text
    text: "A direct proof starts with assumptions and definitions, then derives the goal conclusion."
  - type: text
    text: "If reasons for intermediate steps are missing, the calculation may be correct but the proof may be incomplete."
tags:
  - discrete-math
  - proof
  - proof-structure
difficulty: 2
