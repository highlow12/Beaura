schemaVersion: 1
id: math.direct-proof.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "What is the usual starting point for a direct proof?"
options:
  - id: assume
    content:
      - type: text
        text: "Assume that the statement's hypothesis is true"
  - id: deny
    content:
      - type: text
        text: "Declare the conclusion false"
  - id: sample
    content:
      - type: text
        text: "Calculate just one example"
  - id: guess
    content:
      - type: text
        text: "Guess the conclusion first and stop"
correctOptionId: assume
shuffleOptions: true
explanation:
  - type: text
    text: "A direct proof starts from the hypothesis and logically derives the conclusion."
  - type: text
    text: "A proof by contradiction or counterexample starts differently, but one example cannot prove a general statement."
tags:
  - discrete-math
  - proof
  - direct-proof
difficulty: 1
