schemaVersion: 1
id: math.direct-proof.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all expressions that can be used in a direct proof of “the sum of two odd numbers is even.”"
options:
  - id: odd-m
    content:
      - type: text
        text: "Write the first odd number as `2m + 1`"
  - id: odd-n
    content:
      - type: text
        text: "Write the second odd number as `2n + 1`"
  - id: sum
    content:
      - type: text
        text: "Simplify the sum to `2(m + n + 1)`"
  - id: even-form
    content:
      - type: text
        text: "Simplify the sum to `2k + 1`"
correctOptionIds: [odd-m, odd-n, sum]
shuffleOptions: true
explanation:
  - type: text
    text: "Using the definition of odd numbers, write their sum as `2m + 1 + 2n + 1 = 2(m + n + 1)`."
  - type: text
    text: "The final expression is a multiple of 2, so it satisfies the definition of an even number."
tags:
  - discrete-math
  - proof
  - parity
difficulty: 2
