schemaVersion: 1
id: toc.complexity.trace-01
revision: 1
type: code-output
prompt:
  - type: text
    text: This verifier checks whether every edge in a candidate path belongs to the graph. Choose the output.
language: python
code: |-
  edges = {("A", "B"), ("B", "C")}
  candidate = [("A", "B"), ("B", "C")]
  print(all(edge in edges for edge in candidate))
choices:
  - "True"
  - "False"
  - "2"
acceptedOutputs:
  - "True"
explanation:
  - type: text
    text: Both edges in the candidate are in `edges`, so verification returns True. Finding a candidate and verifying one are different tasks.
tags:
  - theory-of-computation
  - complexity
  - verifier
difficulty: 2
