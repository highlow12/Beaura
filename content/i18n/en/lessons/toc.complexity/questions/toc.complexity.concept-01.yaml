schemaVersion: 1
id: toc.complexity.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: What is the key condition for a decision problem to be in NP?
options:
  - id: verify-poly
    content:
      - type: text
        text: Given a candidate solution, it can be verified in polynomial time.
  - id: solve-constant
    content:
      - type: text
        text: A solution can always be found directly in constant time.
  - id: no-certificate
    content:
      - type: text
        text: No candidate solution or verification procedure is needed.
  - id: only-random
    content:
      - type: text
        text: It can only be solved by a randomized algorithm.
correctOptionId: verify-poly
shuffleOptions: true
explanation:
  - type: text
    text: NP is defined by a procedure for quickly verifying a candidate solution. It does not mean that the candidate can be found quickly.
tags:
  - theory-of-computation
  - complexity
  - np
difficulty: 1
