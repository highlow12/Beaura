id: py.sets.match-01
type: matching
prompt:
- type: text
  text: "Match each set expression with its meaning."
leftItems:
- id: membership
  content:
  - type: text
    text: item in values
- id: union
  content:
  - type: text
    text: left | right
- id: intersection
  content:
  - type: text
    text: left & right
rightItems:
- id: contains
  content:
  - type: text
    text: "Checks whether a value is present"
- id: combine
  content:
  - type: text
    text: "Combines all items from two sets"
- id: common
  content:
  - type: text
    text: "Finds the items shared by two sets"
correctPairs:
- leftId: membership
  rightId: contains
- leftId: union
  rightId: combine
- leftId: intersection
  rightId: common
explanation:
- type: text
  text: "in checks membership, | computes a union, and & computes an intersection. All three operations work with sets of unique items."
schemaVersion: 1
revision: 1
tags:
- collections
- set
difficulty: 2
