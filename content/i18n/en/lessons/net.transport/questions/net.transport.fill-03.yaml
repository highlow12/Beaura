schemaVersion: 1
id: net.transport.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "On a host, the number used to deliver a received datagram to the right socket is the ___."
choices:
  - "destination port"
  - "destination MAC only"
  - "TTL"
acceptedAnswers:
  - "destination port"
explanation:
  - type: text
    text: "Even when DNS queries and game packets arrive at the same host, the destination port directs each to the appropriate receiving socket. UDP datagrams are independent and do not guarantee delivery, ordering, or retransmission. If needed, the application must implement retries and duplicate handling itself."
tags: [udp, transport, port]
difficulty: 1
