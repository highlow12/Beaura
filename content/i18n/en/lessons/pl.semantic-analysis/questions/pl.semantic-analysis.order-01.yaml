schemaVersion: 1
id: pl.semantic-analysis.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: Arrange the steps for semantically analyzing an AST node that uses identifier x.
items:
  - id: enter-scope
    content:
      - type: text
        text: Check the scope environment at the current AST location.
  - id: lookup
    content:
      - type: text
        text: Look up x in the symbol table.
  - id: validate
    content:
      - type: text
        text: Check whether x is declared and whether its use is allowed here.
  - id: annotate
    content:
      - type: text
        text: Record declaration type and location on the AST node.
correctOrder:
  - enter-scope
  - lookup
  - validate
  - annotate
explanation:
  - type: text
    text: Look up the declaration in the correct environment, check the constraints, and then attach the analysis results that later stages will use.
tags:
  - programming-languages
  - semantic-analysis
  - symbol-table
difficulty: 2
