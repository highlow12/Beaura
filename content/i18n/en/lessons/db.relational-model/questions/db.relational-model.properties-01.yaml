schemaVersion: 1
id: db.relational-model.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that correctly describe the relational model and the meaning of values."
options:
  - id: domain
    content:
      - type: text
        text: "A domain of allowed values can be defined for an attribute"
  - id: "null"
    content:
      - type: text
        text: "NULL cannot be assumed to be the same value as 0 or an empty string"
  - id: set-order
    content:
      - type: text
        text: "The order of rows in a relation has no inherent meaning"
  - id: comma-list
    content:
      - type: text
        text: "Putting multiple independent comma-separated values in one column is always the best model"
correctOptionIds: [domain, "null", set-order]
shuffleOptions: true
explanation:
  - type: text
    text: "A domain expresses value constraints, NULL is a special unknown state, and a relation itself does not guarantee row order. Putting multiple values in one cell makes queries and integrity harder."
tags: [database, relational-model, "null"]
difficulty: 3
