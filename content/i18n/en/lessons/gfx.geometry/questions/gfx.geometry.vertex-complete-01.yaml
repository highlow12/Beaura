schemaVersion: 1
id: gfx.geometry.vertex-complete-01
revision: 1
type: code-completion
prompt:
  - type: text
    text: "Complete the blanks to group vertex indices into sets of three for a triangle."
language: python
template: |-
  indices = [0, 1, 2, 2, 3, 0]
  first_triangle = indices[{{blank:start}}:{{blank:end}}]
blanks:
  - id: start
    choices: ["0", "1", "2"]
    acceptedAnswers: ["0"]
  - id: end
    choices: ["3", "2", "6"]
    acceptedAnswers: ["3"]
explanation:
  - type: text
    text: "The first triangle uses the first three indices, so slicing with `indices[0:3]` gives [0, 1, 2]."
tags: [graphics, geometry, mesh, code-completion]
difficulty: 2
