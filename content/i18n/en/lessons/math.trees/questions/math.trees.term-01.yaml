schemaVersion: 1
id: math.trees.term-01
revision: 1
type: fill-blank
prompt:
  - type: text
    text: "In a rooted tree, a vertex with no children is called a ___ ."
choices:
  - "leaf"
  - "root"
  - "parent"
acceptedAnswers:
  - "leaf"
explanation:
  - type: text
    text: "A leaf is an endpoint vertex with no children below it."
  - type: text
    text: "The root is the starting vertex used as the tree's reference point, and a parent is the vertex above a child."
tags:
  - discrete-math
  - graphs
  - rooted-tree
difficulty: 1
