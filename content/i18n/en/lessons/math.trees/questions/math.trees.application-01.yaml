schemaVersion: 1
id: math.trees.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that are true of trees."
options:
  - id: connected
    content:
      - type: text
        text: "All vertices are connected"
  - id: acyclic
    content:
      - type: text
        text: "There are no cycles"
  - id: unique-path
    content:
      - type: text
        text: "There is one simple path between any two vertices"
  - id: many-edges
    content:
      - type: text
        text: "A tree with n vertices always has at least n edges"
correctOptionIds: [connected, acyclic, unique-path]
shuffleOptions: true
explanation:
  - type: text
    text: "Connectivity, absence of cycles, and a unique path are characteristic properties of trees."
  - type: text
    text: "A tree has n−1 edges, so it cannot have n or more edges."
tags:
  - discrete-math
  - graphs
  - tree-properties
difficulty: 2
