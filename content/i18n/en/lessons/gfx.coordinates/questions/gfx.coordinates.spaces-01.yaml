    content:
      - type: text
        text: "model space"
  - id: world
    content:
      - type: text
        text: "world space"
  - id: view
    content:
      - type: text
        text: "view space"
  - id: clip
    content:
      - type: text
        text: "clip space"
  - id: audio
    content:
      - type: text
        text: "audio space"
correctOptionIds: [model, world, view, clip]
