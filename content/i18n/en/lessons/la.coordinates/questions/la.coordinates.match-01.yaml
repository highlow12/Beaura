schemaVersion: 1
id: la.coordinates.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each coordinate transformation element with its role."
leftItems:
  - id: basis
    content:
      - type: text
        text: "Basis"
  - id: coordinate
    content:
      - type: text
        text: "coordinates"
  - id: basis-matrix
    content:
      - type: text
        text: "B"
  - id: equation
    content:
      - type: text
        text: "Bc=v"
rightItems:
  - id: basis-desc
    content:
      - type: text
        text: "A set of reference vectors used to represent a space"
  - id: coordinate-desc
    content:
      - type: text
        text: "The coefficients in a linear combination of basis vectors"
  - id: basis-matrix-desc
    content:
      - type: text
        text: "A matrix whose columns are the new basis vectors"
  - id: equation-desc
    content:
      - type: text
        text: "The relation between new coordinates and the actual vector"
correctPairs:
  - leftId: basis
    rightId: basis-desc
  - leftId: coordinate
    rightId: coordinate-desc
  - leftId: basis-matrix
    rightId: basis-matrix-desc
  - leftId: equation
    rightId: equation-desc
explanation:
  - type: text
    text: "The basis matrix represents the transformation from coordinate coefficients to the actual vector."
  - type: text
    text: "Also check which coordinate system the value `v` on the right side of the equation uses."
tags:
  - linear-algebra
  - coordinates
  - basis-change
difficulty: 2
