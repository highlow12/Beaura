explanation:
  - type: text
    text: "The ALU’s zero flag can indicate whether the result is 0. Implementing subtraction with an adder and an inverted input lets the hardware be reused."
  - type: text
    text: "Adding more operation types and widths to an ALU makes the instruction set richer, but also increases circuit, power, and control complexity. Combining simple operations quickly also affects pipeline performance."
