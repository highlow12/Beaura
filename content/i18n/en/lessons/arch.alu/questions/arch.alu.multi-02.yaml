type: multi-select
prompt:
  - type: text
    text: "Select all statements that describe the ALU and arithmetic-logic operations."
options:
  - id: correct-a
    content:
      - type: text
        text: "The ALU’s zero flag can indicate whether the result is 0."
  - id: correct-b
    content:
      - type: text
        text: "Implementing subtraction with an adder and an inverted input lets the hardware be reused."
  - id: wrong-a
    content:
      - type: text
        text: "An ALU input must be a network packet."
  - id: wrong-b
