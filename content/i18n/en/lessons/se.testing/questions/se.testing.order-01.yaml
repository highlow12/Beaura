schemaVersion: 1
id: se.testing.order-01
revision: 1
type: ordering
prompt:
- type: text
  text: Arrange the steps for testing a total function using Arrange-Act-Assert.
items:
- id: arrange
  content:
  - type: text
    text: Arrange the price list and required dependencies.
- id: act
  content:
  - type: text
    text: Call the total function once.
- id: assert
  content:
  - type: text
    text: Assert that the returned total matches the expected value.
- id: diagnose
  content:
  - type: text
    text: If the test fails, compare the expected rule with the actual result to narrow down the cause.
correctOrder:
- arrange
- act
- assert
- diagnose
explanation:
- type: text
  text: Prepare the inputs, perform the action, and assert the result. If it fails, use the comparison to analyze the cause.
tags:
- software-engineering
- testing
- arrange-act-assert
difficulty: 2
