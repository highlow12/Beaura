id: ds.deque.trace-01
type: code-output
prompt:
- type: text
  text: "Choose the output of the following deque code."
language: python
code: 'from collections import deque

  d = deque([2])

  d.appendleft(1)

  d.append(3)

  print(list(d))'
choices:
- '[1, 2, 3]'
- '[2, 1, 3]'
- '[3, 2, 1]'
acceptedOutputs:
- '[1, 2, 3]'
explanation:
- type: text
  text: "appendleft(1) puts 1 at the front and append(3) puts 3 at the back, so the order is 1, 2, 3."
