schemaVersion: 1
id: pl.memory-model.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: Arrange the stack-frame steps for a function call and return.
items:
  - id: caller
    content:
      - type: text
        text: The caller prepares arguments and the return location.
  - id: push
    content:
      - type: text
        text: Push a new frame for the callee onto the stack.
  - id: execute
    content:
      - type: text
        text: Run local variables and the function body in that frame.
  - id: pop-return
    content:
      - type: text
        text: Return the result and remove the frame.
correctOrder:
  - caller
  - push
  - execute
  - pop-return
explanation:
  - type: text
    text: A call pushes a new frame and a return removes it, so recursive calls follow last-in, first-out order.
tags:
  - programming-languages
  - memory
  - call-stack
difficulty: 2
