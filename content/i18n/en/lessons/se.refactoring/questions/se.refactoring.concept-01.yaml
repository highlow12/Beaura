schemaVersion: 1
id: se.refactoring.concept-01
revision: 1
type: single-choice
prompt:
- type: text
  text: Which statement best describes refactoring?
options:
- id: preserve-behavior
  content:
  - type: text
    text: Improve internal structure while preserving external behavior.
- id: add-feature
  content:
  - type: text
    text: Always add a new user-facing feature.
- id: rewrite-all
  content:
  - type: text
    text: Rewrite all existing code without tests.
- id: change-contract
  content:
  - type: text
    text: Change the meaning of a public API without notice.
correctOptionId: preserve-behavior
shuffleOptions: true
explanation:
- type: text
  text: The core of refactoring is to improve internal structure and ease of change while preserving the results and contract that clients observe.
tags:
- software-engineering
- refactoring
- behavior-preservation
difficulty: 1
