schemaVersion: 1
id: os.deadlock.matching-05
revision: 2
type: matching
prompt:
  - type: text
    text: "Match each deadlock term with its role."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "Mutual exclusion"
  - id: left-b
    content:
      - type: text
        text: "Hold and wait"
  - id: left-c
    content:
      - type: text
        text: "circular wait"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "A condition that allows only one flow to use a resource at a time"
  - id: right-b
    content:
      - type: text
        text: "A condition where a flow holds one resource while waiting for another"
  - id: right-c
    content:
      - type: text
        text: "A condition where wait relationships form a cycle"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "Mutual exclusion allows only one flow to use a resource at a time; hold and wait means a flow holds one resource while waiting for another; circular wait means wait relationships form a cycle."
