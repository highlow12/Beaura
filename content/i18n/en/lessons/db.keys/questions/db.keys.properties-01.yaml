schemaVersion: 1
id: db.keys.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that correctly describe primary and foreign keys."
options:
  - id: primary-unique
    content:
      - type: text
        text: "A primary key must uniquely identify a row"
  - id: primary-not-null
    content:
      - type: text
        text: "A primary key value cannot be NULL"
  - id: foreign-reference
    content:
      - type: text
        text: "A foreign key is linked to a key in the referenced table"
  - id: app-only
    content:
      - type: text
        text: "Foreign-key rules are always checked only in application code"
correctOptionIds: [primary-unique, primary-not-null, foreign-reference]
shuffleOptions: true
explanation:
  - type: text
    text: "Primary keys are unique and NOT NULL, and foreign keys can express referential integrity as a database constraint. Application checks cannot replace database constraints."
tags: [database, keys, integrity]
difficulty: 2
