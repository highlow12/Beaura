schemaVersion: 1
id: pl.types.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: Which statement about static typing is correct?
options:
  - id: before-run
    content:
      - type: text
        text: The program's type constraints are usually checked before execution.
  - id: never-change
    content:
      - type: text
        text: A variable's value can never change during execution.
  - id: no-types
    content:
      - type: text
        text: Operations ignore the types of all values.
  - id: runtime-only
    content:
      - type: text
        text: Types are checked only at runtime, never before compilation.
correctOptionId: before-run
shuffleOptions: true
explanation:
  - type: text
    text: Static typing usually finds type errors before execution; it does not mean values cannot change or that a variable's type is fixed forever.
tags:
  - programming-languages
  - types
  - static-typing
difficulty: 1
