schemaVersion: 1
id: toc.grammar.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: What is the role of a terminal in a formal grammar?
options:
  - id: final-symbol
    content:
      - type: text
        text: An actual output symbol that remains in the string when the derivation ends.
  - id: rule-placeholder
    content:
      - type: text
        text: A placeholder that must be replaced again by another rule.
  - id: start-only
    content:
      - type: text
        text: The single symbol that starts the entire grammar.
  - id: state-name
    content:
      - type: text
        text: A name that records the current state of an automaton.
correctOptionId: final-symbol
shuffleOptions: true
explanation:
  - type: text
    text: A terminal is no longer replaced on the left side of a production rule and becomes part of the final string. A nonterminal can continue to expand during generation.
tags:
  - theory-of-computation
  - grammar
  - terminal
difficulty: 1
