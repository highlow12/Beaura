schemaVersion: 1
id: math.propositions.connective-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each logical operator with its meaning."
leftItems:
  - id: not
    content:
      - type: text
        text: "¬P"
  - id: and
    content:
      - type: text
        text: "P ∧ Q"
  - id: or
    content:
      - type: text
        text: "P ∨ Q"
rightItems:
  - id: negate
    content:
      - type: text
        text: "Reverses the truth value of P"
  - id: both
    content:
      - type: text
        text: "True when both P and Q are true"
  - id: either
    content:
      - type: text
        text: "True when at least one of P and Q is true"
correctPairs:
  - leftId: not
    rightId: negate
  - leftId: and
    rightId: both
  - leftId: or
    rightId: either
explanation:
  - type: text
    text: "NOT reverses a truth value; AND is true when all inputs are true; OR is true when at least one input is true."
tags:
  - discrete-math
  - logic
  - connectives
difficulty: 1
