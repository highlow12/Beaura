schemaVersion: 1
id: math.graph-connectivity.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each connectivity term with its criterion."
leftItems:
  - id: connected
    content:
      - type: text
        text: "Connected graph"
  - id: component
    content:
      - type: text
        text: "connected component"
  - id: bridge
    content:
      - type: text
        text: "bridge"
  - id: isolated
    content:
      - type: text
        text: "Isolated vertex"
rightItems:
  - id: connected-desc
    content:
      - type: text
        text: "There is a path between every pair of vertices"
  - id: component-desc
    content:
      - type: text
        text: "A maximal set of mutually connected vertices"
  - id: bridge-desc
    content:
      - type: text
        text: "An edge whose removal increases the number of components"
  - id: isolated-desc
    content:
      - type: text
        text: "Has no edges and forms a component by itself"
correctPairs:
  - leftId: connected
    rightId: connected-desc
  - leftId: component
    rightId: component-desc
  - leftId: bridge
    rightId: bridge-desc
  - leftId: isolated
    rightId: isolated-desc
explanation:
  - type: text
    text: "Connectedness is a property of the whole graph, while components and bridges describe its connectivity structure in more detail."
  - type: text
    text: "An isolated vertex has degree 0, but it can still be the starting point of a graph traversal."
tags:
  - discrete-math
  - graphs
  - graph-properties
difficulty: 2
