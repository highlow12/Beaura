schemaVersion: 1
id: toc.decidability.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: What does it mean for a language to be decidable?
options:
  - id: halt-both
    content:
      - type: text
        text: There is an algorithm that halts on every input and correctly decides membership.
  - id: accept-only
    content:
      - type: text
        text: It only needs to halt eventually on inputs in the language.
  - id: fast-only
    content:
      - type: text
        text: It must always answer in constant time.
  - id: human-check
    content:
      - type: text
        text: A person can guess the answer for most inputs.
correctOptionId: halt-both
shuffleOptions: true
explanation:
  - type: text
    text: A decider must halt in finite time for both yes and no cases. How quickly it runs is a separate complexity question.
tags:
  - theory-of-computation
  - decidability
  - decision-problem
difficulty: 1
