schemaVersion: 1
id: math.contradiction.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match each expression in a proof by contradiction with its role."
leftItems:
  - id: negated-goal
    content:
      - type: text
        text: "Assume `¬Q`"
  - id: known
    content:
      - type: text
        text: "An established theorem"
  - id: conflict
    content:
      - type: text
        text: "`P` and `¬P`"
  - id: conclusion
    content:
      - type: text
        text: "Q"
rightItems:
  - id: negated-goal-desc
    content:
      - type: text
        text: "The starting assumption in a proof by contradiction"
  - id: known-desc
    content:
      - type: text
        text: "A fact to use in the reasoning"
  - id: conflict-desc
    content:
      - type: text
        text: "Results that cannot both be true"
  - id: conclusion-desc
    content:
      - type: text
        text: "The original goal, established by showing the negated assumption is false"
correctPairs:
  - leftId: negated-goal
    rightId: negated-goal-desc
  - leftId: known
    rightId: known-desc
  - leftId: conflict
    rightId: conflict-desc
  - leftId: conclusion
    rightId: conclusion-desc
explanation:
  - type: text
    text: "A proof by contradiction derives a conflict from the negated assumption and established facts, thereby confirming the original goal."
  - type: text
    text: "Check that the two statements in the contradiction are genuinely negations of each other."
tags:
  - discrete-math
  - proof
  - structure
difficulty: 2
