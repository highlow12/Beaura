schemaVersion: 1
id: math.contradiction.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all pairs of statements that appropriately form a contradiction in a proof by contradiction."
options:
  - id: p
    content:
      - type: text
        text: "A line of reasoning establishes that `P` is true"
  - id: not-p
    content:
      - type: text
        text: "Under the same conditions, `¬P` is established as true"
  - id: example
    content:
      - type: text
        text: "Calculate two different examples"
  - id: opinion
    content:
      - type: text
        text: "Say that something seems strange intuitively"
correctOptionIds: [p, not-p]
shuffleOptions: true
explanation:
  - type: text
    text: "Deriving both `P` and `¬P` under the same conditions is a contradiction because they cannot both hold."
  - type: text
    text: "Something merely seeming strange or having different examples is not evidence of a logical contradiction."
tags:
  - discrete-math
  - proof
  - logic
difficulty: 2
