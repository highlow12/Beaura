explanation:
  - type: text
    text: "A decoder selects and activates one output line corresponding to the input binary code."
  - type: text
    text: "A decoder maps a combination of n input bits to an active signal on one of up to 2^n output lines. A common form is one-hot, in which only one output is active at a time."
