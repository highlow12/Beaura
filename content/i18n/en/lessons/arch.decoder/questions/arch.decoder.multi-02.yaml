schemaVersion: 1
id: arch.decoder.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all statements that describe decoders and address selection."
options:
  - id: correct-a
    content:
      - type: text
        text: "A 2-to-4 decoder can map each of four input combinations to one of four output lines."
  - id: correct-b
    content:
      - type: text
        text: "If enable is inactive, output selection may be blocked even when the address is valid."
  - id: wrong-a
    content:
      - type: text
        text: "The number of decoder outputs is always the same as the number of input bits."
  - id: wrong-b
    content:
      - type: text
        text: "All four decoder output lines are active at the same time for every input combination."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "A 2-to-4 decoder can map each of four input combinations to one of four output lines. If enable is inactive, output selection may be blocked even when the address is valid."
  - type: text
    text: "A decoder makes it easy to turn an address into physical selection lines, but the number of outputs grows exponentially and can make the circuit large. Hierarchical decoders and enable signals help manage the scale."
tags: [decoder, address, digital-logic]
difficulty: 3
