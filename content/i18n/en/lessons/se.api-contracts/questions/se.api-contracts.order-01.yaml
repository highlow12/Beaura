schemaVersion: 1
id: se.api-contracts.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: Arrange the steps a page-query API follows to process a request while honoring its contract.
items:
  - id: receive
    content:
      - type: text
        text: Receive the caller’s input.
  - id: validate
    content:
      - type: text
        text: Validate preconditions such as `limit` and authentication.
  - id: execute
    content:
      - type: text
        text: Run the query with the validated input.
  - id: guarantee
    content:
      - type: text
        text: Return results and errors in the forms promised by the contract.
correctOrder:
  - receive
  - validate
  - execute
  - guarantee
explanation:
  - type: text
    text: Check preconditions at the boundary, perform the operation, then return the result while honoring the postconditions and error format.
tags:
  - software-engineering
  - api
  - contract
difficulty: 2
