schemaVersion: 1
id: se.api-contracts.trace-01
revision: 2
type: code-output
prompt:
  - type: text
    text: What does the following code print when the function’s preconditions are met?
language: python
code: |-
  def add_fee(price, fee):
      if price < 0 or fee < 0:
          raise ValueError("price and fee must be nonnegative")
      return price + fee

  print(add_fee(100, 10))
choices:
  - "110"
  - "90"
  - price
acceptedOutputs:
  - "110"
explanation:
  - type: text
    text: Both `price` and `fee` are nonnegative, so the precondition check passes. The function adds the fixed fee of 10 to the price of 100 and returns 110. Here, `fee` is an amount, not a rate.
tags:
  - software-engineering
  - api
  - code-trace
difficulty: 2
