schemaVersion: 1
id: se.system-tradeoffs.order-01
revision: 1
type: ordering
prompt:
- type: text
  text: Arrange the steps for comparing and choosing among system design alternatives.
items:
- id: requirements
  content:
  - type: text
    text: Write priorities and acceptable limits as requirements.
- id: options
  content:
  - type: text
    text: List the possible design alternatives.
- id: constraints
  content:
  - type: text
    text: Compare each alternative’s costs and behavior during failure.
- id: decision
  content:
  - type: text
    text: Record why you chose the option and the conditions for revisiting it.
correctOrder:
- requirements
- options
- constraints
- decision
explanation:
- type: text
  text: Decide what to optimize first, then develop alternatives and compare their costs and failure behavior. This makes the reason for your choice clear.
tags:
- software-engineering
- system-design
- decision-making
difficulty: 2
