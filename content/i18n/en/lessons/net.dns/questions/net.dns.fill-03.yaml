schemaVersion: 1
id: net.dns.fill-03
revision: 2
type: fill-blank
prompt:
- type: text
  text: The DNS record that contains the IPv4 address for a domain name is ___.
choices:
- A
- AAAA
- MX
acceptedAnswers:
- A
explanation:
- type: text
  text: When a browser looks up the IP address for `www.example.com`, it does not need to query an authoritative server again
    if a cached A or AAAA record is still within its TTL. An A record contains an IPv4 address, while an AAAA record contains
    an IPv6 address. Once the cache expires, the resolver follows DNS delegations to obtain a fresh response.
tags:
- dns
- name-resolution
- cache
difficulty: 2
