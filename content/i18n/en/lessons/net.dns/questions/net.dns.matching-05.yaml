type: matching
prompt:
- type: text
  text: Match each DNS name resolution term with its role.
leftItems:
- id: left-a
  content:
  - type: text
    text: Resolver
- id: left-b
  content:
  - type: text
    text: Authoritative server
- id: left-c
  content:
  - type: text
    text: TTL
rightItems:
- id: right-a
  content:
  - type: text
    text: A server that performs DNS queries on behalf of a client
- id: right-b
  content:
  - type: text
    text: A server that manages the final records for a specific domain
- id: right-c
  content:
  - type: text
    text: How long a cached response remains valid
correctPairs:
- leftId: left-a
  rightId: right-a
- leftId: left-b
  rightId: right-b
- leftId: left-c
