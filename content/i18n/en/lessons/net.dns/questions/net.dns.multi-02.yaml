schemaVersion: 1
id: net.dns.multi-02
revision: 1
type: multi-select
prompt:
- type: text
  text: Select all statements that apply to DNS name resolution.
options:
- id: correct-a
  content:
  - type: text
    text: A recursive resolver can query other DNS servers on behalf of a client.
- id: correct-b
  content:
  - type: text
    text: TTL determines how long a DNS cache result can be used.
- id: wrong-a
  content:
  - type: text
    text: A DNS cache keeps using an old value forever, even after the record changes.
- id: wrong-b
  content:
  - type: text
    text: A and AAAA records store only port numbers, not IP addresses.
correctOptionIds:
- correct-a
- correct-b
shuffleOptions: true
explanation:
- type: text
  text: A recursive resolver can query other DNS servers on behalf of a client. TTL determines how long a DNS cache result
    can be used.
- type: text
  text: DNS caching reduces latency and server load, but it can briefly serve an outdated address. The hierarchy and delegation
    of names make it possible to distribute DNS data worldwide.
tags:
- dns
- name-resolution
- cache
difficulty: 3
