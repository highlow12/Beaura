prompt:
- type: text
  text: Which statement about DNS name resolution is most accurate?
options:
- id: correct
  content:
  - type: text
    text: DNS resolves domain names to IP addresses using hierarchical records and caching.
- id: wrong-a
  content:
  - type: text
    text: DNS is a protocol that reassembles bytes in order from a TCP stream.
- id: wrong-b
  content:
  - type: text
