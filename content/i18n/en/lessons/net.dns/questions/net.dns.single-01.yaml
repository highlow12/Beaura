explanation:
- type: text
  text: DNS resolves domain names to IP addresses using hierarchical records and caching.
- type: text
  text: DNS is a distributed naming system that manages domain names and records hierarchically. A resolver checks its cache
    first and, if needed, queries the root, TLD, and authoritative servers.
