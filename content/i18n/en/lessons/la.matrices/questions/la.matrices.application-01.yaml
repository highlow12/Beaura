schemaVersion: 1
id: la.matrices.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "Select all correct statements about matrices."
options:
  - id: grid
    content:
      - type: text
        text: "A table of numbers arranged in rows and columns"
  - id: same-add
    content:
      - type: text
        text: "Matrices of the same size can be added entry by entry"
  - id: scalar
    content:
      - type: text
        text: "Scalar multiplication multiplies every entry by the same number"
  - id: always-square
    content:
      - type: text
        text: "Every matrix is square"
correctOptionIds: [grid, same-add, scalar]
shuffleOptions: true
explanation:
  - type: text
    text: "Matrices can be rectangular, and addition of matrices with the same shape and scalar multiplication are defined."
  - type: text
    text: "A matrix is square only when it has the same number of rows and columns."
tags:
