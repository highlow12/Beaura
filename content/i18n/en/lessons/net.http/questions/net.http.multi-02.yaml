schemaVersion: 1
id: net.http.multi-02
revision: 1
type: multi-select
prompt:
- type: text
  text: Select all statements that apply to HTTP requests and responses.
options:
- id: correct-a
  content:
  - type: text
    text: A 2xx status code generally indicates that a request succeeded.
- id: correct-b
  content:
  - type: text
    text: A header such as Content-Type can indicate how to interpret the body.
- id: wrong-a
  content:
  - type: text
    text: GET and POST always communicate exactly the same intent to a server.
- id: wrong-b
  content:
  - type: text
    text: 404 is a DNS-only code that means name resolution failed.
correctOptionIds:
- correct-a
- correct-b
shuffleOptions: true
explanation:
- type: text
  text: A 2xx status code generally indicates that a request succeeded. A header such as Content-Type can indicate how to
    interpret the body.
- type: text
  text: HTTP is simple and extensible, but request headers and connection management add overhead. Caching, compression, and
    connection reuse can reduce latency and data transfer.
tags:
- http
- web
- request-response
difficulty: 2
