schemaVersion: 1
id: net.http.fill-03
revision: 2
type: fill-blank
prompt:
- type: text
  text: The HTTP response header that specifies the format of the body is ___.
choices:
- Content-Type
- Host
- GET
acceptedAnswers:
- Content-Type
explanation:
- type: text
  text: '`GET /lessons/1` requests a resource, and a `200` response indicates success. The response header `Content-Type:
    application/json` describes the body format, while `404` means the requested resource was not found. Separating headers
    from the body makes the roles of status codes and data clear.'
tags:
- http
- web
- request-response
difficulty: 1
