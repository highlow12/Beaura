schemaVersion: 1
id: se.abstraction-dependencies.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: Arrange the steps for making email notifications a replaceable dependency.
items:
  - id: volatile-detail
    content:
      - type: text
        text: Identify the email API details that may need to be replaced.
  - id: define-port
    content:
      - type: text
        text: Define a small notification port for the behavior the policy needs.
  - id: implement-adapter
    content:
      - type: text
        text: Make the email adapter implement the port’s contract.
  - id: inject
    content:
      - type: text
        text: Inject the adapter into the policy at the application entry point.
correctOrder:
  - volatile-detail
  - define-port
  - implement-adapter
  - inject
explanation:
  - type: text
    text: First identify what can change, then define a policy-centered port, implement an adapter, and supply it during application setup.
tags:
  - software-engineering
  - dependency-injection
  - design-process
difficulty: 2
