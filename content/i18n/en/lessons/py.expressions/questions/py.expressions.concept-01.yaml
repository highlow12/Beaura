id: py.expressions.concept-01
type: single-choice
prompt:
- type: text
  text: "Which statement best describes an expression in Python?"
options:
- id: result
  content:
  - type: text
    text: "A piece of code that evaluates to one value"
- id: comment
  content:
  - type: text
    text: "A comment that is not executed and only leaves a note"
- id: binding
  content:
  - type: text
    text: "A term that refers only to an assignment statement"
- id: file
  content:
  - type: text
    text: "The file that stores the program itself"
correctOptionId: result
shuffleOptions: true
explanation:
- type: text
  text: "Expressions combine values, names, and operators to produce a result when evaluated. An assignment statement is a separate statement that evaluates an expression and binds its result to a name."
schemaVersion: 1
revision: 1
tags:
- expressions
- values
difficulty: 2
