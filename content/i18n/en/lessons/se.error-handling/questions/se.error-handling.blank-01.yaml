type: fill-blank
prompt:
- type: text
  text: If running the same request multiple times has the same result as running it once, the operation is called ___.
choices:
- idempotent
- random
- mutable
acceptedAnswers:
- idempotent
explanation:
- type: text
  text: Idempotency means that retries or duplicate requests produce the same observable result as a single execution.
