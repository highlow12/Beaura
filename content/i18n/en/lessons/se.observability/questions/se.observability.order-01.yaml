schemaVersion: 1
id: se.observability.order-01
revision: 1
type: ordering
prompt:
- type: text
  text: Arrange the steps for investigating a latency incident using observability data.
items:
- id: detect
  content:
  - type: text
    text: Detect an anomaly in latency or error rate from metrics.
- id: narrow
  content:
  - type: text
    text: Narrow the impact by endpoint or region.
- id: trace
  content:
  - type: text
    text: Find long spans and bottleneck dependencies in representative traces.
- id: log
  content:
  - type: text
    text: Search logs by trace ID to inspect the cause and context.
correctOrder:
- detect
- narrow
- trace
- log
explanation:
- type: text
  text: Use aggregated metrics to spot an anomaly and narrow its scope, then use traces and logs to identify increasingly specific causes.
tags:
- software-engineering
- observability
- incident-response
difficulty: 2
