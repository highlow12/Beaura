schemaVersion: 1
id: pl.lexical-scope.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "In lexical scope, what determines how a name inside a function is resolved?"
options:
  - id: definition-site
    content:
      - type: text
        text: "The outer scope at the function's definition site in the source code"
  - id: call-site
    content:
      - type: text
        text: "Only the scope where the function was most recently called"
  - id: random
    content:
      - type: text
        text: "A randomly selected binding each time the function runs"
  - id: global-only
    content:
      - type: text
        text: "Global variables only"
correctOptionId: definition-site
shuffleOptions: true
explanation:
  - type: text
    text: "Lexical scope resolves references from the nesting structure of the source, searching outward from the defining environment."
tags:
  - programming-languages
  - lexical-scope
  - binding
difficulty: 1
