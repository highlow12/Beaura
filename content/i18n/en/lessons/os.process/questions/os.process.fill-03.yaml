type: fill-blank
prompt:
  - type: text
    text: "Running the same executable twice can create separate ___."
choices:
  - "processes"
  - "file formats"
  - "instruction sets"
acceptedAnswers:
  - "processes"
explanation:
  - type: text
    text: "Running the same browser program twice can create separate processes, each with its own address space, execution registers, and open-file state. An executable is data on disk; a process is a collection of execution state and resources managed by the operating system."
