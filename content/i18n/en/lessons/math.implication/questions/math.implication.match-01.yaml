schemaVersion: 1
id: math.implication.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "Match the original statement `P → Q` and related statements with their meanings."
leftItems:
  - id: original
    content:
      - type: text
        text: "P → Q"
  - id: converse
    content:
      - type: text
        text: "Q → P"
  - id: inverse
    content:
      - type: text
        text: "¬P → ¬Q"
  - id: contra
    content:
      - type: text
        text: "¬Q → ¬P"
rightItems:
  - id: original-meaning
    content:
      - type: text
        text: "The original implication from antecedent to consequent"
  - id: reverse-meaning
    content:
      - type: text
        text: "A statement that only switches the antecedent and consequent"
  - id: negated-meaning
    content:
      - type: text
        text: "A statement that negates each part"
  - id: equivalent-meaning
    content:
      - type: text
        text: "The contrapositive, always equivalent to the original statement"
correctPairs:
  - leftId: original
    rightId: original-meaning
  - leftId: converse
    rightId: reverse-meaning
  - leftId: inverse
    rightId: negated-meaning
  - leftId: contra
    rightId: equivalent-meaning
explanation:
  - type: text
    text: "The converse only switches the order; the inverse negates both parts; the contrapositive both negates and switches them."
  - type: text
    text: "Remember that only the original statement and its contrapositive are always equivalent."
tags:
  - discrete-math
  - logic
  - related-propositions
difficulty: 2
