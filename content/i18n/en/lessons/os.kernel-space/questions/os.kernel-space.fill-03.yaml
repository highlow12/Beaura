schemaVersion: 1
id: os.kernel-space.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "The area where applications run with restricted privileges is ___."
choices:
  - "user space"
  - "kernel code region"
  - "device registers"
acceptedAnswers:
  - "user space"
explanation:
  - type: text
    text: "To write a file, an application running in restricted user space makes a request to the kernel. The CPU switches to kernel mode through an authorized entry point, and the kernel checks the arguments and permissions before providing the service. User-space code cannot modify kernel memory directly."
tags: [kernel, user-space, protection]
difficulty: 1
