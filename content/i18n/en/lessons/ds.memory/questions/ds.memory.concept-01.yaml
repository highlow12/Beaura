id: ds.memory.concept-01
type: single-choice
prompt:
- type: text
  text: "When assigning b = a, which statement correctly describes mutable lists?"
options:
- id: alias
  content:
  - type: text
    text: "a and b can point to the same list object"
- id: clone
  content:
  - type: text
    text: "Python always makes a deep copy of the list"
- id: value-only
  content:
  - type: text
    text: "List elements cannot be changed in any way"
- id: address-free
  content:
  - type: text
    text: "A value is stored in a variable name without a reference"
correctOptionId: alias
shuffleOptions: true
explanation:
- type: text
  text: "Assigning a list usually creates another reference to the same object. If you need a copy independent of the original, copy it explicitly."
schemaVersion: 1
revision: 1
tags:
- memory
- representation
- reference
difficulty: 2
