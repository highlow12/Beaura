schemaVersion: 1
id: ds.graph.neighbor-output-01
revision: 1
type: code-output
prompt:
- type: text
  text: "Choose the output of code that prints the number of A’s neighbors in an adjacency list."
language: python
code: |-
  graph = {
      "A": ["B", "C"],
      "B": ["C"],
      "C": []
  }
  print(len(graph["A"]))
choices:
- '2'
- '1'
- '3'
acceptedOutputs:
- '2'
explanation:
- type: text
  text: "A’s list contains two vertices, B and C, so its length is 2."
- type: text
  text: "An adjacency-list entry represents a neighbor that can be reached directly from that vertex."
tags:
- graph
- adjacency-list
- code-output
difficulty: 1
