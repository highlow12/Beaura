schemaVersion: 1
id: math.graphs.application-01
revision: 2
type: multi-select
prompt:
  - type: text
    text: "Select all contributions to the degree of vertex `v` in an undirected graph."
options:
  - id: incident-one
    content:
      - type: text
        text: "An ordinary edge attached to `v` adds 1 to its degree"
  - id: incident-two
    content:
      - type: text
        text: "A loop from `v` back to `v` adds 2 to its degree"
  - id: outgoing
    content:
      - type: text
        text: "Only edges leaving `v` in a directed graph"
  - id: unrelated
    content:
      - type: text
        text: "An edge unrelated to `v`"
correctOptionIds: [incident-one, incident-two]
shuffleOptions: true
explanation:
  - type: text
    text: "The degree in an undirected graph counts edge endpoints touching the vertex. Both endpoints of a loop touch `v`."
  - type: text
    text: "Counting only outgoing edges gives the outdegree in a directed graph."
tags:
  - discrete-math
  - graphs
  - degree
difficulty: 2
