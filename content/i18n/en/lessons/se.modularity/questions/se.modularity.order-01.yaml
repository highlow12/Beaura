schemaVersion: 1
id: se.modularity.order-01
revision: 1
type: ordering
prompt:
- type: text
  text: Arrange the design steps for separating a notification feature into modules.
items:
- id: responsibility
  content:
  - type: text
    text: Describe the module’s responsibility in one sentence.
- id: surface
  content:
  - type: text
    text: Expose only the inputs and results needed from outside.
- id: hide-implementation
  content:
  - type: text
    text: Hide delivery details such as the transport method behind the boundary.
- id: test-boundary
  content:
  - type: text
    text: Test both sides of the boundary independently.
correctOrder:
- responsibility
- surface
- hide-implementation
- test-boundary
explanation:
- type: text
  text: Define the responsibility first, minimize the public surface, hide implementation details, and then check that each side of the boundary works independently.
tags:
- software-engineering
- modularity
- design-process
difficulty: 2
