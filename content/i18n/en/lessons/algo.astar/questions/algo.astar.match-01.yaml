type: matching
prompt:
- type: text
  text: "Match each A* value with its meaning."
leftItems:
- id: g
  content:
  - type: text
    text: "g"
- id: h
  content:
  - type: text
    text: "h"
- id: f
  content:
  - type: text
    text: "f"
rightItems:
- id: actual
  content:
  - type: text
    text: "The actual cost from the start to the current vertex"
- id: estimate
  content:
  - type: text
    text: "The estimated cost from the current vertex to the goal"
- id: priority
  content:
  - type: text
    text: "The candidate priority calculated as g + h"
correctPairs:
- leftId: g
  rightId: actual
- leftId: h
  rightId: estimate
- leftId: f
  rightId: priority
explanation:
- type: text
  text: "g is the cost already paid, and h estimates the remaining cost. Their sum, f, determines the order in which candidates are chosen."
