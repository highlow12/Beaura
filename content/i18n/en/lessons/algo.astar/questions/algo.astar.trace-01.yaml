  text: "Choose the name of the candidate with the smallest f = g + h."
language: python
code: |-
  g = {"A": 2, "B": 4, "C": 1}
  h = {"A": 5, "B": 2, "C": 6}
  scores = [(g["A"] + h["A"], "A"),
            (g["B"] + h["B"], "B"),
            (g["C"] + h["C"], "C")]
  print(min(scores)[1])
choices:
- B
- A
- C
acceptedOutputs:
