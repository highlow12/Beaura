    order: 95

  - id: theory-of-computation
    revision: 1
    title: Theory of Computation
    description: Explore what can be computed using formal languages and models of computation.
    order: 100

  - id: programming-languages
    revision: 1
    title: Programming Languages and Compilers
    description: Learn how source code is analyzed and transformed into intermediate representations and executable code.
    order: 110

  - id: software-engineering
    revision: 1
