  - id: computer-architecture
    revision: 1
    title: Computer Architecture
    description: Understand how a computer executes programs.
    order: 20

  - id: discrete-math
    revision: 1
    title: Discrete Mathematics
    description: Learn propositions and logic as the foundations of computer science.
    order: 30

  - id: data-structures
    revision: 1
    title: Data Structures
    description: Fundamental structures for storing and manipulating data
    order: 40

  - id: algorithms
    revision: 1
    title: Algorithms
    description: Fundamentals of search, sorting, traversal, and shortest paths
    order: 45

  - id: computer-systems
    revision: 1
    title: Computer Systems Applications
    description: Learn foundational concepts of networks and graphics.
    order: 50

  - id: operating-systems
    revision: 1
    title: Operating Systems
    description: 프로세스, 동시성, 메모리와 입출원을 관리하는 Operating Systems의 핵심 원리를 익힌다.
    order: 55

  - id: networks
    revision: 2
    title: Networks
    description: 링크 계층부터 웹 보안까지 데이터가 Networks를 이동하는 원리를 익힌다.
    order: 60

