schemaVersion: 1
id: db.consistency.choice-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 방금 결제한 잔액을 사용자가 다음 화면에서 반드시 최신으로 봐야 한다면 우선 고려할 보장은 무엇인가요?
options:
  - id: strong
    content:
      - type: text
        text: 강한 일관성 또는 read-after-write 보장
  - id: eventual-only
    content:
      - type: text
        text: 지연된 replica를 아무 조건 없이 읽는 최종 일관성
  - id: no-read
    content:
      - type: text
        text: 결제 후 잔액을 읽지 않는 설계
correctOptionId: strong
shuffleOptions: true
explanation:
  - type: text
    text: 결제 직후 최신 잔액이 필수라면 강한 읽기나 최소한 같은 세션의 write를 뒤따르는 read-after-write 경로를 보장해야 합니다.
tags: [database, consistency, read-after-write]
difficulty: 2
