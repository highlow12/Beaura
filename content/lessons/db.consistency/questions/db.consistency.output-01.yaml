    text: 변경 로그의 버전 3, 4, 5를 순서대로 적용하면 replica의 최종 적용 버전은 5로 primary와 같아집니다. 실제 복제는 버전 숫자뿐 아니라 해당 데이터 변경도 함께 적용합니다.
