    text: 분산 일관성 용어와 특징을 연결하세요.
leftItems:
  - id: strong
    content:
      - type: text
        text: 강한 일관성
  - id: eventual
    content:
      - type: text
        text: 최종 일관성
  - id: stale-read
    content:
      - type: text
        text: 오래된 읽기
rightItems:
  - id: latest
    content:
      - type: text
        text: 성공한 쓰기 뒤 최신 값을 읽는 것을 목표로 한다
  - id: converge
    content:
      - type: text
        text: 시간이 지나 replica 값이 수렴하면 된다
  - id: lag-observation
