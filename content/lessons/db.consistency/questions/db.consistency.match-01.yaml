  - type: text
    text: 일관성 모델은 쓰기와 읽기 사이에 허용하는 관찰 시점을 정의합니다. 최종 일관성에서는 복제 지연으로 오래된 읽기가 잠시 가능할 수 있습니다.
tags: [database, consistency, distributed]
