schemaVersion: 1
id: toc.regular-languages.order-01
revision: 3
type: ordering
prompt:
  - type: text
    text: 정규식 0(0|1)*를 인식하는 DFA의 전이 규칙을 설계하는 순서를 배열하세요.
items:
  - id: first-symbol
    content:
      - type: text
        text: 시작 상태에서 입력의 첫 기호가 0인지 확인하도록 정한다.
  - id: reject-other
    content:
      - type: text
        text: 첫 기호가 1이면 거부 상태로 이동하도록 정한다.
  - id: enter-accept
    content:
      - type: text
        text: 첫 기호가 0이면 수용 상태로 이동하도록 정한다.
  - id: loop-rest
    content:
      - type: text
        text: 수용 상태에서는 이후 0과 1을 읽어도 그 상태를 유지하도록 정한다.
correctOrder:
  - first-symbol
  - reject-other
  - enter-accept
  - loop-rest
unorderedGroups:
  - [reject-other, enter-accept]
explanation:
  - type: text
    text: 이는 서로 다른 입력에 적용될 전이 규칙을 차례로 설계하는 문제입니다. 실제 실행에서 첫 기호 0과 1의 분기는 동시에 실행되지 않으며, 0으로 시작하는 경우에만 뒤의 기호들을 자유롭게 읽습니다.
tags:
  - theory-of-computation
  - regular-expression
  - dfa
difficulty: 2
