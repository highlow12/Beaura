schemaVersion: 1
id: net.switch.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "스위치와 LAN에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "목적지 MAC을 모르면 스위치가 같은 브로드캐스트 영역으로 플러딩할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "스위치는 프레임의 출발지 MAC과 입력 포트를 학습한다."
  - id: wrong-a
    content:
      - type: text
        text: "MAC 학습 표는 한 번 기록되면 장치가 이동해도 절대 바뀌지 않는다."
  - id: wrong-b
    content:
      - type: text
        text: "스위치는 링크 계층 주소가 아니라 HTTP 경로로 포트를 결정한다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "목적지 MAC을 모르면 스위치가 같은 브로드캐스트 영역으로 플러딩할 수 있다. 스위치는 프레임의 출발지 MAC과 입력 포트를 학습한다."
  - type: text
    text: "스위치는 충돌을 줄이고 전이중 통신을 지원하지만 표 관리와 루프 방지가 필요합니다. VLAN으로 브로드캐스트 범위를 나누면 격리와 관리성이 좋아집니다."
tags: [switch, lan, mac-table]
difficulty: 3
