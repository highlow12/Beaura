schemaVersion: 1
id: net.switch.ordering-04
revision: 2
type: ordering
prompt:
  - type: text
    text: "스위치와 LAN의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: learn
    content:
      - type: text
        text: "출발지 MAC과 입력 포트를 표에 기록한다"
  - id: lookup
    content:
      - type: text
        text: "목적지 MAC의 출력 포트를 찾는다"
  - id: flood-forward
    content:
      - type: text
        text: "미지 목적지는 플러딩하고 알려진 목적지는 전달한다"
correctOrder: [learn, lookup, flood-forward]
unorderedGroups:
  - [learn, lookup]
explanation:
  - type: text
    text: "프레임을 받은 뒤 출발지 MAC 학습과 목적지 MAC 조회를 모두 합니다. 두 작업은 서로 독립적이므로 어느 순서로 해도 됩니다. 조회 결과가 알려져 있지 않으면 플러딩하고, 있으면 해당 포트로 전달합니다."
  - type: text
    text: "미지 목적지는 플러딩하고 알려진 목적지는 전달한다 단계에서 결과가 다음 네트워크 계층이나 응용으로 전달됩니다."
tags: [switch, lan, mac-table]
difficulty: 3
