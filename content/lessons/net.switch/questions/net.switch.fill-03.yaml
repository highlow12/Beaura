prompt:
  - type: text
    text: "스위치와 LAN에서 핵심이 되는 용어는 ___입니다."
choices:
  - "플러딩"
  - "세마포어"
  - "부동소수점"
acceptedAnswers:
  - "플러딩"
explanation:
  - type: text
    text: "플러딩은(는) 이 레슨에서 다룬 핵심 개념입니다."
  - type: text
    text: "스위치는 링크 계층에서 MAC 주소 학습 표를 만들고 프레임을 해당 포트로 전달합니다. 목적지를 아직 모르거나 브로드캐스트이면 같은 VLAN의 여러 포트로 플러딩할 수 있습니다."
