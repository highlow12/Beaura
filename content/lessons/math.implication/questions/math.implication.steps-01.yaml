schemaVersion: 1
id: math.implication.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "P → Q에서 대우를 만드는 과정을 순서대로 배열하세요."
items:
  - id: negate-q
    content:
      - type: text
        text: "후건 Q를 부정해 ¬Q를 만든다"
  - id: negate-p
    content:
      - type: text
        text: "전건 P를 부정해 ¬P를 만든다"
  - id: reverse
    content:
      - type: text
        text: "부정한 후건을 전건, 부정한 전건을 후건으로 배치한다"
correctOrder:
  - negate-q
  - negate-p
  - reverse
explanation:
  - type: text
    text: "대우는 두 부분을 각각 부정한 뒤 순서를 뒤집어 ¬Q → ¬P로 만듭니다."
  - type: text
    text: "단순히 순서만 뒤집는 역과 달리 두 명제의 부정이 함께 들어갑니다."
tags:
  - discrete-math
  - logic
  - contrapositive
difficulty: 2
