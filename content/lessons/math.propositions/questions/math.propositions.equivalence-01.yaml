schemaVersion: 1
id: math.propositions.equivalence-01
revision: 2
type: multi-select
prompt:
  - type: text
    text: 명제 P ↔ Q가 참이 되는 경우를 모두 고르세요.
options:
  - id: true-true
    content:
      - type: text
        text: P=참, Q=참
  - id: true-false
    content:
      - type: text
        text: P=참, Q=거짓
  - id: false-true
    content:
      - type: text
        text: P=거짓, Q=참
  - id: false-false
    content:
      - type: text
        text: P=거짓, Q=거짓
correctOptionIds:
  - true-true
  - false-false
shuffleOptions: true
explanation:
  - type: text
    text: 동치 P ↔ Q는 P와 Q의 진리값이 같을 때 참입니다. 따라서 둘 다 참이거나 둘 다 거짓인 경우가 정답입니다.
tags:
  - discrete-math
  - equivalence
  - biconditional
difficulty: 2
