schemaVersion: 1
id: os.process.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "프로세스와 실행 단위의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "process-control-block"
  - id: left-b
    content:
      - type: text
        text: "ready"
  - id: left-c
    content:
      - type: text
        text: "blocked"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "프로세스 상태와 자원을 기록한 커널 자료구조"
  - id: right-b
    content:
      - type: text
        text: "CPU를 받을 수 있어 대기하는 상태"
  - id: right-c
    content:
      - type: text
        text: "입출력이나 사건을 기다리는 상태"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "process-control-block은 프로세스 상태와 자원을 기록한 커널 자료구조, ready은 CPU를 받을 수 있어 대기하는 상태입니다."
  - type: text
    text: "blocked은 입출력이나 사건을 기다리는 상태을 뜻하므로 세 역할을 구분해야 합니다."
tags: [process, address-space, lifecycle]
