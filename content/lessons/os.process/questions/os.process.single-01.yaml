schemaVersion: 1
id: os.process.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "프로세스와 실행 단위에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "프로세스는 실행 중인 프로그램과 그 주소 공간·자원·CPU 상태를 묶은 관리 단위다."
  - id: wrong-a
    content:
      - type: text
        text: "프로세스는 CPU에서 한 번도 실행되지 않은 소스 코드 파일이다."
  - id: wrong-b
    content:
      - type: text
        text: "프로세스는 모든 프로그램이 공유하는 하나의 전역 레지스터다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "프로세스는 실행 중인 프로그램과 그 주소 공간·자원·CPU 상태를 묶은 관리 단위다."
  - type: text
    text: "프로세스는 실행 중인 프로그램의 주소 공간, 레지스터 상태, 열린 파일과 같은 자원을 묶은 운영체제 관리 단위입니다. 같은 프로그램도 여러 프로세스로 실행될 수 있습니다."
tags: [process, address-space, lifecycle]
difficulty: 1
