type: fill-blank
prompt:
  - type: text
    text: "같은 실행 파일을 두 번 실행하면 서로 다른 ___가 생길 수 있습니다."
choices:
  - "프로세스"
  - "파일 형식"
  - "명령어 집합"
acceptedAnswers:
  - "프로세스"
explanation:
  - type: text
    text: "같은 브라우저 프로그램을 두 번 실행해도 각각 주소 공간, 실행 레지스터, 열린 파일 상태를 가진 별도 프로세스가 될 수 있습니다. 실행 파일은 디스크의 데이터이고 프로세스는 운영체제가 관리하는 실행 상태와 자원의 묶음입니다."
