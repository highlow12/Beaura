schemaVersion: 1
id: os.process.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "프로세스와 실행 단위의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: create
    content:
      - type: text
        text: "실행 파일과 초기 자원으로 프로세스를 만든다"
  - id: schedule
    content:
      - type: text
        text: "실행 가능한 프로세스를 CPU에 배치한다"
  - id: exit
    content:
      - type: text
        text: "종료 상태와 반환 코드를 기록하고 자원을 회수한다"
correctOrder: [create, schedule, exit]
explanation:
  - type: text
    text: "실행 파일과 초기 자원으로 프로세스를 만든다 단계가 먼저이고, 그 결과를 이용해 실행 가능한 프로세스를 CPU에 배치한다 단계가 이어집니다."
  - type: text
    text: "종료 상태와 반환 코드를 기록하고 자원을 회수한다 단계에서 최종 결과가 다음 실행 단계로 전달됩니다."
tags: [process, address-space, lifecycle]
difficulty: 2
