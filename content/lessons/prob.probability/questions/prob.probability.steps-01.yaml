schemaVersion: 1
id: prob.probability.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "균등한 확률을 계산하는 절차를 배열하세요."
items:
  - id: space
    content:
      - type: text
        text: "가능한 모든 결과의 표본공간을 적는다"
  - id: event
    content:
      - type: text
        text: "관심 사건에 해당하는 결과를 고른다"
  - id: count
    content:
      - type: text
        text: "전체와 사건의 결과 수를 센다"
  - id: divide
    content:
      - type: text
        text: "사건 수를 전체 수로 나눈다"
correctOrder:
  - space
  - event
  - count
  - divide
explanation:
  - type: text
    text: "표본공간을 먼저 정해야 분모를 놓치지 않고 사건의 결과를 세어 확률을 계산할 수 있습니다."
  - type: text
    text: "균등하지 않은 결과라면 각 결과의 확률을 더하는 방식으로 바뀝니다."
tags:
  - probability-statistics
  - probability
  - procedure
difficulty: 2
