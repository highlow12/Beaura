schemaVersion: 1
id: db.joins.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: JOIN 결과에 대한 올바른 설명을 모두 고르세요.
options:
  - id: inner-match
    content:
      - type: text
        text: INNER JOIN은 조건에 맞는 양쪽 행만 남긴다
  - id: left-preserve
    content:
      - type: text
        text: LEFT JOIN은 왼쪽의 미매칭 행도 보존한다
  - id: one-to-many
    content:
      - type: text
        text: 한 왼쪽 행에 여러 오른쪽 행이 매칭되면 결과 행이 여러 개가 될 수 있다
  - id: no-condition-safe
    content:
      - type: text
        text: ON 조건이 없어도 항상 원하는 관계만 정확히 연결된다
correctOptionIds: [inner-match, left-preserve, one-to-many]
shuffleOptions: true
explanation:
  - type: text
    text: JOIN 종류는 미매칭 행을 처리하는 규칙이고, 일대다 관계는 왼쪽 행을 여러 결과로 확장합니다. 조건을 빠뜨리면 의도하지 않은 곱집합이 생길 수 있습니다.
tags: [database, sql, joins]
difficulty: 3
