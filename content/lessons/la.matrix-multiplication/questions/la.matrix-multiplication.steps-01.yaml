schemaVersion: 1
id: la.matrix-multiplication.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "행렬 곱 C=AB의 한 원소를 계산하는 순서를 배열하세요."
items:
  - id: pick-row
    content:
      - type: text
        text: "A에서 C의 행 번호에 해당하는 행을 고른다"
  - id: pick-col
    content:
      - type: text
        text: "B에서 C의 열 번호에 해당하는 열을 고른다"
  - id: products
    content:
      - type: text
        text: "대응 성분을 곱한다"
  - id: sum
    content:
      - type: text
        text: "곱을 모두 더해 C의 원소로 쓴다"
correctOrder:
  - pick-row
  - pick-col
  - products
  - sum
explanation:
  - type: text
    text: "결과 위치 (i,j)에 대해 A의 i행과 B의 j열을 내적합니다."
  - type: text
    text: "차원 조건이 맞아야 두 벡터의 길이가 같습니다."
tags:
  - linear-algebra
  - matrices
  - calculation
difficulty: 2
