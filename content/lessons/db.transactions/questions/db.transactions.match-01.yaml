schemaVersion: 1
id: db.transactions.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: ACID 속성과 의미를 연결하세요.
leftItems:
  - id: atomicity
    content:
      - type: text
        text: 원자성
  - id: isolation
    content:
      - type: text
        text: 격리성
  - id: durability
    content:
      - type: text
        text: 지속성
rightItems:
  - id: all-or-none
    content:
      - type: text
        text: 변경 전체가 반영되거나 전부 취소된다
  - id: interference
    content:
      - type: text
        text: 동시에 실행되는 작업의 간섭을 제한한다
  - id: after-commit
    content:
      - type: text
        text: commit 결과가 장애 뒤에도 보존된다
correctPairs:
