schemaVersion: 1
id: prob.randomized-hashing.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "무작위 알고리즘과 해싱에 대한 옳은 설명을 모두 고르세요."
options:
  - id: expected
    content:
      - type: text
        text: "실행 경로가 달라도 기대 비용으로 분석할 수 있다"
  - id: spread
    content:
      - type: text
        text: "균등한 해시는 충돌을 평균적으로 분산한다"
  - id: collision-resolution
    content:
      - type: text
        text: "chaining은 충돌한 키를 같은 버킷의 구조에 보관할 수 있다"
  - id: zero-collision
    content:
      - type: text
        text: "좋은 해시 함수는 어떤 입력에서도 충돌이 없다"
correctOptionIds: [expected, spread, collision-resolution]
shuffleOptions: true
explanation:
  - type: text
    text: "무작위 분석은 기대값을 사용하고, 해시 품질은 충돌을 줄이고 고르게 만드는 데 있습니다."
  - type: text
    text: "유한한 해시 공간에서는 서로 다른 키의 충돌이 원리적으로 가능할 수 있습니다."
tags:
  - probability-statistics
  - randomized-algorithms
  - hashing
difficulty: 2
