schemaVersion: 1
id: gfx.transforms.effects-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: 변환 행렬의 합성 순서에 대한 올바른 설명을 모두 고르세요.
options:
  - id: noncommutative
    content:
      - type: text
        text: 회전 후 이동과 이동 후 회전은 일반적으로 다른 결과다
  - id: point-check
    content:
      - type: text
        text: 점 하나를 대입하면 합성 순서의 결과를 확인할 수 있다
  - id: commute
    content:
      - type: text
        text: 모든 그래픽 변환 행렬은 순서를 바꿔도 항상 같다
  - id: no-matrix
    content:
      - type: text
        text: 여러 변환은 행렬로 합성할 수 없다
correctOptionIds: [noncommutative, point-check]
shuffleOptions: true
explanation:
  - type: text
    text: 행렬 곱은 일반적으로 교환법칙을 만족하지 않습니다. 점을 직접 계산하면 순서가 만든 차이를 빠르게 확인할 수 있습니다.
tags: [graphics, transforms, composition]
difficulty: 3
