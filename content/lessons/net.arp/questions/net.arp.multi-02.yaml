schemaVersion: 1
id: net.arp.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "ARP와 로컬 주소 찾기에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "ARP 요청은 목적지 MAC을 모를 때 브로드캐스트될 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "다른 서브넷의 서버로 보낼 때 호스트는 게이트웨이 MAC을 사용할 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "ARP 캐시는 한 번 저장하면 IP나 MAC이 바뀌어도 절대 만료되지 않는다."
  - id: wrong-b
    content:
      - type: text
        text: "ARP는 TCP 시퀀스 번호로 바이트 스트림 순서를 복구한다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "ARP 요청은 목적지 MAC을 모를 때 브로드캐스트될 수 있다. 다른 서브넷의 서버로 보낼 때 호스트는 게이트웨이 MAC을 사용할 수 있다."
  - type: text
    text: "ARP는 단순하지만 로컬 브로드캐스트와 캐시 오염 공격에 노출됩니다. 캐시 만료와 보안 검증을 통해 오래된 매핑이나 위조 응답의 영향을 줄입니다."
tags: [arp, ipv4, mac]
difficulty: 3
