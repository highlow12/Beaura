id: ds.priority-queue.concept-01
type: single-choice
prompt:
- type: text
  text: 일반 큐와 우선순위 큐의 가장 큰 차이는 무엇인가요?
options:
- id: priority
  content:
  - type: text
    text: 우선순위 큐는 도착 순서가 아니라 priority로 다음 항목을 고른다
- id: fifo
  content:
  - type: text
    text: 우선순위 큐도 항상 먼저 온 항목만 꺼낸다
- id: index
  content:
  - type: text
    text: 우선순위 큐는 인덱스로만 항목을 접근한다
- id: unique
  content:
  - type: text
    text: 우선순위 큐는 중복 항목을 허용하지 않는다
correctOptionId: priority
shuffleOptions: true
explanation:
- type: text
  text: 일반 큐는 FIFO지만 우선순위 큐는 항목의 priority가 꺼내는 순서를 결정합니다. 중복 허용 여부는 별도 정책입니다.
schemaVersion: 1
revision: 1
tags:
- queue
- priority-queue
difficulty: 2
