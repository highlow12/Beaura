schemaVersion: 1
id: prob.random-variables.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "확률변수 분포표를 검증하는 순서를 배열하세요."
items:
  - id: list
    content:
      - type: text
        text: "확률변수가 가질 수 있는 값을 나열한다"
  - id: assign
    content:
      - type: text
        text: "각 값의 확률을 표에 적는다"
  - id: nonnegative
    content:
      - type: text
        text: "확률이 음수가 아닌지 확인한다"
  - id: sum
    content:
      - type: text
        text: "확률 합이 1인지 확인한다"
correctOrder:
  - list
  - assign
  - nonnegative
  - sum
explanation:
  - type: text
    text: "가능한 값과 대응 확률을 만든 뒤 공리 조건을 검사합니다."
  - type: text
    text: "합이 1이 아니면 누락된 결과나 잘못된 확률을 다시 확인해야 합니다."
tags:
  - probability-statistics
  - random-variables
  - validation
difficulty: 2
