schemaVersion: 1
id: os.virtual-memory.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "가상 메모리에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "가상 메모리는 프로세스의 가상 주소를 필요에 따라 물리 프레임에 매핑하는 추상화다."
  - id: wrong-a
    content:
      - type: text
        text: "가상 메모리는 RAM의 모든 내용을 전원 없이 영구 보존하는 저장장치다."
  - id: wrong-b
    content:
      - type: text
        text: "가상 메모리를 사용하면 페이지 폴트가 절대 발생하지 않는다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "가상 메모리는 프로세스의 가상 주소를 필요에 따라 물리 프레임에 매핑하는 추상화다."
  - type: text
    text: "가상 메모리는 프로세스에 연속적이고 독립적인 주소 공간을 보여 주고, 실제 물리 프레임으로 필요할 때 매핑하는 메모리 관리 기법입니다."
tags: [virtual-memory, page, memory-protection]
difficulty: 2
