schemaVersion: 1
id: os.virtual-memory.ordering-04
revision: 2
type: ordering
prompt:
  - type: text
    text: "가상 메모리의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: split
    content:
      - type: text
        text: "가상 주소를 페이지 번호와 오프셋으로 나눈다"
  - id: lookup
    content:
      - type: text
        text: "페이지 테이블에서 물리 프레임을 찾는다"
  - id: fault
    content:
      - type: text
        text: "유효하지만 RAM에 없는 페이지는 적재해 재시도하고, 잘못된 접근은 오류를 낸다"
correctOrder: [split, lookup, fault]
explanation:
  - type: text
    text: "가상 주소를 페이지 번호와 오프셋으로 나눈다 단계가 먼저이고, 그 결과를 이용해 페이지 테이블에서 물리 프레임을 찾는다 단계가 이어집니다."
  - type: text
    text: "유효한 페이지의 부재와 잘못된 주소·권한 위반은 서로 다르게 처리합니다."
tags: [virtual-memory, page, memory-protection]
difficulty: 3
