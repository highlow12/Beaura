schemaVersion: 1
id: os.virtual-memory.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "가상 메모리의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "virtual-page"
  - id: left-b
    content:
      - type: text
        text: "physical-frame"
  - id: left-c
    content:
      - type: text
        text: "page-fault"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "프로세스가 보는 고정 크기 주소 블록"
  - id: right-b
    content:
      - type: text
        text: "RAM에서 페이지가 놓이는 블록"
  - id: right-c
    content:
      - type: text
        text: "필요한 페이지 매핑이 없을 때의 예외"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "virtual-page은 프로세스가 보는 고정 크기 주소 블록, physical-frame은 RAM에서 페이지가 놓이는 블록입니다."
  - type: text
    text: "page-fault은 필요한 페이지 매핑이 없을 때의 예외을 뜻하므로 세 역할을 구분해야 합니다."
tags: [virtual-memory, page, memory-protection]
difficulty: 2
