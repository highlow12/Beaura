schemaVersion: 1
id: os.virtual-memory.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "가상 메모리에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "페이지 폴트는 접근한 페이지가 현재 필요한 물리 프레임에 없을 때 발생할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "가상 메모리는 프로세스 간 주소 공간을 분리하는 데 도움을 준다."
  - id: wrong-a
    content:
      - type: text
        text: "가상 주소의 모든 페이지는 프로그램 시작 순간 반드시 RAM에 적재된다."
  - id: wrong-b
    content:
      - type: text
        text: "가상 메모리는 메모리 보호 권한과 함께 사용할 수 없다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "페이지 폴트는 접근한 페이지가 현재 필요한 물리 프레임에 없을 때 발생할 수 있다. 가상 메모리는 프로세스 간 주소 공간을 분리하는 데 도움을 준다."
  - type: text
    text: "가상 메모리는 보호·공유·오버커밋을 가능하게 하지만 주소 변환과 페이지 폴트는 비용이 큽니다. RAM이 부족해 폴트가 반복되면 스래싱이 발생할 수 있습니다."
tags: [virtual-memory, page, memory-protection]
difficulty: 3
