schemaVersion: 1
id: algo.kruskal.trace-01
revision: 1
type: code-output
prompt:
- type: text
  text: 다음 순서로 간선을 처리할 때 선택되는 간선의 개수를 고르세요.
language: python
code: |-
  edges = [("A", "B", 1), ("B", "C", 2), ("A", "C", 3)]
  chosen = []
  groups = {"A": "A", "B": "B", "C": "C"}
  for u, v, weight in edges:
      if groups[u] != groups[v]:
          chosen.append(weight)
          root = groups[v]
          for node in groups:
              if groups[node] == root:
                  groups[node] = groups[u]
  print(len(chosen))
choices:
- '2'
- '1'
- '3'
acceptedOutputs:
- '2'
explanation:
- type: text
  text: 가중치 1과 2의 간선으로 세 정점이 연결되므로 두 간선을 선택하고, 가중치 3의 간선은 사이클이 되어 건너뜁니다.
