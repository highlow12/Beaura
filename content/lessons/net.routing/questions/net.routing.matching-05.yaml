  - id: right-a
    content:
      - type: text
        text: "목적지와 전달 방향을 기록한 표"
  - id: right-b
    content:
      - type: text
        text: "패킷을 넘길 다음 라우터 또는 장치"
  - id: right-c
    content:
      - type: text
        text: "더 구체적인 일치가 없을 때 쓰는 경로"
correctPairs:
