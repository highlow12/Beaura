    text: "라우팅과 다음 홉의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "routing-table"
  - id: left-b
    content:
      - type: text
        text: "next-hop"
  - id: left-c
    content:
      - type: text
        text: "default-route"
