id: net.routing.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "`10.0.0.0/8`과 `10.1.0.0/16`이 모두 일치하면 선택하는 경로는 ___입니다."
choices:
  - "/16"
  - "/8"
  - "둘 다 동시에"
acceptedAnswers:
  - "/16"
explanation:
  - type: text
    text: "라우팅 표에 `10.0.0.0/8`과 `10.1.0.0/16`이 있다면 목적지 `10.1.2.3`은 더 구체적인 `/16`에 일치합니다. 라우터는 그 항목의 다음 홉과 인터페이스로 전달합니다. 다른 항목이 없을 때는 **기본 경로가 설정되어 있다면** 이를 쓰고, 없다면 전달할 경로가 없습니다."
tags: [routing, router, forwarding]
difficulty: 2
