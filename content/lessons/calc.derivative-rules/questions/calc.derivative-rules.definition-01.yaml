schemaVersion: 1
id: calc.derivative-rules.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "두 함수의 곱 fg를 미분한 식은 무엇인가요?"
options:
  - id: product
    content:
      - type: text
        text: "f′g+fg′"
  - id: wrong-sum
    content:
      - type: text
        text: "f′+g′"
  - id: multiply-deriv
    content:
      - type: text
        text: "f′g′"
  - id: square
    content:
      - type: text
        text: "(fg)²"
correctOptionId: product
shuffleOptions: true
explanation:
  - type: text
    text: "곱의 법칙은 첫 함수 미분×둘째 함수와 첫 함수×둘째 함수 미분의 합입니다."
  - type: text
    text: "두 함수를 단순히 각각 미분해 곱하는 것은 올바르지 않습니다."
tags:
  - calculus
  - derivative-rules
  - product-rule
difficulty: 1
