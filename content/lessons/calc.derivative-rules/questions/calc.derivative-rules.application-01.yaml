schemaVersion: 1
id: calc.derivative-rules.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "연쇄 법칙을 적용해야 하는 식을 모두 고르세요."
options:
  - id: sin-square
    content:
      - type: text
        text: "sin(x²)"
  - id: square-sin
    content:
      - type: text
        text: "(sin x)²"
  - id: linear
    content:
      - type: text
        text: "3x+1"
  - id: nested-exp
    content:
      - type: text
        text: "e^(2x+1)"
correctOptionIds: [sin-square, square-sin, nested-exp]
shuffleOptions: true
explanation:
  - type: text
    text: "함수 안에 다른 함수가 들어간 합성 구조에는 연쇄 법칙이 필요합니다."
  - type: text
    text: "3x+1은 기본 선형식이라 직접 미분할 수 있습니다."
tags:
  - calculus
  - derivative-rules
  - chain-rule
difficulty: 2
