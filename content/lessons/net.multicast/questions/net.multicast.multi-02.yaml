schemaVersion: 1
id: net.multicast.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "브로드캐스트와 멀티캐스트에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "ARP 요청은 같은 링크의 브로드캐스트로 전달될 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "멀티캐스트는 같은 데이터를 여러 그룹 구성원에게 전달하는 모델이다."
  - id: wrong-a
    content:
      - type: text
        text: "브로드캐스트는 인터넷 전체 라우터를 넘어 무제한으로 퍼진다."
  - id: wrong-b
    content:
      - type: text
        text: "유니캐스트와 멀티캐스트는 수신자 범위에 차이가 없다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "ARP 요청은 같은 링크의 브로드캐스트로 전달될 수 있다. 멀티캐스트는 같은 데이터를 여러 그룹 구성원에게 전달하는 모델이다."
  - type: text
    text: "브로드캐스트는 발견에 편리하지만 장치 수가 늘면 불필요한 처리량이 커집니다. 멀티캐스트는 효율적일 수 있지만 스위치·라우터·응용 지원이 필요합니다."
tags: [broadcast, multicast, unicast]
difficulty: 2
