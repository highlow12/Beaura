prompt:
  - type: text
    text: "그룹에 가입한 수신자들에게 보내는 방식은 ___입니다."
choices:
  - "멀티캐스트"
  - "유니캐스트"
  - "브로드캐스트"
acceptedAnswers:
  - "멀티캐스트"
explanation:
  - type: text
    text: "한 송신자가 A에게만 보내면 유니캐스트, 같은 브로드캐스트 영역 전체에 알리면 브로드캐스트입니다. 그룹 가입자 A와 B에게만 전달하도록 설정하면 멀티캐스트입니다. 스위치·라우터의 그룹 관리가 없으면 복제 범위가 구현에 따라 달라질 수 있습니다."
