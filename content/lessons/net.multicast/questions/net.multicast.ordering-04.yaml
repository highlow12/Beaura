schemaVersion: 1
id: net.multicast.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "브로드캐스트와 멀티캐스트의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: address
    content:
      - type: text
        text: "전송 범위를 유니·브로드·멀티캐스트 중 정한다"
  - id: join
    content:
      - type: text
        text: "멀티캐스트라면 수신자가 그룹에 가입한다"
  - id: replicate
    content:
      - type: text
        text: "네트워크 장치가 필요한 링크에만 프레임을 복사한다"
correctOrder: [address, join, replicate]
explanation:
  - type: text
    text: "전송 범위를 유니·브로드·멀티캐스트 중 정한다 단계가 먼저이고, 그 결과를 이용해 멀티캐스트라면 수신자가 그룹에 가입한다 단계가 이어집니다."
  - type: text
    text: "네트워크 장치가 필요한 링크에만 프레임을 복사한다 단계에서 결과가 다음 네트워크 계층이나 응용으로 전달됩니다."
tags: [broadcast, multicast, unicast]
difficulty: 2
