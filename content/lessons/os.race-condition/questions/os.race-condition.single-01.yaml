explanation:
  - type: text
    text: "경쟁 조건은 공유 데이터 결과가 여러 실행 흐름의 실행 순서에 따라 달라지는 버그다."
  - type: text
    text: "경쟁 조건은 여러 실행 흐름이 공유 데이터에 접근하는 순서에 따라 결과가 달라지는 상황입니다. 임계 구역의 원자성이 보장되지 않으면 갱신이 사라질 수 있습니다."
