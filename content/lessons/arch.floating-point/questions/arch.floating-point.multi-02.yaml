schemaVersion: 1
id: arch.floating-point.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "부동소수점 표현에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "0.1처럼 이진 소수로 무한히 이어지는 값은 반올림 오차가 생길 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "지수의 크기는 표현할 수 있는 값의 범위에 영향을 준다."
  - id: wrong-a
    content:
      - type: text
        text: "가수 비트 수가 줄어들수록 항상 정밀도가 높아진다."
  - id: wrong-b
    content:
      - type: text
        text: "부동소수점 비교에서는 근사 오차를 고려할 필요가 없다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "0.1처럼 이진 소수로 무한히 이어지는 값은 반올림 오차가 생길 수 있다. 지수의 크기는 표현할 수 있는 값의 범위에 영향을 준다."
  - type: text
    text: "부동소수점은 넓은 범위와 빠른 하드웨어 연산을 제공하지만 반올림 오차와 `NaN`, 무한대 같은 특수값을 고려해야 합니다. 금액처럼 정확한 소수 자릿수가 중요한 값에는 별도 표현이 필요합니다."
tags: [floating-point, ieee-754, precision]
difficulty: 3
