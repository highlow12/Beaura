schemaVersion: 1
id: prob.statistics.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "기술통계와 상관에 대한 옳은 설명을 모두 고르세요."
options:
  - id: mean
    content:
      - type: text
        text: "평균은 모든 관측값을 사용한다"
  - id: median
    content:
      - type: text
        text: "중앙값은 정렬된 자료의 가운데 위치다"
  - id: correlation
    content:
      - type: text
        text: "상관은 변수들이 함께 변하는 정도를 요약한다"
  - id: causation
    content:
      - type: text
        text: "상관만으로 인과를 확정할 수 있다"
correctOptionIds: [mean, median, correlation]
shuffleOptions: true
explanation:
  - type: text
    text: "평균·중앙값은 중심을 요약하고 상관은 함께 변하는 패턴을 요약합니다."
  - type: text
    text: "인과관계를 주장하려면 상관 외의 설계와 근거가 필요합니다."
tags:
  - probability-statistics
  - statistics
  - summary
difficulty: 2
