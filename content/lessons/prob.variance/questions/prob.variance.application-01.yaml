schemaVersion: 1
id: prob.variance.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "분산과 표준편차에 대한 옳은 설명을 모두 고르세요."
options:
  - id: nonnegative
    content:
      - type: text
        text: "분산은 0 이상이다"
  - id: sqrt
    content:
      - type: text
        text: "표준편차는 분산의 제곱근이다"
  - id: shift
    content:
      - type: text
        text: "상수만 더해도 분산은 변하지 않는다"
  - id: negative
    content:
      - type: text
        text: "분산은 음수가 될 수 있다"
correctOptionIds: [nonnegative, sqrt, shift]
shuffleOptions: true
explanation:
  - type: text
    text: "편차 제곱의 평균인 분산은 음수가 아니며 상수 이동은 편차 차이를 바꾸지 않습니다."
  - type: text
    text: "모든 값이 같을 때 분산은 0입니다."
tags:
  - probability-statistics
  - variance
  - properties
difficulty: 2
