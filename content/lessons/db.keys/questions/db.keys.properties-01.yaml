schemaVersion: 1
id: db.keys.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: 기본 키와 외래 키의 설명으로 올바른 것을 모두 고르세요.
options:
  - id: primary-unique
    content:
      - type: text
        text: 기본 키는 행을 유일하게 식별해야 한다
  - id: primary-not-null
    content:
      - type: text
        text: 기본 키 값은 NULL일 수 없다
  - id: foreign-reference
    content:
      - type: text
        text: 외래 키는 참조 대상 테이블의 키와 연결된다
  - id: app-only
    content:
      - type: text
        text: 외래 키 규칙은 항상 애플리케이션 코드에서만 검사한다
correctOptionIds: [primary-unique, primary-not-null, foreign-reference]
shuffleOptions: true
explanation:
  - type: text
    text: 기본 키에는 유일성과 NOT NULL 성질이 있고, 외래 키는 참조 무결성을 DB 제약으로 표현할 수 있습니다. 애플리케이션 검사는 DB 제약을 대신하지 못합니다.
tags: [database, keys, integrity]
difficulty: 2
