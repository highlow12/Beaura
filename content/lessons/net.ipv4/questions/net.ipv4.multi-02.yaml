schemaVersion: 1
id: net.ipv4.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "IP 주소와 IPv4 패킷에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "라우터는 목적지 IP를 보고 다음 홉을 선택한다."
  - id: correct-b
    content:
      - type: text
        text: "라우터를 지날 때 패킷의 TTL이 감소할 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "다른 네트워크로 가는 IP 패킷의 프레임 MAC은 전체 경로에서 고정이다."
  - id: wrong-b
    content:
      - type: text
        text: "IP의 기본 기능은 데이터가 반드시 순서대로 도착하도록 보장하는 것이다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "라우터는 목적지 IP를 보고 다음 홉을 선택한다. 라우터를 지날 때 패킷의 TTL이 감소할 수 있다."
  - type: text
    text: "IP는 다양한 링크를 하나의 인터넷으로 연결하지만 최선형(best-effort)이라 전달·순서를 보장하지 않습니다. TTL은 순환 경로에서 패킷이 영원히 남는 것을 막습니다."
tags: [ip, ipv4, internet-layer]
difficulty: 3
