prompt:
  - type: text
    text: "IP 주소와 IPv4 패킷에서 핵심이 되는 용어는 ___입니다."
choices:
  - "TTL"
  - "포트"
  - "가수"
acceptedAnswers:
  - "TTL"
explanation:
  - type: text
    text: "TTL은(는) 이 레슨에서 다룬 핵심 개념입니다."
  - type: text
    text: "IPv4 주소는 32비트 값으로 네트워크 부분과 호스트 부분을 구분해 사용합니다. IP 패킷은 출발지·목적지 주소와 TTL 같은 헤더를 가지고 라우터를 거칩니다."
