schemaVersion: 1
id: net.ipv4.matching-05
revision: 2
type: matching
prompt:
  - type: text
    text: "IP 주소와 IPv4 패킷의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "IP 주소"
  - id: left-b
    content:
      - type: text
        text: "라우터"
  - id: left-c
    content:
      - type: text
        text: "TTL"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "인터넷 계층에서 호스트·네트워크를 식별하는 주소"
  - id: right-b
    content:
      - type: text
        text: "서로 다른 네트워크 사이에서 패킷을 전달하는 장치"
  - id: right-c
    content:
      - type: text
        text: "홉 수를 제한하는 IP 헤더 필드"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "IP 주소은 인터넷 계층에서 호스트·네트워크를 식별하는 주소, 라우터은 서로 다른 네트워크 사이에서 패킷을 전달하는 장치, TTL은 홉 수를 제한하는 IP 헤더 필드에 해당합니다."
tags: [ip, ipv4, internet-layer]
difficulty: 2
