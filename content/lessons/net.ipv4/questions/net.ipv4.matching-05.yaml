schemaVersion: 1
id: net.ipv4.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "IP 주소와 IPv4 패킷의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "ip-address"
  - id: left-b
    content:
      - type: text
        text: "router"
  - id: left-c
    content:
      - type: text
        text: "ttl"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "인터넷 계층에서 호스트·네트워크를 식별하는 주소"
  - id: right-b
    content:
      - type: text
        text: "서로 다른 네트워크 사이에서 패킷을 전달하는 장치"
  - id: right-c
    content:
      - type: text
        text: "홉 수를 제한하는 IP 헤더 필드"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "ip-address은 인터넷 계층에서 호스트·네트워크를 식별하는 주소, router은 서로 다른 네트워크 사이에서 패킷을 전달하는 장치입니다."
  - type: text
    text: "ttl은 홉 수를 제한하는 IP 헤더 필드을 뜻하므로 세 역할을 구분해야 합니다."
tags: [ip, ipv4, internet-layer]
difficulty: 2
