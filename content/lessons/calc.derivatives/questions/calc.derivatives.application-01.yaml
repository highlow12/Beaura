schemaVersion: 1
id: calc.derivatives.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "미분에 대한 옳은 설명을 모두 고르세요."
options:
  - id: constant-zero
    content:
      - type: text
        text: "상수 함수의 도함수는 0이다"
  - id: position-speed
    content:
      - type: text
        text: "위치를 미분하면 속도가 된다"
  - id: sign
    content:
      - type: text
        text: "도함수의 부호로 증가·감소를 판단할 수 있다"
  - id: area
    content:
      - type: text
        text: "모든 도함수는 넓이를 나타낸다"
correctOptionIds: [constant-zero, position-speed, sign]
shuffleOptions: true
explanation:
  - type: text
    text: "도함수는 변화율을 측정하므로 상수는 변화가 없고 위치의 변화율은 속도입니다."
  - type: text
    text: "넓이는 적분과 연결되는 개념입니다."
tags:
  - calculus
  - derivatives
  - interpretation
difficulty: 2
