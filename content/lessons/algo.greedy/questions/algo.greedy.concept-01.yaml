schemaVersion: 1
id: algo.greedy.concept-01
revision: 1
type: single-choice
prompt:
- type: text
  text: 활동 선택 문제에서 최대 개수의 활동을 고를 때 대표적인 그리디 규칙은 무엇인가요?
options:
- id: earliest-finish
  content:
  - type: text
    text: 종료 시간이 가장 빠른 호환 활동을 고른다
- id: longest
  content:
  - type: text
    text: 실행 시간이 가장 긴 활동을 고른다
- id: latest-start
  content:
  - type: text
    text: 시작 시간이 가장 늦은 활동만 고른다
correctOptionId: earliest-finish
shuffleOptions: true
explanation:
- type: text
  text: 가장 빨리 끝나는 활동을 고르면 남은 시간과 선택지가 가장 많이 남아 최대 개수를 만들 수 있습니다.
tags:
- greedy
- activity-selection
- correctness
