schemaVersion: 1
id: algo.greedy.trace-01
revision: 1
type: code-output
prompt:
- type: text
  text: 종료 시간 순으로 정렬된 활동에서 그리디가 선택하는 활동 수를 고르세요.
language: python
code: |-
  activities = [(1, 3), (2, 4), (3, 5)]
  last_finish = 0
  count = 0
  for start, finish in activities:
      if start >= last_finish:
          count += 1
          last_finish = finish
  print(count)
choices:
- '2'
- '1'
- '3'
acceptedOutputs:
- '2'
explanation:
- type: text
  text: (1, 3)을 고른 뒤 (2, 4)는 겹치므로 건너뛰고, (3, 5)를 골라 총 두 개가 됩니다.
tags:
