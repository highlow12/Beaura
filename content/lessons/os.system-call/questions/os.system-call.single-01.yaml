schemaVersion: 1
id: os.system-call.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "시스템 호출에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "시스템 호출은 사용자 프로그램이 커널의 보호된 서비스를 요청하는 경계다."
  - id: wrong-a
    content:
      - type: text
        text: "시스템 호출은 네트워크에서 도메인 이름을 IP로 바꾸는 프로토콜이다."
  - id: wrong-b
    content:
      - type: text
        text: "시스템 호출은 사용자 프로그램이 커널 검사를 우회하도록 하는 명령이다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "시스템 호출은 사용자 프로그램이 커널의 보호된 서비스를 요청하는 경계다."
  - type: text
    text: "시스템 호출(system call)은 사용자 공간 프로그램이 커널 서비스를 요청하는 공식 경계입니다. 호출 번호와 인자는 커널이 검사한 뒤 작업을 수행하고 반환값이나 오류를 돌려줍니다."
tags: [system-call, kernel, api]
difficulty: 1
