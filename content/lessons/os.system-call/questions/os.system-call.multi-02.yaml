schemaVersion: 1
id: os.system-call.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "시스템 호출에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "커널은 시스템 호출 인자와 접근 권한을 검증할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "파일 열기와 읽기 같은 기능은 시스템 호출 인터페이스를 통해 제공될 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "시스템 호출은 항상 사용자 공간에서만 실행되고 커널에 들어가지 않는다."
  - id: wrong-b
    content:
      - type: text
        text: "시스템 호출은 오류가 나도 반환값이나 오류 정보를 제공하지 않는다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "커널은 시스템 호출 인자와 접근 권한을 검증할 수 있다. 파일 열기와 읽기 같은 기능은 시스템 호출 인터페이스를 통해 제공될 수 있다."
  - type: text
    text: "검사와 모드 전환은 안전성을 보장하지만 호출마다 비용이 듭니다. 작은 읽기를 반복하기보다 버퍼를 사용해 호출 횟수를 줄이면 효율이 좋아집니다."
tags: [system-call, kernel, api]
difficulty: 2
