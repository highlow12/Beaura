schemaVersion: 1
id: arch.isa.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "명령어와 ISA에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "ISA는 프로그램이 볼 수 있는 명령어와 레지스터·주소 지정 규칙을 정의하는 계약이다."
  - id: wrong-a
    content:
      - type: text
        text: "ISA는 특정 CPU의 냉각 장치 배치만 설명한다."
  - id: wrong-b
    content:
      - type: text
        text: "ISA는 소스 코드의 변수 이름을 그대로 메모리에 저장하는 형식이다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "ISA는 프로그램이 볼 수 있는 명령어와 레지스터·주소 지정 규칙을 정의하는 계약이다."
  - type: text
    text: "ISA(Instruction Set Architecture)는 명령어 종류, 레지스터, 주소 지정 방식, 메모리 모델 등 프로그램이 볼 수 있는 CPU 계약입니다. 한 명령어는 보통 opcode와 operand 정보를 포함합니다."
tags: [isa, instruction, opcode]
difficulty: 2
