schemaVersion: 1
id: arch.alu.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "ALU와 산술 논리 연산에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "ALU의 zero 플래그는 결과가 0인지 나타내는 데 쓰일 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "뺄셈을 덧셈 회로와 입력 반전으로 구현하면 하드웨어를 재사용할 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "ALU의 입력은 반드시 네트워크 패킷이어야 한다."
  - id: wrong-b
    content:
      - type: text
        text: "ALU가 만든 결과는 항상 자동으로 메모리에 기록된다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "ALU의 zero 플래그는 결과가 0인지 나타내는 데 쓰일 수 있다. 뺄셈을 덧셈 회로와 입력 반전으로 구현하면 하드웨어를 재사용할 수 있다."
  - type: text
    text: "ALU에 연산 종류와 폭을 더하면 명령어가 풍부해지지만 회로·전력·제어가 복잡해집니다. 단순한 연산을 빠르게 조합하는 것이 파이프라인 성능에도 영향을 줍니다."
tags: [alu, arithmetic, control]
difficulty: 3
