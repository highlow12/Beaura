schemaVersion: 1
id: arch.alu.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "ALU와 산술 논리 연산의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: fetch
    content:
      - type: text
        text: "레지스터에서 연산 입력을 읽는다"
  - id: select
    content:
      - type: text
        text: "제어 신호로 수행할 연산을 선택한다"
  - id: flag
    content:
      - type: text
        text: "결과와 조건 플래그를 다음 제어 단계에 전달한다"
correctOrder: [fetch, select, flag]
explanation:
  - type: text
    text: "레지스터에서 연산 입력을 읽는다 단계가 먼저이고, 그 결과를 이용해 제어 신호로 수행할 연산을 선택한다 단계가 이어집니다."
  - type: text
    text: "결과와 조건 플래그를 다음 제어 단계에 전달한다 단계에서 최종 결과가 다음 회로 또는 프로그램으로 전달됩니다."
tags: [alu, arithmetic, control]
difficulty: 3
