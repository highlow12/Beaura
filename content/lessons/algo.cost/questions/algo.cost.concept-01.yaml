  - type: text
    text: 사용한 프로그래밍 언어의 문법 수
correctOptionId: input
shuffleOptions: true
explanation:
- type: text
  text: 입력 크기 n과 비교·대입 같은 기본 연산을 정해야 반복 횟수와 성장률을 셀 수 있습니다. 실제 시간은 환경에 따라 달라집니다.
