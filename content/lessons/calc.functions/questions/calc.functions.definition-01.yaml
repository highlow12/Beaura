    content:
      - type: text
        text: "각 입력에 정확히 하나의 출력이 대응한다"
  - id: many-output
    content:
      - type: text
        text: "입력 하나에 여러 출력이 대응한다"
  - id: no-output
    content:
      - type: text
        text: "일부 입력에는 출력이 없어도 된다"
