shuffleOptions: true
explanation:
  - type: text
    text: "함수는 정의역의 모든 입력에 하나의 출력만 대응시키는 규칙입니다."
  - type: text
    text: "서로 다른 입력이 같은 출력으로 가는 것은 함수에서 허용됩니다."
