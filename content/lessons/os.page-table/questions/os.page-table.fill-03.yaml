schemaVersion: 1
id: os.page-table.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "TLB에서 변환을 찾지 못했을 때 확인하는 매핑 자료구조는 ___입니다."
choices:
  - "페이지 테이블"
  - "우선순위 큐"
  - "파일 이름"
acceptedAnswers:
  - "페이지 테이블"
explanation:
  - type: text
    text: "가상 주소의 페이지 번호가 TLB에 있으면 캐시된 프레임 번호와 권한을 이용해 접근합니다. TLB에 없으면 페이지 테이블을 확인합니다. 이때 유효한 매핑을 찾으면 TLB를 채울 수 있지만, 페이지가 RAM에 없다면 페이지 폴트를 처리해야 합니다. 매핑이 없거나 권한이 없으면 접근 오류가 될 수도 있습니다."
tags: [page-table, tlb, mmu]
difficulty: 3
