explanation:
  - type: text
    text: "TLB는 최근 가상 페이지와 물리 프레임 매핑을 캐시해 주소 변환을 빠르게 한다."
  - type: text
    text: "페이지 테이블은 가상 페이지 번호와 물리 프레임 번호, 읽기·쓰기·실행 권한을 기록합니다. TLB는 자주 쓰는 변환을 저장하는 작은 캐시입니다."
