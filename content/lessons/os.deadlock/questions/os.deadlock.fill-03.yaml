schemaVersion: 1
id: os.deadlock.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "A가 L1을 가진 채 L2를 기다리고 B가 L2를 가진 채 L1을 기다리는 조건은 ___입니다."
choices:
  - "순환 대기"
  - "페이지 폴트"
  - "시간 조각"
acceptedAnswers:
  - "순환 대기"
explanation:
  - type: text
    text: "A가 L1을 보유하며 L2를 기다리고 B가 L2를 보유하며 L1을 기다리면 두 작업은 서로 진행할 수 없습니다. 이를 순환 대기라고 합니다. 두 작업 모두 L1 다음 L2 순서로만 잠그면 이 순환을 예방할 수 있습니다."
tags: [deadlock, lock-order, concurrency]
difficulty: 3
