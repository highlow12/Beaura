schemaVersion: 1
id: os.deadlock.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "교착상태에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "상호 배제·점유 대기·선점 불가·순환 대기는 데드락의 네 조건이다."
  - id: correct-b
    content:
      - type: text
        text: "모든 락을 전역 순서로 획득하면 순환 대기를 예방할 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "락을 두 개 사용하면 네 조건과 관계없이 항상 데드락이 난다."
  - id: wrong-b
    content:
      - type: text
        text: "데드락에서는 적어도 하나의 대기 흐름이 자원을 얻어 반드시 진행한다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "상호 배제·점유 대기·선점 불가·순환 대기는 데드락의 네 조건이다. 모든 락을 전역 순서로 획득하면 순환 대기를 예방할 수 있다."
  - type: text
    text: "예방 규칙은 안전하지만 자원 활용이나 코드 유연성을 제한할 수 있습니다. 탐지 후 복구는 평상시 비용이 낮지만 작업을 취소하거나 자원을 회수해야 합니다."
tags: [deadlock, lock-order, concurrency]
difficulty: 4
