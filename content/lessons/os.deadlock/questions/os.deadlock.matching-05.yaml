schemaVersion: 1
id: os.deadlock.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "교착상태의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "mutual-exclusion"
  - id: left-b
    content:
      - type: text
        text: "hold-and-wait"
  - id: left-c
    content:
      - type: text
        text: "circular-wait"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "자원을 한 흐름만 사용하게 하는 조건"
  - id: right-b
    content:
      - type: text
        text: "자원을 가진 채 다른 자원을 기다리는 조건"
  - id: right-c
    content:
      - type: text
        text: "대기 관계가 고리로 이어지는 조건"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "mutual-exclusion은 자원을 한 흐름만 사용하게 하는 조건, hold-and-wait은 자원을 가진 채 다른 자원을 기다리는 조건입니다."
  - type: text
    text: "circular-wait은 대기 관계가 고리로 이어지는 조건을 뜻하므로 세 역할을 구분해야 합니다."
tags: [deadlock, lock-order, concurrency]
difficulty: 3
