schemaVersion: 1
id: la.vector-space.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "기저가 되기 위해 필요한 성질을 모두 고르세요."
options:
  - id: span
    content:
      - type: text
        text: "공간 전체를 생성한다"
  - id: independent
    content:
      - type: text
        text: "선형 독립이다"
  - id: duplicate
    content:
      - type: text
        text: "반드시 모든 좌표축과 평행하다"
  - id: infinite
    content:
      - type: text
        text: "반드시 무한히 많은 벡터를 포함한다"
correctOptionIds: [span, independent]
shuffleOptions: true
explanation:
  - type: text
    text: "기저는 공간을 빠짐없이 생성하면서 불필요한 중복이 없는 최소 생성 집합입니다."
  - type: text
    text: "기저의 모양은 달라질 수 있고 유한 차원 공간에서는 벡터 수가 유한합니다."
tags:
  - linear-algebra
  - space
  - linear-independence
difficulty: 2
