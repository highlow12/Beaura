schemaVersion: 1
id: algo.bellman-ford.steps-01
revision: 2
type: ordering
prompt:
- type: text
  text: Bellman-Ford의 기본 실행 순서를 배열하세요.
items:
- id: initialize
  content:
  - type: text
    text: 시작점 거리는 0, 나머지는 무한대로 초기화한다
- id: repeat
  content:
  - type: text
    text: V - 1번 pass를 반복한다
- id: relax
  content:
  - type: text
    text: 각 pass에서 모든 간선을 완화한다
- id: detect
  content:
  - type: text
    text: 추가 pass에서 도달 가능한 간선이 갱신되면 음수 사이클을 표시한다
correctOrder:
- initialize
- repeat
- relax
- detect
explanation:
- type: text
  text: 초기화 후 모든 간선을 충분히 반복하고, 마지막 추가 검사로 시작점에서 도달 가능한 음수 사이클 여부를 확인합니다.
tags:
- shortest-path
- bellman-ford
- execution-order
difficulty: 2
