schemaVersion: 1
id: toc.decidability.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: 결정 가능성 관련 용어와 설명을 연결하세요.
leftItems:
  - id: decider
    content:
      - type: text
        text: 결정자
  - id: recognizer
    content:
      - type: text
        text: 인식자
  - id: complement
    content:
      - type: text
        text: 여집합 언어
rightItems:
  - id: halt-all
    content:
      - type: text
        text: 모든 입력에서 accept 또는 reject로 멈춘다
  - id: may-loop
    content:
      - type: text
        text: 비소속 입력에서 계속 실행할 수 있다
  - id: not-members
    content:
      - type: text
        text: 원래 언어에 속하지 않는 문자열들의 집합
correctPairs:
  - leftId: decider
    rightId: halt-all
  - leftId: recognizer
    rightId: may-loop
  - leftId: complement
    rightId: not-members
explanation:
  - type: text
    text: 결정자는 인식자와 달리 거부하는 입력에서도 멈추며, 언어와 여집합을 함께 다루면 종료 보장을 구성할 수 있습니다.
tags:
  - theory-of-computation
  - decidability
  - recognizer
difficulty: 2
