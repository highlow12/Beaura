schemaVersion: 1
id: toc.decidability.order-01
revision: 2
type: ordering
prompt:
  - type: text
    text: 최대 B단계 안에 정지하는지 판정하는 시뮬레이터를 설계하는 순서를 배열하세요.
items:
  - id: set-bound
    content:
      - type: text
        text: 최대 실행 단계 B를 입력받도록 정한다.
  - id: simulate
    content:
      - type: text
        text: 최대 B단계까지 프로그램을 시뮬레이션하도록 정한다.
  - id: detect-halt
    content:
      - type: text
        text: B단계 안에 멈추면 ‘정지’라고 답하도록 정한다.
  - id: timeout
    content:
      - type: text
        text: B단계까지 안 멈추면 ‘B단계 안에 정지하지 않음’이라고 답하도록 정한다.
correctOrder:
  - set-bound
  - simulate
  - detect-halt
  - timeout
explanation:
  - type: text
    text: 이는 시뮬레이터의 규칙을 구성하는 순서입니다. 실제 실행에서는 ‘중간 정지’와 ‘제한 초과’가 서로 다른 분기이고, 제한을 넘긴 경우에도 나중에 영원히 멈추지 않는다고 결론 내릴 수는 없습니다.
tags:
  - theory-of-computation
  - decidability
  - simulation
difficulty: 3
