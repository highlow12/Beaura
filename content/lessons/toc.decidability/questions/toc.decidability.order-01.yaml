schemaVersion: 1
id: toc.decidability.order-01
revision: 3
type: ordering
prompt:
  - type: text
    text: 최대 B단계 안에 정지하는지 판정하는 시뮬레이터를 설계하는 순서를 배열하세요.
items:
  - id: set-bound
    content:
      - type: text
        text: 최대 실행 단계 B를 입력받도록 정한다.
  - id: simulate
    content:
      - type: text
        text: 최대 B단계까지 실행하되, B단계 이내에 정지하면 시뮬레이션을 끝낸다.
  - id: report
    content:
      - type: text
        text: B단계 이내에 정지했으면 ‘B단계 안에 정지’, 아니면 ‘B단계 안에는 정지하지 않음’이라고 답한다.
correctOrder:
  - set-bound
  - simulate
  - report
explanation:
  - type: text
    text: B단계 안에 멈추는지 여부는 판정할 수 있습니다. 제한 안에 멈추지 않았다는 결과만으로 프로그램이 이후에도 영원히 멈추지 않는다고 결론 내릴 수는 없습니다.
tags:
  - theory-of-computation
  - decidability
  - simulation
difficulty: 3
