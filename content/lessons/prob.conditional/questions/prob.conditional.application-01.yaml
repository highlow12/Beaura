schemaVersion: 1
id: prob.conditional.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "조건부 확률에 대한 옳은 설명을 모두 고르세요."
options:
  - id: formula
    content:
      - type: text
        text: "P(A|B)=P(A∩B)/P(B)"
  - id: positive
    content:
      - type: text
        text: "P(B)>0이어야 한다"
  - id: restrict
    content:
      - type: text
        text: "B가 새로운 기준 공간이 된다"
  - id: symmetry
    content:
      - type: text
        text: "항상 P(A|B)=P(B|A)이다"
correctOptionIds: [formula, positive, restrict]
shuffleOptions: true
explanation:
  - type: text
    text: "조건부 확률은 B 영역 안에서 A∩B의 비율을 계산합니다."
  - type: text
    text: "조건을 바꾸면 분모와 교집합의 해석이 달라집니다."
tags:
  - probability-statistics
  - conditional
  - formula
difficulty: 2
