schemaVersion: 1
id: pl.functions-closures.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "`make_adder(2)`로 클로저를 만들고 호출하는 흐름을 배열하세요."
items:
  - id: define-outer
    content:
      - type: text
        text: 바깥 함수가 n을 매개변수로 받는다.
  - id: define-inner
    content:
      - type: text
        text: 안쪽 함수가 n을 참조하도록 정의된다.
  - id: return-closure
    content:
      - type: text
        text: 안쪽 함수와 n 환경이 함께 반환된다.
  - id: call
    content:
      - type: text
        text: 반환된 함수를 3으로 호출해 n+3을 계산한다.
correctOrder:
  - define-outer
  - define-inner
  - return-closure
  - call
explanation:
  - type: text
    text: 바깥 호출이 끝난 뒤에도 반환된 함수가 n을 찾아야 하므로 코드와 캡처 환경을 함께 보존합니다.
tags:
  - programming-languages
  - closure
  - execution
difficulty: 2
