id: algo.heap-sort.trace-01
type: code-output
prompt:
- type: text
  text: 다음 힙 정렬 코드의 출력 결과를 고르세요.
language: python
code: 'import heapq

  values = [3, 1, 2]

  heapq.heapify(values)

  ordered = [heapq.heappop(values) for _ in range(len(values))]

  print(ordered)'
choices:
- '[1, 2, 3]'
- '[3, 2, 1]'
- '[1, 3, 2]'
acceptedOutputs:
- '[1, 2, 3]'
explanation:
- type: text
  text: min-heap에서 최솟값부터 세 번 꺼내므로 ordered는 오름차순 [1, 2, 3]입니다.
