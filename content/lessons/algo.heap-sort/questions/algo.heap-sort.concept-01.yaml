id: algo.heap-sort.concept-01
type: single-choice
prompt:
- type: text
  text: 힙 정렬이 정렬 결과를 만드는 방법은 무엇인가요?
options:
- id: pop
  content:
  - type: text
    text: 힙을 만든 뒤 루트 원소를 반복해서 꺼내 결과에 기록한다
- id: swap-neighbor
  content:
  - type: text
    text: 이웃 원소만 비교해 한 번 교환한다
- id: pivot
  content:
  - type: text
    text: pivot 하나만 고정하고 재귀하지 않는다
- id: scan
  content:
  - type: text
    text: 배열을 한 번 읽고 순서를 그대로 둔다
correctOptionId: pop
shuffleOptions: true
explanation:
- type: text
  text: 힙 정렬은 힙의 루트가 최우선이라는 성질을 이용해 반복 pop으로 정렬 순서를 얻습니다.
schemaVersion: 1
revision: 1
tags:
- sorting
- heap-sort
- heap
difficulty: 2
