id: py.slicing.steps-01
type: ordering
prompt:
- type: text
  text: 슬라이싱으로 범위를 선택하는 순서를 배열하세요.
items:
- id: start
  content:
  - type: text
    text: 시작 인덱스를 정한다
- id: stop
  content:
  - type: text
    text: 포함하지 않을 끝 경계를 정한다
- id: step
  content:
  - type: text
    text: 필요하면 이동 간격을 정한다
- id: copy
  content:
  - type: text
    text: 조건에 맞는 원소를 새 시퀀스로 만든다
correctOrder:
- start
- stop
- step
- copy
explanation:
- type: text
  text: 시작과 끝 경계, 선택적 간격을 정한 뒤 반열린 범위에 해당하는 원소가 새 결과로 모입니다.
schemaVersion: 1
revision: 1
tags:
