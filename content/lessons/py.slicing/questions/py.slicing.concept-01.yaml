id: py.slicing.concept-01
type: single-choice
prompt:
- type: text
  text: values[1:4]에서 끝 인덱스 4의 역할은 무엇인가요?
options:
- id: exclusive
  content:
  - type: text
    text: 4번 위치는 제외하고 1, 2, 3번 위치만 선택하는 경계
- id: inclusive
  content:
  - type: text
    text: 4번 위치까지 반드시 포함하는 경계
- id: step
  content:
  - type: text
    text: 원소를 한 칸씩 건너뛰게 하는 간격
- id: reverse
  content:
  - type: text
    text: 시퀀스를 거꾸로 읽게 하는 표시
correctOptionId: exclusive
shuffleOptions: true
explanation:
- type: text
  text: 슬라이싱은 시작은 포함하고 stop은 제외합니다. 따라서 [1:4]는 인덱스 1, 2, 3을 선택합니다.
schemaVersion: 1
revision: 1
tags:
- collections
- slicing
difficulty: 2
