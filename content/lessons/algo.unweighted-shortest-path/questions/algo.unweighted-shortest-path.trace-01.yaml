schemaVersion: 1
id: algo.unweighted-shortest-path.trace-01
revision: 1
type: code-output
prompt:
- type: text
  text: A에서 D까지 BFS가 기록하는 최단 거리 값을 고르세요.
language: python
code: |-
  graph = {"A": ["B", "C"], "B": ["D"], "C": ["D"], "D": []}
  distance = {"A": 0}
  queue = ["A"]
  while queue:
      current = queue.pop(0)
      for nxt in graph[current]:
          if nxt not in distance:
              distance[nxt] = distance[current] + 1
              queue.append(nxt)
  print(distance["D"])
choices:
- '2'
- '1'
- '3'
acceptedOutputs:
- '2'
explanation:
- type: text
  text: A에서 B 또는 C까지 한 간선, 거기서 D까지 한 간선을 지나므로 D의 거리는 2입니다.
