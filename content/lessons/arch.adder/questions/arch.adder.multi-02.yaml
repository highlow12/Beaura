schemaVersion: 1
id: arch.adder.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "가산기와 ALU의 덧셈에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "여러 전가산기를 연결하면 한 번에 여러 비트의 덧셈을 수행할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "ripple-carry 가산기의 지연은 carry가 전달되는 비트 수와 관련 있다."
  - id: wrong-a
    content:
      - type: text
        text: "전가산기의 출력은 sum 하나뿐이고 carry는 버린다."
  - id: wrong-b
    content:
      - type: text
        text: "가산기의 carry-in은 최상위 비트에서만 사용된다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "여러 전가산기를 연결하면 한 번에 여러 비트의 덧셈을 수행할 수 있다. ripple-carry 가산기의 지연은 carry가 전달되는 비트 수와 관련 있다."
  - type: text
    text: "단순 ripple-carry 가산기는 회로가 작지만 carry가 모든 자리를 지나야 해 느립니다. 빠른 가산기는 더 많은 회로로 carry를 미리 계산해 지연을 줄입니다."
tags: [adder, carry, alu]
difficulty: 3
