schemaVersion: 1
id: arch.adder.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "가산기와 ALU의 덧셈의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: low-bit
    content:
      - type: text
        text: "최하위 비트에서 입력 두 개와 carry-in을 계산한다"
  - id: propagate
    content:
      - type: text
        text: "carry-out을 다음 자리의 carry-in으로 전달한다"
  - id: collect
    content:
      - type: text
        text: "각 자리의 sum을 이어 최종 결과를 만든다"
correctOrder: [low-bit, propagate, collect]
explanation:
  - type: text
    text: "최하위 비트에서 입력 두 개와 carry-in을 계산한다 단계가 먼저이고, 그 결과를 이용해 carry-out을 다음 자리의 carry-in으로 전달한다 단계가 이어집니다."
  - type: text
    text: "각 자리의 sum을 이어 최종 결과를 만든다 단계에서 최종 결과가 다음 회로 또는 프로그램으로 전달됩니다."
tags: [adder, carry, alu]
difficulty: 3
