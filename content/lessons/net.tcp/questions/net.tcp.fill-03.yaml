type: fill-blank
prompt:
  - type: text
    text: "TCP 연결과 신뢰성에서 핵심이 되는 용어는 ___입니다."
choices:
  - "3-way handshake"
  - "DNS 재귀"
  - "캐시 미스"
acceptedAnswers:
  - "3-way handshake"
explanation:
  - type: text
    text: "3-way handshake은(는) 이 레슨에서 다룬 핵심 개념입니다."
  - type: text
    text: "TCP는 연결 상태를 유지하는 바이트 스트림 프로토콜입니다. 시퀀스 번호, 확인 응답, 재전송, 흐름·혼잡 제어로 수신자가 순서 있는 데이터를 받도록 돕습니다."
tags: [tcp, reliability, handshake]
