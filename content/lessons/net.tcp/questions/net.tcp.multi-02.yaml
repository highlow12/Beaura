schemaVersion: 1
id: net.tcp.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "TCP 연결과 신뢰성에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "3-way handshake는 양쪽의 연결 준비와 초기 시퀀스를 맞춘다."
  - id: correct-b
    content:
      - type: text
        text: "TCP는 흐름 제어와 혼잡 제어로 송신 속도를 조절할 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "TCP에서 세그먼트 손실은 응용 프로그램이 반드시 직접 바이트 순서를 복구해야 한다는 뜻이다."
  - id: wrong-b
    content:
      - type: text
        text: "TCP 연결은 양쪽 상태를 전혀 저장하지 않는다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "3-way handshake는 양쪽의 연결 준비와 초기 시퀀스를 맞춘다. TCP는 흐름 제어와 혼잡 제어로 송신 속도를 조절할 수 있다."
  - type: text
    text: "TCP는 신뢰성과 혼잡 제어를 제공하지만 연결 상태·핸드셰이크·재전송으로 지연과 메모리 비용이 생깁니다. 실시간 앱은 지연을 줄이기 위해 일부 손실을 감수할 수 있습니다."
tags: [tcp, reliability, handshake]
difficulty: 3
