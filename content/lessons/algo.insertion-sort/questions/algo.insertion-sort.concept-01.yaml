id: algo.insertion-sort.concept-01
type: single-choice
prompt:
- type: text
  text: 삽입 정렬이 반복마다 유지하는 구간은 무엇인가요?
options:
- id: prefix
  content:
  - type: text
    text: 현재 위치 앞의 원소들이 정렬되어 있다는 구간
- id: suffix
  content:
  - type: text
    text: 현재 위치 뒤만 항상 정렬된다는 구간
- id: heap
  content:
  - type: text
    text: 전체 배열이 힙이라는 구간
- id: random
  content:
  - type: text
    text: 방문하지 않은 값의 무작위 구간
correctOptionId: prefix
shuffleOptions: true
explanation:
- type: text
  text: 삽입 정렬은 왼쪽의 sorted prefix에 다음 key를 알맞게 끼워 넣어 정렬된 구간을 한 칸씩 늘립니다.
schemaVersion: 1
revision: 1
tags:
- sorting
- insertion-sort
difficulty: 2
