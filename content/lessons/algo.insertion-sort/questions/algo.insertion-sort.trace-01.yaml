id: algo.insertion-sort.trace-01
type: code-output
prompt:
- type: text
  text: 다음 삽입 정렬 코드의 출력 결과를 고르세요.
language: python
code: "values = [3, 1, 2]\nfor i in range(1, len(values)):\n    key = values[i]\n    j = i - 1\n    while j >= 0 and values[j] > key:\n        values[j + 1] = values[j]\n        j -= 1\n    values[j + 1] = key\nprint(values)"
choices:
- '[1, 2, 3]'
- '[3, 1, 2]'
- '[2, 1, 3]'
acceptedOutputs:
- '[1, 2, 3]'
explanation:
- type: text
  text: 1을 앞에 삽입한 뒤 2를 1과 3 사이에 삽입하므로 최종 배열은 [1, 2, 3]입니다.
schemaVersion: 1
revision: 1
tags:
- sorting
- insertion-sort
difficulty: 2
