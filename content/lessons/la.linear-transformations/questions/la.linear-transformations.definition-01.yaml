schemaVersion: 1
id: la.linear-transformations.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "선형 변환 T가 반드시 만족해야 하는 식은 무엇인가요?"
options:
  - id: add-scale
    content:
      - type: text
        text: "T(u+v)=T(u)+T(v)와 T(cu)=cT(u)"
  - id: shift
    content:
      - type: text
        text: "T(u+v)=T(u)+v"
  - id: square
    content:
      - type: text
        text: "T(u)=u²"
  - id: constant
    content:
      - type: text
        text: "모든 입력을 같은 점으로 보낸다"
correctOptionId: add-scale
shuffleOptions: true
explanation:
  - type: text
    text: "선형 변환은 벡터 덧셈과 스칼라배를 보존합니다."
  - type: text
    text: "이 성질 때문에 기저에서의 값으로 전체 변환을 결정할 수 있습니다."
tags:
  - linear-algebra
  - transformations
  - linearity
difficulty: 1
