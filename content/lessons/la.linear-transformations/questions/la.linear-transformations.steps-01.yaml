schemaVersion: 1
id: la.linear-transformations.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "기저 이미지로 2차원 변환 행렬을 만드는 순서를 배열하세요."
items:
  - id: basis
    content:
      - type: text
        text: "표준 기저 e₁,e₂를 확인한다"
  - id: images
    content:
      - type: text
        text: "T(e₁), T(e₂)를 계산한다"
  - id: columns
    content:
      - type: text
        text: "두 이미지를 행렬의 열로 놓는다"
  - id: apply
    content:
      - type: text
        text: "행렬을 임의의 벡터에 곱한다"
correctOrder:
  - basis
  - images
  - columns
  - apply
explanation:
  - type: text
    text: "선형 변환 행렬의 열은 기저 벡터가 이동한 결과입니다."
  - type: text
    text: "이후 행렬·벡터 곱으로 모든 입력의 변환을 계산할 수 있습니다."
tags:
  - linear-algebra
  - transformations
  - matrix-representation
difficulty: 2
