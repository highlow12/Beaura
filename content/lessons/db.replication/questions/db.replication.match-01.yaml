  - id: writes
    content:
      - type: text
        text: 기본 쓰기를 받고 변경의 기준이 되는 노드
  - id: copy
    content:
      - type: text
        text: primary의 변경을 따라가는 복제 노드
  - id: promote
    content:
      - type: text
