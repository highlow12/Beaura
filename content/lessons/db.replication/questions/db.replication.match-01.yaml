type: matching
prompt:
  - type: text
    text: 복제 용어와 역할을 연결하세요.
leftItems:
  - id: primary
    content:
      - type: text
        text: primary
  - id: replica
    content:
      - type: text
        text: replica
  - id: failover
    content:
      - type: text
        text: failover
