schemaVersion: 1
id: la.cross-product.definition-01
revision: 2
type: single-choice
prompt:
  - type: text
    text: "u×v가 영벡터가 아닐 때 반드시 만족하는 관계는 무엇인가요?"
options:
  - id: perpendicular-both
    content:
      - type: text
        text: "u와 v 모두에 수직이다"
  - id: parallel-u
    content:
      - type: text
        text: "항상 u와 평행하다"
  - id: same
    content:
      - type: text
        text: "항상 u와 같다"
  - id: scalar
    content:
      - type: text
        text: "항상 스칼라이다"
correctOptionId: perpendicular-both
shuffleOptions: true
explanation:
  - type: text
    text: "0이 아닌 외적 결과는 두 입력 벡터가 만드는 평면에 수직인 법선 방향을 가집니다."
  - type: text
    text: "두 입력이 평행하면 외적은 영벡터가 되어 법선 방향이 정해지지 않습니다."
tags:
  - linear-algebra
  - cross-product
  - normal
difficulty: 1
