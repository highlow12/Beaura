schemaVersion: 1
id: la.cross-product.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "외적의 성질로 옳은 것을 모두 고르세요."
options:
  - id: anti
    content:
      - type: text
        text: "u×v=−(v×u)"
  - id: parallel-zero
    content:
      - type: text
        text: "두 벡터가 평행하면 외적은 영벡터다"
  - id: area
    content:
      - type: text
        text: "크기는 평행사변형 넓이와 같다"
  - id: commute
    content:
      - type: text
        text: "순서를 바꿔도 결과가 같다"
correctOptionIds: [anti, parallel-zero, area]
shuffleOptions: true
explanation:
  - type: text
    text: "외적은 반교환적이고, 평행한 벡터의 사잇각이 0 또는 π라 크기가 0입니다."
  - type: text
    text: "순서를 바꾸면 법선 방향이 뒤집힙니다."
tags:
  - linear-algebra
  - cross-product
  - properties
