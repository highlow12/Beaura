schemaVersion: 1
id: toc.complexity.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: NP에 속하는 결정 문제의 핵심 조건은 무엇인가요?
options:
  - id: verify-poly
    content:
      - type: text
        text: 정답 후보가 주어졌을 때 다항 시간에 맞는지 검증할 수 있다.
  - id: solve-constant
    content:
      - type: text
        text: 정답을 항상 상수 시간에 직접 찾을 수 있다.
  - id: no-certificate
    content:
      - type: text
        text: 정답 후보나 검증 절차가 필요 없다.
  - id: only-random
    content:
      - type: text
        text: 무작위 알고리즘으로만 풀 수 있다.
correctOptionId: verify-poly
shuffleOptions: true
explanation:
  - type: text
    text: NP의 정의는 후보 해를 빠르게 검증하는 절차에 관한 것입니다. 후보를 빠르게 찾는다는 뜻은 아닙니다.
