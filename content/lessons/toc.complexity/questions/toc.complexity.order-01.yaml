schemaVersion: 1
id: toc.complexity.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: NP 문제에 제시된 후보 해를 검증하는 일반 흐름을 배열하세요.
items:
  - id: receive
    content:
      - type: text
        text: 입력과 정답 후보를 받는다.
  - id: check-format
    content:
      - type: text
        text: 후보가 형식과 크기 제한을 지키는지 확인한다.
  - id: verify-constraints
    content:
      - type: text
        text: 문제의 조건을 계산해 후보를 검증한다.
  - id: answer
    content:
      - type: text
        text: 조건을 모두 만족하면 yes, 아니면 no를 반환한다.
correctOrder:
  - receive
  - check-format
  - verify-constraints
  - answer
explanation:
  - type: text
    text: 검증기는 후보를 새로 찾지 않고, 입력된 후보가 유효한지 정해진 다항 시간 안에 확인합니다.
tags:
  - theory-of-computation
  - complexity
  - verifier
difficulty: 2
