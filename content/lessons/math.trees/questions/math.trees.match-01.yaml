schemaVersion: 1
id: math.trees.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "트리 용어와 설명을 알맞게 연결하세요."
leftItems:
  - id: root
    content:
      - type: text
        text: "root"
  - id: parent
    content:
      - type: text
        text: "parent"
  - id: child
    content:
      - type: text
        text: "child"
  - id: leaf
    content:
      - type: text
        text: "leaf"
rightItems:
  - id: root-desc
    content:
      - type: text
        text: "부모가 없는 기준 정점"
  - id: parent-desc
    content:
      - type: text
        text: "간선으로 아래 정점을 직접 이끄는 정점"
  - id: child-desc
    content:
      - type: text
        text: "부모 아래에 직접 연결된 정점"
