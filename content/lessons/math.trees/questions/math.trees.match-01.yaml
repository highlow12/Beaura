    rightId: parent-desc
  - leftId: child
    rightId: child-desc
  - leftId: leaf
    rightId: leaf-desc
explanation:
  - type: text
    text: "rooted tree는 방향을 임의로 정해 위·아래 계층을 말할 수 있게 만든 트리입니다."
  - type: text
    text: "같은 무방향 트리도 root 선택이 달라지면 부모와 자식 관계가 달라집니다."
