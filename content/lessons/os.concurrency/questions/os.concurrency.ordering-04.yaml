schemaVersion: 1
id: os.concurrency.ordering-04
revision: 2
type: ordering
prompt:
  - type: text
    text: "공유 상태의 갱신 손실을 막는 기본 흐름을 배열하세요."
items:
  - id: share
    content:
      - type: text
        text: "여러 흐름이 같은 상태를 읽고 갱신한다"
  - id: interleave
    content:
      - type: text
        text: "갱신 단계가 끼어들면 한 흐름의 변경이 다른 흐름에 덮일 수 있다"
  - id: atomic-update
    content:
      - type: text
        text: "원자 연산이나 잠금으로 갱신을 한 단위로 보호한다"
correctOrder: [share, interleave, atomic-update]
explanation:
  - type: text
    text: "여러 흐름이 같은 상태를 다룰 때 연산이 끼어들면 변경을 덮어쓸 수 있습니다. 원자 연산이나 잠금은 읽기·수정·쓰기를 한 단위로 보호합니다."
tags: [concurrency, parallelism, atomicity]
difficulty: 4
