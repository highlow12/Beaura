schemaVersion: 1
id: os.concurrency.lost-update-06
revision: 1
type: single-choice
prompt:
  - type: text
    text: 공유 변수 x가 0입니다. 두 작업 A와 B가 각각 x를 읽어 0을 얻은 뒤, 둘 다 읽은 값에 1을 더해 x에 기록했습니다. 마지막 x가 1이 될 수 있는 이유는 무엇인가요?
options:
  - id: lost-update
    content:
      - type: text
        text: 읽기와 쓰기가 원자적인 하나의 증가 연산으로 보호되지 않아 한 업데이트가 덮어써질 수 있기 때문
  - id: binary-limit
    content:
      - type: text
        text: 이진수에서는 2를 표현할 수 없기 때문
  - id: cache-always
    content:
      - type: text
        text: 캐시는 항상 같은 값을 한 번만 저장하기 때문
correctOptionId: lost-update
shuffleOptions: true
explanation:
  - type: text
    text: 두 작업이 모두 이전 값 0을 읽은 뒤 1을 쓰면 한 작업의 증가가 다른 작업의 쓰기에 덮여 최종 값이 1이 되는 lost update가 발생할 수 있습니다.
tags:
  - concurrency
  - atomicity
  - race-condition
difficulty: 2
