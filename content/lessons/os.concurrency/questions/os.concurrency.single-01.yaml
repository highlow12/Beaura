schemaVersion: 1
id: os.concurrency.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "동시성과 원자성에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "동시성은 작업의 겹침 가능성이고 병렬성은 여러 실행 자원이 실제로 동시에 수행하는 것이다."
  - id: wrong-a
    content:
      - type: text
        text: "동시성과 병렬성은 항상 같은 말이며 단일 코어에서는 동시성이 불가능하다."
  - id: wrong-b
    content:
      - type: text
        text: "원자적 연산은 중간 결과가 다른 스레드에 더 자주 보이게 한다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "동시성은 작업의 겹침 가능성이고 병렬성은 여러 실행 자원이 실제로 동시에 수행하는 것이다."
  - type: text
    text: "동시성은 여러 작업이 서로 겹쳐 진행될 수 있는 구조이고, 병렬성은 여러 실행 자원이 실제 같은 시각에 작업하는 경우입니다. 원자적 연산은 중간 상태가 다른 흐름에 보이지 않게 한 단위로 완료됩니다."
tags: [concurrency, parallelism, atomicity]
difficulty: 3
