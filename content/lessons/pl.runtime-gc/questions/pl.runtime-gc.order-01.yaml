schemaVersion: 1
id: pl.runtime-gc.order-01
revision: 2
type: ordering
prompt:
  - type: text
    text: mark-sweep 수집의 기본 순서를 배열하세요.
items:
  - id: mark-roots
    content:
      - type: text
        text: 스택·전역 등 GC 루트를 찾아 표시하고 작업 목록에 넣는다.
  - id: traverse-and-mark
    content:
      - type: text
        text: 작업 목록이 빌 때까지 객체를 꺼내 참조를 살피고, 아직 표시되지 않은 객체는 표시해 목록에 넣는다.
  - id: sweep
    content:
      - type: text
        text: 표시되지 않은 힙 객체를 회수한다.
correctOrder:
  - mark-roots
  - traverse-and-mark
  - sweep
explanation:
  - type: text
    text: 루트를 먼저 표시하고, 참조를 따라가며 각 객체를 방문 전에 표시해 순환 참조도 한 번만 처리합니다. 표시 단계를 끝낸 뒤에 표시되지 않은 객체를 회수합니다.
tags:
  - programming-languages
  - garbage-collection
  - mark-sweep
difficulty: 2
