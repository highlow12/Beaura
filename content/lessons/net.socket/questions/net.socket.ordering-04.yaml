schemaVersion: 1
id: net.socket.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "소켓과 클라이언트·서버의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: listen
    content:
      - type: text
        text: "서버가 주소와 포트에서 연결을 기다린다"
  - id: accept
    content:
      - type: text
        text: "도착한 연결마다 통신 소켓을 만든다"
  - id: exchange
    content:
      - type: text
        text: "연결 소켓으로 데이터를 읽고 쓴다"
correctOrder: [listen, accept, exchange]
explanation:
  - type: text
    text: "서버가 주소와 포트에서 연결을 기다린다 단계가 먼저이고, 그 결과를 이용해 도착한 연결마다 통신 소켓을 만든다 단계가 이어집니다."
  - type: text
    text: "연결 소켓으로 데이터를 읽고 쓴다 단계에서 결과가 다음 네트워크 계층이나 응용으로 전달됩니다."
tags: [socket, client-server, api]
difficulty: 3
