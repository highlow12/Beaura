schemaVersion: 1
id: net.socket.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "서버가 새 TCP 연결에 대응하는 소켓을 얻는 호출은 ___입니다."
choices:
  - "accept"
  - "bind"
  - "listen"
acceptedAnswers:
  - "accept"
explanation:
  - type: text
    text: "서버는 주소와 포트에 bind하고 listen으로 연결을 기다립니다. 클라이언트의 connect 요청이 오면 accept가 별도의 연결 소켓을 돌려주므로, 리스닝 소켓은 다른 연결 요청을 계속 받을 수 있습니다. 연결 소켓으로 데이터를 읽고 쓰며 read는 요청한 바이트 수보다 적게 반환할 수도 있습니다."
tags: [socket, client-server, api]
difficulty: 2
