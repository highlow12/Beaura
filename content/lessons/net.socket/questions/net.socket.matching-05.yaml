schemaVersion: 1
id: net.socket.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "소켓과 클라이언트·서버의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "bind"
  - id: left-b
    content:
      - type: text
        text: "listen"
  - id: left-c
    content:
      - type: text
        text: "accept"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "소켓을 로컬 주소·포트에 연결하는 단계"
  - id: right-b
    content:
      - type: text
        text: "서버가 연결 요청을 대기하게 하는 단계"
  - id: right-c
    content:
      - type: text
        text: "대기 큐에서 연결을 꺼내는 단계"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "bind은 소켓을 로컬 주소·포트에 연결하는 단계, listen은 서버가 연결 요청을 대기하게 하는 단계입니다."
  - type: text
    text: "accept은 대기 큐에서 연결을 꺼내는 단계을 뜻하므로 세 역할을 구분해야 합니다."
tags: [socket, client-server, api]
difficulty: 2
