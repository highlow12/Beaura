schemaVersion: 1
id: os.context-switch.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "컨텍스트 스위치에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "컨텍스트 스위치는 현재 실행 상태를 저장하고 다른 실행 상태를 복원하는 전환이다."
  - id: wrong-a
    content:
      - type: text
        text: "컨텍스트 스위치는 디스크 파일을 다른 폴더로 옮기는 작업이다."
  - id: wrong-b
    content:
      - type: text
        text: "컨텍스트 스위치가 일어나면 이전 프로세스의 레지스터는 영구히 삭제된다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "컨텍스트 스위치는 현재 실행 상태를 저장하고 다른 실행 상태를 복원하는 전환이다."
  - type: text
    text: "컨텍스트 스위치는 현재 실행 단위의 레지스터·프로그램 카운터·스택 포인터 등을 저장하고 다음 단위의 상태를 복원하는 전환입니다."
tags: [context-switch, scheduler, process]
difficulty: 2
