schemaVersion: 1
id: os.context-switch.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "컨텍스트 스위치에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "프로그램 카운터와 스택 포인터는 복원해야 중단된 코드를 이어 실행할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "타이머 인터럽트는 선점형 컨텍스트 스위치를 촉발할 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "컨텍스트 스위치는 상태를 저장하지 않고 새 프로그램을 처음부터 시작한다."
  - id: wrong-b
    content:
      - type: text
        text: "컨텍스트 스위치 비용은 캐시와 메모리 계층에 아무 영향도 주지 않는다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "프로그램 카운터와 스택 포인터는 복원해야 중단된 코드를 이어 실행할 수 있다. 타이머 인터럽트는 선점형 컨텍스트 스위치를 촉발할 수 있다."
  - type: text
    text: "스위치는 공정한 공유와 반응성을 주지만 저장·복원과 캐시 손실에 비용이 듭니다. 너무 자주 전환하면 실제 작업보다 관리 오버헤드가 커질 수 있습니다."
tags: [context-switch, scheduler, process]
difficulty: 3
