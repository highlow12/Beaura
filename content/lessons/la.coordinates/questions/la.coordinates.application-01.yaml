schemaVersion: 1
id: la.coordinates.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "기저 변환에 대한 옳은 설명을 모두 고르세요."
options:
  - id: same-vector
    content:
      - type: text
        text: "같은 벡터를 다른 기저 좌표로 표현할 수 있다"
  - id: basis-depend
    content:
      - type: text
        text: "좌표 값은 선택한 기저에 의존한다"
  - id: geometry
    content:
      - type: text
        text: "벡터의 기하적 대상과 좌표 목록은 구분된다"
  - id: always-same
    content:
      - type: text
        text: "기저가 바뀌어도 좌표 숫자는 항상 같다"
correctOptionIds: [same-vector, basis-depend, geometry]
shuffleOptions: true
explanation:
  - type: text
    text: "좌표는 표현 방식이고 기저가 바뀌면 계수가 달라질 수 있습니다."
  - type: text
    text: "벡터 자체와 그 벡터를 적은 좌표를 분리해 생각해야 합니다."
tags:
  - linear-algebra
  - coordinates
  - basis-change
difficulty: 2
