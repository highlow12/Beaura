schemaVersion: 1
id: math.counting.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "합의 법칙으로 직접 더할 수 있는 상황을 모두 고르세요."
options:
  - id: bus-train
    content:
      - type: text
        text: "버스 4개 노선 또는 지하철 2개 노선 중 하나를 선택한다"
  - id: tea-coffee
    content:
      - type: text
        text: "차 3종 또는 커피 5종 중 하나만 주문한다"
  - id: shirt-pants
    content:
      - type: text
        text: "셔츠와 바지를 하나씩 고른다"
  - id: digits
    content:
      - type: text
        text: "두 자리 비밀번호의 각 숫자를 고른다"
correctOptionIds: [bus-train, tea-coffee]
shuffleOptions: true
explanation:
  - type: text
    text: "‘또는’으로 나뉘며 동시에 선택하지 않는 배타적 경우는 합의 법칙으로 더합니다."
  - type: text
    text: "여러 단계를 모두 수행하는 선택은 곱의 법칙에 해당합니다."
tags:
  - discrete-math
  - combinatorics
  - sum-rule
difficulty: 2
