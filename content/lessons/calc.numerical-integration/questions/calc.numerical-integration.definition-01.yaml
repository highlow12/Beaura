schemaVersion: 1
id: calc.numerical-integration.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "사다리꼴 하나의 넓이를 근사하는 공식은 무엇인가요?"
options:
  - id: trapezoid
    content:
      - type: text
        text: "폭×(왼쪽 높이+오른쪽 높이)/2"
  - id: left-only
    content:
      - type: text
        text: "폭×왼쪽 높이"
  - id: product
    content:
      - type: text
        text: "왼쪽 높이×오른쪽 높이"
  - id: sum-only
    content:
      - type: text
        text: "왼쪽 높이+오른쪽 높이"
correctOptionId: trapezoid
shuffleOptions: true
explanation:
  - type: text
    text: "사다리꼴은 평행한 두 변인 양 끝 높이의 평균에 폭을 곱합니다."
  - type: text
    text: "직사각형 합은 한쪽 높이만 사용한다는 차이가 있습니다."
tags:
  - calculus
  - numerical
  - trapezoid-rule
difficulty: 1
