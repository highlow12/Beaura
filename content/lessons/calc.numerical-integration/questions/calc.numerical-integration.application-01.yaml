schemaVersion: 1
id: calc.numerical-integration.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "수치 적분에 대한 옳은 설명을 모두 고르세요."
options:
  - id: samples
    content:
      - type: text
        text: "표본 함숫값만으로도 누적량을 근사할 수 있다"
  - id: smaller
    content:
      - type: text
        text: "구간을 잘게 나누면 보통 근사 오차가 줄어든다"
  - id: increasing
    content:
      - type: text
        text: "증가 함수에서는 왼쪽 직사각형 합이 실제 넓이보다 작다"
  - id: exact-always
    content:
      - type: text
        text: "몇 개의 직사각형 합은 항상 정확하다"
correctOptionIds: [samples, smaller, increasing]
shuffleOptions: true
explanation:
  - type: text
    text: "표본 간격을 줄이면 곡선을 도형으로 근사하는 오차가 대체로 감소합니다."
  - type: text
    text: "직선 등 특별한 경우를 제외하면 유한한 도형 합은 근사값입니다."
tags:
  - calculus
  - numerical
  - approximation
difficulty: 2
