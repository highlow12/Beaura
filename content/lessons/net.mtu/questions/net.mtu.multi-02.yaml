schemaVersion: 1
id: net.mtu.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "MTU와 단편화에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "경로의 작은 MTU는 송신자가 사용할 패킷 크기를 제한할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "단편화된 조각 중 하나가 손실되면 원래 데이터그램 재조립이 실패할 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "큰 패킷일수록 헤더 비율이 커져 전송 효율이 항상 낮아진다."
  - id: wrong-b
    content:
      - type: text
        text: "TCP MSS는 링크 MTU와 아무 관계가 없는 임의의 포트 번호다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "경로의 작은 MTU는 송신자가 사용할 패킷 크기를 제한할 수 있다. 단편화된 조각 중 하나가 손실되면 원래 데이터그램 재조립이 실패할 수 있다."
  - type: text
    text: "큰 패킷은 헤더 비율과 처리 횟수를 줄이지만 단편화·손실 비용이 커집니다. 작은 패킷은 유연하지만 헤더와 인터럽트 부담이 증가합니다."
tags: [mtu, fragmentation, ip]
difficulty: 4
