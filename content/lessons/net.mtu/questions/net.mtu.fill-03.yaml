schemaVersion: 1
id: net.mtu.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "MTU 1500바이트와 IPv4 헤더 20바이트라면 단편화 없이 실을 IP 데이터의 최대 크기는 ___바이트입니다."
choices:
  - "1480"
  - "1500"
  - "1520"
acceptedAnswers:
  - "1480"
explanation:
  - type: text
    text: "이더넷 링크의 MTU가 1500바이트라면 일반적인 IPv4 패킷은 IP 헤더와 데이터의 합이 그 크기를 넘지 않아야 한 프레임에 실립니다. 예를 들어 IP 헤더가 20바이트면 남는 IP 데이터는 최대 1480바이트입니다. IPv4 패킷이 더 크면 조건에 따라 단편화하거나 DF가 설정된 경우 오류를 알릴 수 있습니다."
tags: [mtu, fragmentation, ip]
difficulty: 3
