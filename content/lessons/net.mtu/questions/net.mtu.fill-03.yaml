schemaVersion: 1
id: net.mtu.fill-03
revision: 1
type: fill-blank
prompt:
  - type: text
    text: "MTU와 단편화에서 핵심이 되는 용어는 ___입니다."
choices:
  - "MTU"
  - "TTL"
  - "락 순서"
acceptedAnswers:
  - "MTU"
explanation:
  - type: text
    text: "MTU은(는) 이 레슨에서 다룬 핵심 개념입니다."
  - type: text
    text: "MTU(Maximum Transmission Unit)는 링크가 한 프레임에 담을 수 있는 IP payload의 최대 크기와 관련된 한계입니다. 경로의 가장 작은 MTU가 종단 간 전송 크기를 제한합니다."
tags: [mtu, fragmentation, ip]
difficulty: 3
