schemaVersion: 1
id: calc.limits.steps-01
revision: 3
type: ordering
prompt:
  - type: text
    text: "그래프에서 x=a의 양쪽 극한을 확인하는 순서를 배열하세요."
items:
  - id: left
    content:
      - type: text
        text: "x가 a보다 작은 쪽에서 접근한 값을 본다"
  - id: right
    content:
      - type: text
        text: "x가 a보다 큰 쪽에서 접근한 값을 본다"
  - id: compare
    content:
      - type: text
        text: "좌극한과 우극한을 비교한다"
  - id: decide
    content:
      - type: text
        text: "같으면 그 공통값으로 극한이 존재하고, 다르면 양쪽 극한이 존재하지 않는다고 결론낸다"
correctOrder:
  - left
  - right
  - compare
  - decide
unorderedGroups:
  - [left, right]
explanation:
  - type: text
    text: "좌극한과 우극한이 같은지 비교합니다."
  - type: text
    text: "두 값이 같으면 극한값이 존재하고, 다르면 극한은 존재하지 않습니다."
tags:
  - calculus
  - limits
  - one-sided
difficulty: 2
