schemaVersion: 1
id: calc.limits.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "극한에 대한 옳은 설명을 모두 고르세요."
options:
  - id: both-sides
    content:
      - type: text
        text: "좌극한과 우극한이 같아야 양쪽 극한이 존재한다"
  - id: value-diff
    content:
      - type: text
        text: "극한값과 f(a)가 다를 수 있다"
  - id: undefined
    content:
      - type: text
        text: "f(a)가 정의되지 않아도 극한이 존재할 수 있다"
  - id: always-value
    content:
      - type: text
        text: "극한은 항상 함수값과 같다"
correctOptionIds: [both-sides, value-diff, undefined]
shuffleOptions: true
explanation:
  - type: text
    text: "극한은 접근값이고 해당 점의 함수값과 별개일 수 있습니다."
  - type: text
    text: "연속일 때에만 극한값과 함수값이 같아집니다."
tags:
  - calculus
  - limits
  - one-sided
difficulty: 2
