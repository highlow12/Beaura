schemaVersion: 1
id: net.ethernet.ordering-04
revision: 2
type: ordering
prompt:
  - type: text
    text: "이더넷 프레임의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: frame
    content:
      - type: text
        text: "IP 패킷을 링크 프레임으로 감싼다"
  - id: learn
    content:
      - type: text
        text: "스위치가 출발지 MAC과 포트를 학습한다"
  - id: forward
    content:
      - type: text
        text: "목적지 MAC에 해당하는 링크 포트로 전달한다"
correctOrder: [frame, learn, forward]
unorderedGroups:
  - [learn, forward]
explanation:
  - type: text
    text: "IP 패킷을 프레임으로 감싼 뒤 스위치는 출발지 MAC을 학습하고 목적지 포트를 선택합니다. 두 작업은 프레임 수신 후 서로 독립적으로 처리할 수 있으므로 순서가 없습니다."
  - type: text
    text: "목적지 MAC에 해당하는 링크 포트로 전달한다 단계에서 결과가 다음 네트워크 계층이나 응용으로 전달됩니다."
tags: [ethernet, mac, link-layer]
difficulty: 2
