schemaVersion: 1
id: net.ethernet.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "이더넷 프레임의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: frame
    content:
      - type: text
        text: "IP 패킷을 링크 프레임으로 감싼다"
  - id: learn
    content:
      - type: text
        text: "스위치가 출발지 MAC과 포트를 학습한다"
  - id: forward
    content:
      - type: text
        text: "목적지 MAC에 해당하는 링크 포트로 전달한다"
correctOrder: [frame, learn, forward]
explanation:
  - type: text
    text: "IP 패킷을 링크 프레임으로 감싼다 단계가 먼저이고, 그 결과를 이용해 스위치가 출발지 MAC과 포트를 학습한다 단계가 이어집니다."
  - type: text
    text: "목적지 MAC에 해당하는 링크 포트로 전달한다 단계에서 결과가 다음 네트워크 계층이나 응용으로 전달됩니다."
tags: [ethernet, mac, link-layer]
difficulty: 2
