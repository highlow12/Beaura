schemaVersion: 1
id: net.ethernet.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "이더넷 프레임에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "이더넷 프레임은 같은 링크에서 MAC 주소를 이용해 상위 패킷을 전달하는 단위다."
  - id: wrong-a
    content:
      - type: text
        text: "이더넷 MAC 주소는 전 세계 경로를 계산하는 라우팅 테이블이다."
  - id: wrong-b
    content:
      - type: text
        text: "이더넷 프레임은 TCP의 순서 번호와 재전송만 담는 전송 계층 단위다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "이더넷 프레임은 같은 링크에서 MAC 주소를 이용해 상위 패킷을 전달하는 단위다."
  - type: text
    text: "이더넷은 링크 계층 프로토콜로 프레임 형식과 MAC 주소를 사용합니다. 프레임은 목적지·출발지 MAC, 상위 패킷, 오류 검사용 정보를 담습니다."
tags: [ethernet, mac, link-layer]
difficulty: 1
