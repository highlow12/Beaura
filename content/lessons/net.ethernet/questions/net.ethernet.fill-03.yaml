schemaVersion: 1
id: net.ethernet.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "다른 네트워크로 보내는 첫 프레임의 목적지 MAC은 보통 ___의 MAC입니다."
choices:
  - "게이트웨이"
  - "최종 서버"
  - "송신 앱"
acceptedAnswers:
  - "게이트웨이"
explanation:
  - type: text
    text: "같은 LAN에서 프린터로 보낼 때 IP 패킷을 이더넷 프레임에 넣고 목적지 MAC을 프린터 인터페이스로 지정합니다. 다른 네트워크의 서버로 보낼 때는 IP 목적지를 서버로 유지하지만 첫 프레임의 목적지 MAC은 다음 홉인 게이트웨이입니다. 프레임은 링크를 옮겨 갈 때마다 새로 만들어집니다."
tags: [ethernet, mac, link-layer]
difficulty: 1
