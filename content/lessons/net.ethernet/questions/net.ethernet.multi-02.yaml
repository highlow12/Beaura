schemaVersion: 1
id: net.ethernet.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "이더넷 프레임에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "프레임에는 출발지와 목적지 MAC 주소가 포함될 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "스위치는 관찰한 출발지 MAC과 들어온 포트를 학습할 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "스위치는 목적지 MAC을 보지 않고 모든 프레임을 항상 인터넷 전체로 보낸다."
  - id: wrong-b
    content:
      - type: text
        text: "MAC 주소는 전송 계층 포트 번호와 같은 의미다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "프레임에는 출발지와 목적지 MAC 주소가 포함될 수 있다. 스위치는 관찰한 출발지 MAC과 들어온 포트를 학습할 수 있다."
  - type: text
    text: "MAC 기반 링크 전달은 가까운 네트워크에서 빠르지만 브로드캐스트 범위와 주소 관리가 필요합니다. 다른 네트워크로 갈 때는 목적지 서버 MAC이 아니라 다음 홉의 MAC을 사용합니다."
tags: [ethernet, mac, link-layer]
difficulty: 2
