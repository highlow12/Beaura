schemaVersion: 1
id: se.observability.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: 지연 시간 장애를 관찰 데이터로 조사하는 순서를 배열하세요.
items:
  - id: detect
    content:
      - type: text
        text: 메트릭에서 지연 시간과 오류율의 이상을 감지한다.
  - id: narrow
    content:
      - type: text
        text: 엔드포인트나 리전별로 영향 범위를 좁힌다.
  - id: trace
    content:
      - type: text
        text: 대표 trace에서 긴 span과 병목 의존성을 찾는다.
  - id: log
    content:
      - type: text
        text: trace ID로 로그를 검색해 원인 맥락을 확인한다.
correctOrder:
  - detect
  - narrow
  - trace
  - log
explanation:
  - type: text
    text: 집계된 메트릭으로 이상을 찾고 범위를 줄인 뒤 trace와 로그로 점점 더 구체적인 원인을 확인합니다.
tags:
  - software-engineering
  - observability
  - incident-response
difficulty: 2
