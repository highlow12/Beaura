id: ds.memory.steps-01
type: ordering
prompt:
- type: text
  text: 참조가 공유 객체를 관찰하는 과정을 배열하세요.
items:
- id: allocate
  content:
  - type: text
    text: 리스트 객체를 메모리에 만든다
- id: bind
  content:
  - type: text
    text: 첫 번째 이름을 객체에 연결한다
- id: alias
  content:
  - type: text
    text: 두 번째 이름도 같은 객체에 연결한다
- id: mutate
  content:
  - type: text
    text: 한 이름으로 객체를 변경하고 다른 이름으로 확인한다
correctOrder:
- allocate
- bind
- alias
- mutate
explanation:
- type: text
  text: 객체를 한 번 만들고 여러 이름을 연결하면 별칭이 생깁니다. 한 이름을 통한 변경은 같은 객체를 보는 다른 이름에도 나타납니다.
schemaVersion: 1
revision: 1
tags:
- memory
- representation
- reference
difficulty: 2
