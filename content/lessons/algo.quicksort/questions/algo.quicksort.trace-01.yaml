id: algo.quicksort.trace-01
type: code-output
prompt:
- type: text
  text: 다음 pivot 분할 결과의 출력값을 고르세요.
language: python
code: 'values = [3, 1, 2]

  pivot = 2

  smaller = [x for x in values if x < pivot]

  larger = [x for x in values if x > pivot]

  print(smaller + [pivot] + larger)'
choices:
- '[1, 2, 3]'
- '[2, 1, 3]'
- '[3, 1, 2]'
acceptedOutputs:
- '[1, 2, 3]'
explanation:
- type: text
  text: pivot 2보다 작은 1을 왼쪽, 큰 3을 오른쪽에 두고 이어 붙이면 [1, 2, 3]입니다.
