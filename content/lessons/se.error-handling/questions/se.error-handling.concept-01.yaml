schemaVersion: 1
id: se.error-handling.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 복구할 수 없는 불변식 위반을 발견했을 때 가장 안전한 기본 태도는 무엇인가요?
options:
  - id: fail-observable
    content:
      - type: text
        text: 즉시 실패시키고 원인과 맥락을 관찰 가능하게 남긴다.
  - id: ignore-all
    content:
      - type: text
        text: 모든 예외를 무시하고 다음 요청을 계속 처리한다.
  - id: retry-forever
    content:
      - type: text
        text: 성공할 때까지 제한 없이 재시도한다.
  - id: hide-cause
    content:
      - type: text
        text: 원인을 숨긴 채 빈 성공 응답을 반환한다.
correctOptionId: fail-observable
shuffleOptions: true
explanation:
  - type: text
    text: 불변식이 깨진 상태를 계속 사용하면 더 큰 손상이 생길 수 있으므로 즉시 중단하고 원인을 추적할 신호를 남겨야 합니다.
tags:
  - software-engineering
  - error-handling
  - failure
difficulty: 2
