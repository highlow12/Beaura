type: single-choice
prompt:
  - type: text
    text: "A∩B가 나타내는 사건은 무엇인가요?"
options:
  - id: both
    content:
      - type: text
        text: "A와 B가 모두 일어나는 경우"
  - id: either
    content:
      - type: text
        text: "A 또는 B 중 하나만 일어나는 경우"
  - id: not-a
    content:
      - type: text
        text: "A가 일어나지 않는 경우"
  - id: all
    content:
      - type: text
        text: "표본공간 전체"
correctOptionId: both
shuffleOptions: true
explanation:
  - type: text
    text: "교사건은 두 사건의 공통 결과이므로 동시에 일어나는 경우입니다."
  - type: text
    text: "A∪B는 적어도 하나가 일어나는 합사건입니다."
