schemaVersion: 1
id: se.refactoring.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: 중복된 할인 계산을 안전하게 리팩터링하는 순서를 배열하세요.
items:
  - id: baseline
    content:
      - type: text
        text: 기존 결과와 경계값을 검증하는 테스트를 만든다.
  - id: small-change
    content:
      - type: text
        text: 한 가지 구조 변경만 작게 적용한다.
  - id: rerun
    content:
      - type: text
        text: 테스트를 다시 실행해 동작 보존을 확인한다.
  - id: inspect-diff
    content:
      - type: text
        text: diff를 검토하고 다음 작은 변경을 결정한다.
correctOrder:
  - baseline
  - small-change
  - rerun
  - inspect-diff
explanation:
  - type: text
    text: 기준 동작을 먼저 고정하고 한 단계씩 바꾼 뒤 테스트와 diff를 확인해야 의미 변화와 구조 변화를 구분할 수 있습니다.
tags:
  - software-engineering
  - refactoring
  - workflow
difficulty: 2
