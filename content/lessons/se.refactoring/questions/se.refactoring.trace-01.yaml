schemaVersion: 1
id: se.refactoring.trace-01
revision: 1
type: code-output
prompt:
  - type: text
    text: 할인 계산 함수를 추출한 뒤 다음 코드가 출력하는 값은 무엇인가요?
language: python
code: |-
  def total(price, discount):
      return price * (1 - discount)

  print(total(100, 0.2))
choices:
  - "80.0"
  - "100"
  - "20.0"
acceptedOutputs:
  - "80.0"
explanation:
  - type: text
    text: 1에서 0.2를 뺀 0.8에 100을 곱하므로 함수는 80.0을 반환합니다.
tags:
  - software-engineering
  - refactoring
  - code-trace
difficulty: 1
