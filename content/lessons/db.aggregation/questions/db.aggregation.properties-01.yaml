schemaVersion: 1
id: db.aggregation.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: SQL 집계의 올바른 설명을 모두 고르세요.
options:
  - id: where-before
    content:
      - type: text
        text: WHERE는 보통 집계 전에 개별 행을 제한한다
  - id: having-after
    content:
      - type: text
        text: HAVING은 그룹별 집계 결과를 조건으로 제한할 수 있다
  - id: count-null
    content:
      - type: text
        text: COUNT(*)와 COUNT(column)은 NULL 처리에서 다를 수 있다
  - id: group-free
    content:
      - type: text
        text: GROUP BY가 있으면 모든 SELECT 열을 아무 제약 없이 넣을 수 있다
correctOptionIds: [where-before, having-after, count-null]
shuffleOptions: true
explanation:
  - type: text
    text: WHERE와 HAVING은 각각 행과 그룹을 대상으로 하고, COUNT의 인자에 따라 NULL 포함 여부가 달라집니다. 그룹 키나 집계되지 않은 임의 열은 섞어 쓸 수 없습니다.
tags: [database, sql, aggregation, "null"]
difficulty: 3
