schemaVersion: 1
id: pl.memory-model.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: 함수 호출과 반환에서 스택 프레임의 흐름을 배열하세요.
items:
  - id: caller
    content:
      - type: text
        text: 호출자가 인자와 반환 위치를 준비한다.
  - id: push
    content:
      - type: text
        text: 피호출자의 새 프레임을 스택에 넣는다.
  - id: execute
    content:
      - type: text
        text: 지역 변수와 본문을 프레임에서 실행한다.
  - id: pop-return
    content:
      - type: text
        text: 결과를 전달하고 프레임을 제거한다.
correctOrder:
  - caller
  - push
  - execute
  - pop-return
explanation:
  - type: text
    text: 호출은 새 프레임을 쌓고 반환은 그 프레임을 제거하므로 재귀 호출도 후입선출 순서를 따릅니다.
tags:
  - programming-languages
  - memory
  - call-stack
difficulty: 2
