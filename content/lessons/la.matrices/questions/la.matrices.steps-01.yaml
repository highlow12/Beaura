type: ordering
prompt:
  - type: text
    text: "행렬 원소 A₂₃을 읽는 절차를 배열하세요."
items:
  - id: row
    content:
      - type: text
        text: "두 번째 행으로 이동한다"
  - id: column
    content:
      - type: text
        text: "그 행에서 세 번째 열을 찾는다"
  - id: read
    content:
      - type: text
        text: "교차한 원소의 값을 읽는다"
correctOrder:
