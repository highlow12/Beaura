    rightId: row-desc
  - leftId: column
    rightId: column-desc
  - leftId: shape
    rightId: shape-desc
  - leftId: square
    rightId: square-desc
explanation:
  - type: text
    text: "행렬의 크기와 첨자를 읽으면 원소 위치와 연산 가능 여부를 판단할 수 있습니다."
  - type: text
    text: "정사각행렬은 역행렬과 행렬식 같은 개념을 정의하기 편리한 특별한 경우입니다."
tags:
