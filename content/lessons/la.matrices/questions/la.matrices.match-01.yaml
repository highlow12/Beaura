schemaVersion: 1
id: la.matrices.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: "행렬 용어와 설명을 알맞게 연결하세요."
leftItems:
  - id: row
    content:
      - type: text
        text: "행"
  - id: column
    content:
      - type: text
        text: "열"
  - id: shape
    content:
      - type: text
        text: "m×n"
  - id: square
    content:
      - type: text
        text: "정사각행렬"
rightItems:
  - id: row-desc
    content:
      - type: text
        text: "가로 방향 원소들의 줄"
  - id: column-desc
    content:
      - type: text
        text: "세로 방향 원소들의 줄"
  - id: shape-desc
    content:
      - type: text
        text: "행 수와 열 수를 나타내는 크기"
  - id: square-desc
    content:
      - type: text
        text: "행 수와 열 수가 같은 행렬"
correctPairs:
