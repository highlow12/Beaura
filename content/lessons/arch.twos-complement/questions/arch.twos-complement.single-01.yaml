schemaVersion: 1
id: arch.twos-complement.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "2의 보수 정수에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "n비트 2의 보수에서 최상위 비트는 부호 판단에 사용되며 음수는 반전 후 1을 더해 만든다."
  - id: wrong-a
    content:
      - type: text
        text: "음수는 항상 최상위 비트만 1로 만들면 표현된다."
  - id: wrong-b
    content:
      - type: text
        text: "2의 보수에서는 0을 +0과 -0 두 패턴으로 저장한다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "n비트 2의 보수에서 최상위 비트는 부호 판단에 사용되며 음수는 반전 후 1을 더해 만든다."
  - type: text
    text: "2의 보수 표현에서는 최상위 비트를 부호 판단에 사용하고, 음수는 비트를 뒤집은 뒤 1을 더해 만듭니다. n비트 범위는 -2^(n-1)부터 2^(n-1)-1까지입니다."
tags: [integer, twos-complement, overflow]
difficulty: 2
