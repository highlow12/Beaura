schemaVersion: 1
id: arch.twos-complement.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "2의 보수 정수에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "4비트 2의 보수의 표현 범위는 -8부터 7까지다."
  - id: correct-b
    content:
      - type: text
        text: "음수의 2의 보수를 다시 취하면 원래 절댓값의 양수 패턴으로 돌아간다."
  - id: wrong-a
    content:
      - type: text
        text: "4비트 2의 보수는 -16부터 15까지 표현한다."
  - id: wrong-b
    content:
      - type: text
        text: "음수 변환에서 비트 반전만 하고 1을 더하지 않는다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "4비트 2의 보수의 표현 범위는 -8부터 7까지다. 음수의 2의 보수를 다시 취하면 원래 절댓값의 양수 패턴으로 돌아간다."
  - type: text
    text: "2의 보수는 0이 하나뿐이고 같은 덧셈 회로로 양수와 음수를 처리할 수 있습니다. 대신 표현 범위가 비대칭이라 -8은 표현되지만 +8은 4비트에서 표현되지 않습니다."
tags: [integer, twos-complement, overflow]
difficulty: 3
