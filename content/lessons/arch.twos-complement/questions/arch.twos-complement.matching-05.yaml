schemaVersion: 1
id: arch.twos-complement.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "2의 보수 정수의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "msb"
  - id: left-b
    content:
      - type: text
        text: "range"
  - id: left-c
    content:
      - type: text
        text: "overflow"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "부호 판단에 쓰이는 최상위 비트"
  - id: right-b
    content:
      - type: text
        text: "n비트에서 -2^(n-1) ~ 2^(n-1)-1"
  - id: right-c
    content:
      - type: text
        text: "표현 범위를 벗어난 결과"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "msb은 부호 판단에 쓰이는 최상위 비트, range은 n비트에서 -2^(n-1) ~ 2^(n-1)-1입니다."
  - type: text
    text: "overflow은 표현 범위를 벗어난 결과을 뜻하므로 세 역할을 구분해야 합니다."
tags: [integer, twos-complement, overflow]
difficulty: 2
