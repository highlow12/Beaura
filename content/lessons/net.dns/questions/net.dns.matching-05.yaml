schemaVersion: 1
id: net.dns.matching-05
revision: 2
type: matching
prompt:
  - type: text
    text: "DNS 이름 해석의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "리졸버"
  - id: left-b
    content:
      - type: text
        text: "권한 서버"
  - id: left-c
    content:
      - type: text
        text: "TTL"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "클라이언트를 대신해 DNS 질의를 수행하는 서버"
  - id: right-b
    content:
      - type: text
        text: "특정 도메인의 최종 레코드를 관리하는 서버"
  - id: right-c
    content:
      - type: text
        text: "캐시 응답의 유효 기간"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "리졸버은 클라이언트를 대신해 DNS 질의를 수행하는 서버, 권한 서버은 특정 도메인의 최종 레코드를 관리하는 서버, TTL은 캐시 응답의 유효 기간에 해당합니다."
tags: [dns, name-resolution, cache]
difficulty: 2
