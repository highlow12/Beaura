schemaVersion: 1
id: net.dns.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "DNS 이름 해석에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "재귀 리졸버는 클라이언트를 대신해 다른 DNS 서버에 질의할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "TTL은 DNS 캐시 결과를 얼마나 오래 사용할지와 관련 있다."
  - id: wrong-a
    content:
      - type: text
        text: "DNS 캐시가 있으면 레코드가 변경되어도 영원히 예전 값을 사용한다."
  - id: wrong-b
    content:
      - type: text
        text: "A와 AAAA 레코드는 포트 번호만 저장하고 IP 주소는 저장하지 않는다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "재귀 리졸버는 클라이언트를 대신해 다른 DNS 서버에 질의할 수 있다. TTL은 DNS 캐시 결과를 얼마나 오래 사용할지와 관련 있다."
  - type: text
    text: "DNS 캐시는 지연과 서버 부하를 줄이지만 오래된 주소를 잠시 제공할 수 있습니다. 이름 계층과 위임은 전 세계 데이터를 분산 관리하게 합니다."
tags: [dns, name-resolution, cache]
difficulty: 3
