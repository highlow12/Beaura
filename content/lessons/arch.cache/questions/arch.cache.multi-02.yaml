schemaVersion: 1
id: arch.cache.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "캐시와 지역성에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "연속 배열 순회는 인접 주소를 함께 쓰므로 공간 지역성을 활용한다."
  - id: correct-b
    content:
      - type: text
        text: "캐시 miss가 나면 보통 더 느린 메모리 계층에서 블록을 가져온다."
  - id: wrong-a
    content:
      - type: text
        text: "시간 지역성은 앞으로 절대 재사용하지 않을 데이터를 뜻한다."
  - id: wrong-b
    content:
      - type: text
        text: "캐시는 메모리 주소의 태그를 확인하지 않고 항상 hit로 처리한다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "연속 배열 순회는 인접 주소를 함께 쓰므로 공간 지역성을 활용한다. 캐시 miss가 나면 보통 더 느린 메모리 계층에서 블록을 가져온다."
  - type: text
    text: "캐시를 크게 하면 hit 가능성이 높아질 수 있지만 비용과 접근 지연이 증가합니다. 교체 정책과 쓰기 정책도 일관성·성능·구현 복잡도의 균형을 정해야 합니다."
tags: [cache, locality, memory-hierarchy]
difficulty: 3
