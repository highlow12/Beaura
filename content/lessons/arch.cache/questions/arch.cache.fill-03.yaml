prompt:
  - type: text
    text: "캐시와 지역성에서 핵심이 되는 용어는 ___입니다."
choices:
  - "캐시 미스"
  - "명령어 디코드"
  - "데드락"
acceptedAnswers:
  - "캐시 미스"
explanation:
  - type: text
    text: "캐시 미스은(는) 이 레슨에서 다룬 핵심 개념입니다."
  - type: text
    text: "캐시는 자주 접근할 것 같은 메모리 블록을 더 빠른 저장소에 보관하는 계층입니다. 시간 지역성은 같은 데이터를 다시 쓰는 경향이고, 공간 지역성은 가까운 주소를 함께 쓰는 경향입니다."
