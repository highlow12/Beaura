schemaVersion: 1
id: math.contrapositive.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "“a가 짝수이면 a²이 짝수”의 대우 증명 흐름을 배열하세요."
items:
  - id: assume-odd-square
    content:
      - type: text
        text: "a²이 홀수라고 가정한다"
  - id: infer-odd
    content:
      - type: text
        text: "a가 홀수임을 보여 준다"
  - id: state-contra
    content:
      - type: text
        text: "대우의 결론 ¬a 짝수에 해당함을 정리한다"
correctOrder:
  - assume-odd-square
  - infer-odd
  - state-contra
explanation:
  - type: text
    text: "원래 명제의 대우는 a²이 홀수가 아니면 a가 홀수가 아니라는 형태로 읽을 수 있습니다."
  - type: text
    text: "문장의 부정 표현을 먼저 정확히 풀어 쓰면 증명 방향을 놓치지 않습니다."
tags:
  - discrete-math
  - proof
  - proof-direction
difficulty: 3
