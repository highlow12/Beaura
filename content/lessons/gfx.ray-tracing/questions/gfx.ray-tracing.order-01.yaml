schemaVersion: 1
id: gfx.ray-tracing.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: 한 픽셀의 직접 그림자를 검사하는 과정을 순서대로 배열하세요.
items:
  - id: primary-ray
    content:
      - type: text
        text: 카메라에서 픽셀을 통과하는 광선을 만든다
  - id: hit
    content:
      - type: text
        text: 가장 가까운 표면 교차점을 찾는다
  - id: shadow-ray
    content:
      - type: text
        text: 교차점에서 광원 방향 그림자 광선을 만든다
  - id: occlusion
    content:
      - type: text
        text: 광원과의 사이에 다른 물체가 있는지 검사한다
  - id: shade
    content:
      - type: text
        text: 가려짐 여부를 반영해 색을 계산한다
correctOrder: [primary-ray, hit, shadow-ray, occlusion, shade]
explanation:
  - type: text
    text: 먼저 보이는 표면을 찾고, 그 지점에서 광원까지의 가시성을 검사한 뒤 조명 결과를 계산합니다.
tags: [graphics, ray-tracing, shadows, order]
difficulty: 3
