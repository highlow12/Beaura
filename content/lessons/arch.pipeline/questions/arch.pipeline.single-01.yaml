schemaVersion: 1
id: arch.pipeline.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "파이프라인과 해저드에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "파이프라인은 서로 다른 명령어를 여러 실행 단계에 겹쳐 배치해 처리량을 높인다."
  - id: wrong-a
    content:
      - type: text
        text: "파이프라인은 한 명령어의 모든 단계를 동시에 끝내는 단일 회로다."
  - id: wrong-b
    content:
      - type: text
        text: "파이프라인을 사용하면 분기와 데이터 의존성이 자동으로 사라진다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "파이프라인은 서로 다른 명령어를 여러 실행 단계에 겹쳐 배치해 처리량을 높인다."
  - type: text
    text: "파이프라인은 fetch, decode, execute 같은 단계를 나누고 서로 다른 명령어를 각 단계에서 동시에 처리합니다. 처리량은 높아지지만 한 명령어의 전체 지연이 반드시 줄어드는 것은 아닙니다."
tags: [pipeline, hazard, cpu-performance]
difficulty: 3
