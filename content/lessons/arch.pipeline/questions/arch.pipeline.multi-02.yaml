schemaVersion: 1
id: arch.pipeline.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "파이프라인과 해저드에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "앞 명령어 결과를 뒤 명령어가 바로 필요로 하면 데이터 해저드가 생길 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "분기 예측 실패는 이미 가져온 명령어를 버리고 다시 채우는 비용을 만든다."
  - id: wrong-a
    content:
      - type: text
        text: "파이프라인의 각 단계에는 동시에 하나의 명령어만 존재할 수 있다."
  - id: wrong-b
    content:
      - type: text
        text: "stall은 해저드가 있어도 파이프라인을 더 빨리 진행시키는 기법이다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "앞 명령어 결과를 뒤 명령어가 바로 필요로 하면 데이터 해저드가 생길 수 있다. 분기 예측 실패는 이미 가져온 명령어를 버리고 다시 채우는 비용을 만든다."
  - type: text
    text: "깊은 파이프라인은 높은 클록 주파수를 노릴 수 있지만 해저드와 분기 실패 비용이 커집니다. 실제 설계는 클록 속도, 전력, 예측 정확도, 회로 복잡도를 함께 고려합니다."
tags: [pipeline, hazard, cpu-performance]
difficulty: 4
