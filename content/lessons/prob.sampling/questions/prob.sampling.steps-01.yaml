    text: "무엇을 알고 싶은지 정한 뒤 표본을 설계하고 관측·추정으로 이어갑니다."
  - type: text
    text: "표본을 먼저 모으고 모집단을 나중에 정하면 편향을 평가하기 어렵습니다."
