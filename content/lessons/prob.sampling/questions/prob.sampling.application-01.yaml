schemaVersion: 1
id: prob.sampling.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "대표성 있는 표본에 도움이 되는 조건을 모두 고르세요."
options:
  - id: random
    content:
      - type: text
        text: "모집단의 대상이 무작위로 선택될 기회를 가진다"
  - id: coverage
    content:
      - type: text
        text: "관심 모집단의 범위를 빠뜨리지 않는다"
  - id: record
    content:
      - type: text
        text: "추출 절차와 응답률을 기록한다"
  - id: convenience
    content:
      - type: text
        text: "가까운 사람만 편의상 선택한다"
correctOptionIds: [random, coverage, record]
shuffleOptions: true
explanation:
  - type: text
    text: "무작위성과 모집단 범위의 포괄성, 절차 기록은 편향을 확인하고 줄이는 데 도움이 됩니다."
  - type: text
    text: "편의 표본은 특정 집단을 과대표집할 수 있습니다."
tags:
  - probability-statistics
  - sampling
  - bias
difficulty: 2
