schemaVersion: 1
id: toc.cfg.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 문맥 자유 문법(CFG)의 생산 규칙이 반드시 만족해야 하는 모양은 무엇인가요?
options:
  - id: one-left
    content:
      - type: text
        text: 왼쪽에 비단말 기호 하나가 온다.
  - id: two-terminal-left
    content:
      - type: text
        text: 왼쪽에 단말 기호 두 개가 온다.
  - id: no-nonterminal
    content:
      - type: text
        text: 오른쪽에 비단말을 쓸 수 없다.
  - id: fixed-length
    content:
      - type: text
        text: 모든 오른쪽 문자열의 길이가 같아야 한다.
correctOptionId: one-left
shuffleOptions: true
explanation:
  - type: text
    text: CFG에서는 문맥과 무관하게 비단말 하나를 오른쪽 기호열로 바꿀 수 있습니다. 오른쪽에는 단말과 비단말이 모두 올 수 있습니다.
tags:
  - theory-of-computation
  - cfg
  - grammar
difficulty: 1
