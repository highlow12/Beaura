schemaVersion: 1
id: os.scheduling.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "라운드 로빈에서 한 작업에 연속으로 할당하는 CPU 시간은 ___입니다."
choices:
  - "시간 조각"
  - "페이지 크기"
  - "블록 주소"
acceptedAnswers:
  - "시간 조각"
explanation:
  - type: text
    text: "준비 큐에 A, B가 있을 때 라운드 로빈은 A에 시간 조각을 주고, 아직 끝나지 않았다면 A를 큐 뒤로 보냅니다. 다음에는 B가 실행될 기회를 얻습니다. 시간 조각이 지나치게 짧으면 전환 비용이 늘고, 특정 작업이 계속 선택되지 않으면 기아가 됩니다."
tags: [scheduling, cpu, fairness]
difficulty: 2
