schemaVersion: 1
id: os.scheduling.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "CPU 스케줄링의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: queue
    content:
      - type: text
        text: "실행 가능한 작업을 준비 큐에 둔다"
  - id: slice
    content:
      - type: text
        text: "정책에 따라 CPU 시간 조각이나 우선순위를 계산한다"
  - id: preempt
    content:
      - type: text
        text: "필요하면 현재 작업을 멈추고 다음 작업을 실행한다"
correctOrder: [queue, slice, preempt]
explanation:
  - type: text
    text: "실행 가능한 작업을 준비 큐에 둔다 단계가 먼저이고, 그 결과를 이용해 정책에 따라 CPU 시간 조각이나 우선순위를 계산한다 단계가 이어집니다."
  - type: text
    text: "필요하면 현재 작업을 멈추고 다음 작업을 실행한다 단계에서 최종 결과가 다음 실행 단계로 전달됩니다."
tags: [scheduling, cpu, fairness]
difficulty: 3
