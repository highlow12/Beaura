type: single-choice
prompt:
  - type: text
    text: "CPU 스케줄링에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "CPU 스케줄러는 준비 큐의 실행 단위를 선택해 지연과 공정성을 조절한다."
  - id: wrong-a
    content:
      - type: text
        text: "스케줄러는 각 프로세스의 소스 코드를 다시 컴파일한다."
  - id: wrong-b
    content:
      - type: text
        text: "선점형 스케줄링에서는 실행 중인 작업을 절대 중단할 수 없다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "CPU 스케줄러는 준비 큐의 실행 단위를 선택해 지연과 공정성을 조절한다."
  - type: text
    text: "CPU 스케줄러는 준비 상태의 실행 단위 중 다음에 실행할 것을 선택합니다. FCFS, 라운드 로빈, 우선순위 같은 정책은 대기 시간·응답 시간·공정성을 서로 다르게 만듭니다."
