    text: 소스 표현식에서 AST를 만드는 기본 과정을 배열하세요.
items:
  - id: tokens
    content:
      - type: text
        text: 토큰 순서를 입력으로 받는다.
  - id: grammar
    content:
      - type: text
        text: 문법 규칙으로 중첩 구조를 파싱한다.
  - id: precedence
    content:
      - type: text
        text: 우선순위와 결합 방향을 트리에 반영한다.
  - id: simplify
    content:
      - type: text
        text: 불필요한 문법 장식을 줄인 AST 노드를 만든다.
correctOrder:
  - tokens
  - grammar
  - precedence
  - simplify
explanation:
  - type: text
    text: 파서는 토큰과 문법으로 구조를 만든 뒤 연산자 규칙을 적용해 의미 있는 AST를 반환합니다.
tags:
