schemaVersion: 1
id: se.version-control.trace-01
revision: 2
type: code-output
prompt:
  - type: text
    text: 공통 커밋 B에서 갈라진 기능 브랜치 F와 main의 M을 병합 커밋 X가 합쳤습니다. X의 직접 부모 커밋은 몇 개인가요?
language: python
code: |-
  parents = {"A": [], "B": ["A"], "F": ["B"], "M": ["B"], "X": ["F", "M"]}
  print(len(parents["X"]))
choices:
  - "2"
  - "1"
  - "3"
acceptedOutputs:
  - "2"
explanation:
  - type: text
    text: 병합 커밋 X는 기능 브랜치 끝 F와 main 끝 M을 두 부모로 연결합니다. 따라서 parents["X"]에는 두 커밋이 있고 길이는 2입니다. 일반적인 병합 커밋이 두 이력을 합치는 형태를 단순화한 예입니다.
