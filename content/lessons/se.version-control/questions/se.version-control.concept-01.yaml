schemaVersion: 1
id: se.version-control.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 버전 관리에서 논리적으로 하나의 변경을 기록하는 스냅샷은 무엇인가요?
options:
  - id: commit
    content:
      - type: text
        text: 커밋
  - id: branch
    content:
      - type: text
        text: 브랜치
  - id: conflict
    content:
      - type: text
        text: 충돌
  - id: workspace
    content:
      - type: text
        text: 작업 트리
correctOptionId: commit
shuffleOptions: true
explanation:
  - type: text
    text: 커밋은 검토하고 되돌릴 수 있는 변경 스냅샷이며 브랜치는 커밋을 가리키는 작업 흐름의 이름입니다.
tags:
  - software-engineering
  - version-control
  - commit
difficulty: 1
