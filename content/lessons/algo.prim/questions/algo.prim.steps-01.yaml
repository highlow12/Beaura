  text: Prim의 한 확장 단계를 순서대로 배열하세요.
items:
- id: mark
  content:
  - type: text
    text: 현재 정점을 트리에 표시한다
- id: push
  content:
  - type: text
    text: 현재 정점에서 나가는 경계 간선을 힙에 넣는다
- id: pop
  content:
  - type: text
