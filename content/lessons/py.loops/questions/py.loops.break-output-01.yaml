schemaVersion: 1
id: py.loops.break-output-01
revision: 1
type: code-output
prompt:
  - type: text
    text: 다음 Python 코드의 출력 결과를 고르세요.
language: python
code: |-
  total = 0
  for number in [1, 2, 3, 4]:
      if number == 3:
          break
      total += number
  print(total)
choices:
  - '3'
  - '6'
  - '10'
acceptedOutputs:
  - '3'
explanation:
  - type: text
    text: 1과 2만 total에 더해진 뒤 number가 3일 때 break가 실행되어 반복문이 끝납니다.
tags:
