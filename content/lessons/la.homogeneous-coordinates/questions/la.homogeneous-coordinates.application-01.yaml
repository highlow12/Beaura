schemaVersion: 1
id: la.homogeneous-coordinates.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "동차좌표에 대한 옳은 설명을 모두 고르세요."
options:
  - id: translation
    content:
      - type: text
        text: "평행이동을 행렬 곱으로 표현할 수 있다"
  - id: point-w
    content:
      - type: text
        text: "점은 보통 w=1로 둔다"
  - id: direction-w
    content:
      - type: text
        text: "방향 벡터는 보통 w=0으로 둔다"
  - id: no-order
    content:
      - type: text
        text: "변환 행렬의 곱 순서는 결과에 영향을 주지 않는다"
correctOptionIds: [translation, point-w, direction-w]
shuffleOptions: true
explanation:
  - type: text
    text: "동차좌표는 위치와 방향의 w를 구분해 평행이동을 포함한 합성을 가능하게 합니다."
  - type: text
    text: "행렬 곱은 일반적으로 교환되지 않아 변환 순서가 중요합니다."
tags:
  - linear-algebra
  - coordinates
  - transformation
difficulty: 2
