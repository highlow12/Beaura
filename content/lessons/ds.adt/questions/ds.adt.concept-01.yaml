id: ds.adt.concept-01
type: single-choice
prompt:
- type: text
  text: 추상 자료형(ADT)의 핵심은 무엇인가요?
options:
- id: behavior
  content:
  - type: text
    text: 내부 저장 방식과 무관하게 제공할 연산과 규칙을 정의하는 것
- id: layout
  content:
  - type: text
    text: 메모리 칸의 실제 주소를 모두 공개하는 것
- id: language
  content:
  - type: text
    text: 특정 프로그래밍 언어의 문법만 모아 두는 것
- id: speed
  content:
  - type: text
    text: 모든 입력에서 가장 빠른 구현을 보장하는 것
correctOptionId: behavior
shuffleOptions: true
explanation:
- type: text
  text: ADT는 사용자가 볼 동작 계약을 정하고 구현 세부사항은 숨깁니다. 하나의 ADT를 여러 자료구조 방식으로 구현할 수 있습니다.
