id: ds.adt.steps-01
type: ordering
prompt:
- type: text
  text: ADT를 사용해 자료구조를 선택하고 구현하는 순서를 배열하세요.
items:
- id: need
  content:
  - type: text
    text: 필요한 데이터 동작을 적는다
- id: contract
  content:
  - type: text
    text: ADT의 연산과 결과 규칙을 정한다
- id: choose
  content:
  - type: text
    text: 계약에 맞는 구현을 선택한다
- id: use
  content:
  - type: text
    text: 구현 세부사항 없이 연산을 호출한다
correctOrder:
- need
- contract
- choose
- use
explanation:
- type: text
  text: 먼저 요구 동작을 ADT 계약으로 만들고, 성능과 메모리 조건에 맞는 구현을 선택한 뒤 인터페이스를 사용합니다.
schemaVersion: 1
