schemaVersion: 1
id: net.protocol-model.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "패킷과 계층 모델의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: payload
    content:
      - type: text
        text: "상위 계층이 전달할 데이터를 만든다"
  - id: encapsulate
    content:
      - type: text
        text: "각 하위 계층이 헤더를 붙인다"
  - id: decapsulate
    content:
      - type: text
        text: "수신 계층이 헤더를 해석하고 payload를 넘긴다"
correctOrder: [payload, encapsulate, decapsulate]
explanation:
  - type: text
    text: "상위 계층이 전달할 데이터를 만든다 단계가 먼저이고, 그 결과를 이용해 각 하위 계층이 헤더를 붙인다 단계가 이어집니다."
  - type: text
    text: "수신 계층이 헤더를 해석하고 payload를 넘긴다 단계에서 결과가 다음 네트워크 계층이나 응용으로 전달됩니다."
tags: [network, protocol, encapsulation]
difficulty: 2
