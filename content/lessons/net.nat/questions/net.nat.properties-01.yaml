schemaVersion: 1
id: net.nat.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: NAT에 관한 올바른 설명을 모두 고르세요.
options:
  - id: private-not-routed
    content:
      - type: text
        text: 사설 IPv4 주소는 공용 인터넷에서 직접 라우팅되지 않는다.
  - id: table
    content:
      - type: text
        text: 라우터는 응답을 돌려보내기 위해 변환 대응을 기억한다.
  - id: firewall
    content:
      - type: text
        text: NAT만 사용하면 별도의 보안 정책은 언제나 불필요하다.
  - id: end-to-end
    content:
      - type: text
        text: NAT는 외부에서 내부로 시작하는 연결을 더 복잡하게 만들 수 있다.
correctOptionIds: [private-not-routed, table, end-to-end]
shuffleOptions: true
explanation:
  - type: text
    text: NAT는 주소 변환과 매핑 상태를 담당합니다. 방화벽 정책을 완전히 대신하지 않으며 종단 간 연결성을 복잡하게 할 수 있습니다.
tags: [network, nat, private-address]
difficulty: 3
