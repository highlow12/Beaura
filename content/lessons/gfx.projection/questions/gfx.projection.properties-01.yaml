schemaVersion: 1
id: gfx.projection.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: 투영과 클리핑에 대한 올바른 설명을 모두 고르세요.
options:
  - id: clip-space
    content:
      - type: text
        text: 투영 행렬의 결과는 클리핑 전의 클립 좌표로 다룰 수 있다
  - id: near-far
    content:
      - type: text
        text: near와 far는 깊이 방향의 가시 범위를 정한다
  - id: orthographic-depth
    content:
      - type: text
        text: 직교 투영도 깊이 비교와 클리핑을 전혀 하지 않는다
  - id: no-view-volume
    content:
      - type: text
        text: 시야체는 투영과 관련이 없는 오디오 영역이다
correctOptionIds: [clip-space, near-far]
shuffleOptions: true
explanation:
  - type: text
    text: 투영 뒤에는 클립 좌표에서 시야체 경계를 적용하고, near·far를 포함한 범위를 벗어난 점을 제거합니다. 직교 투영도 깊이 범위와 클리핑을 가집니다.
tags: [graphics, projection, clipping]
difficulty: 3
