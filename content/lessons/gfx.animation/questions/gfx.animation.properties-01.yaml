schemaVersion: 1
id: gfx.animation.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: 애니메이션 보간에 관한 올바른 설명을 모두 고르세요.
options:
  - id: endpoints
    content: [{ type: text, text: "선형 보간에서 t가 0이면 시작값, 1이면 끝값이다." }]
  - id: easing
    content: [{ type: text, text: 이징은 시간 비율을 바꾸어 가속과 감속의 느낌을 조절할 수 있다. }]
  - id: all-frames
    content: [{ type: text, text: 키프레임 방식은 반드시 모든 화면 프레임의 값을 직접 저장해야 한다. }]
  - id: rotation
    content: [{ type: text, text: 3차원 회전은 숫자 세 개를 언제나 단순 선형 보간하면 충분하다. }]
correctOptionIds: [endpoints, easing]
shuffleOptions: true
explanation:
  - type: text
    text: 키프레임 사이는 계산할 수 있고, 이징은 시간 진행 방식을 조절합니다. 3차원 회전에는 별도의 보간 방법이 필요할 수 있습니다.
tags: [graphics, animation, interpolation]
difficulty: 3
