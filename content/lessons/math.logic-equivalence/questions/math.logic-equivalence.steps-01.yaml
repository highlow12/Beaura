schemaVersion: 1
id: math.logic-equivalence.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "논리식 ¬(P ∨ Q)를 동치식으로 바꾸는 순서를 배열하세요."
items:
  - id: scope
    content:
      - type: text
        text: "부정 기호가 P ∨ Q 전체를 감싼다는 것을 확인한다"
  - id: negate
    content:
      - type: text
        text: "P와 Q를 각각 부정한다"
  - id: swap
    content:
      - type: text
        text: "∨를 ∧로 바꿔 ¬P ∧ ¬Q를 쓴다"
correctOrder:
  - scope
  - negate
  - swap
explanation:
  - type: text
    text: "먼저 부정의 범위를 확인한 뒤 각 항을 부정하고, 드모르간 법칙에 따라 OR를 AND로 바꿉니다."
  - type: text
    text: "변환 단계를 분리하면 일부 항만 부정하거나 연산자를 놓치는 실수를 줄일 수 있습니다."
tags:
  - discrete-math
  - logic
  - transformation
difficulty: 2
