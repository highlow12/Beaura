schemaVersion: 1
id: math.logic-equivalence.application-01
revision: 2
type: multi-select
prompt:
  - type: text
    text: "다음 중 DNF 형태인 논리식을 모두 고르세요."
options:
  - id: dnf-one
    content:
      - type: text
        text: "(P ∧ Q) ∨ R"
  - id: dnf-two
    content:
      - type: text
        text: "(¬P ∧ R) ∨ (Q ∧ S)"
  - id: cnf-one
    content:
      - type: text
        text: "(P ∨ Q) ∧ R"
  - id: plain
    content:
      - type: text
        text: "P ∧ Q"
correctOptionIds: [dnf-one, dnf-two, plain]
shuffleOptions: true
explanation:
  - type: text
    text: "DNF는 하나 이상의 AND 항을 OR로 결합한 형태입니다. 항이 하나뿐인 P ∧ Q도 DNF입니다."
  - type: text
    text: "(P ∨ Q) ∧ R는 CNF 형태입니다."
tags:
  - discrete-math
  - logic
  - dnf
difficulty: 2
