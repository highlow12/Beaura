schemaVersion: 1
id: se.testing.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 테스트 피라미드의 아래쪽에 단위 테스트를 많이 두는 가장 큰 이유는 무엇인가요?
options:
  - id: fast-isolated
    content:
      - type: text
        text: 빠르고 격리되어 피드백과 실패 원인 파악이 쉽기 때문이다.
  - id: user-only
    content:
      - type: text
        text: 실제 사용자의 모든 행동을 단위 테스트가 대신하기 때문이다.
  - id: environment-heavy
    content:
      - type: text
        text: 외부 서비스와 데이터베이스를 항상 연결하기 때문이다.
  - id: visual-only
    content:
      - type: text
        text: 화면의 색상만 확인하기 때문이다.
correctOptionId: fast-isolated
shuffleOptions: true
explanation:
  - type: text
    text: 작은 단위를 격리해 검증하면 실행 비용이 낮고 실패가 어느 책임에서 발생했는지 빠르게 알 수 있습니다.
tags:
  - software-engineering
  - testing
  - test-pyramid
difficulty: 1
