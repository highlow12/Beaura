schemaVersion: 1
id: math.permutations.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "순열로 계산하는 상황을 모두 고르세요."
options:
  - id: rank
    content:
      - type: text
        text: "5명 중 금·은·동메달 수상자를 정한다"
  - id: line
    content:
      - type: text
        text: "서로 다른 6권을 책장에 배열한다"
  - id: committee
    content:
      - type: text
        text: "10명 중 위원 3명을 순서 없이 고른다"
  - id: choose-flavor
    content:
      - type: text
        text: "아이스크림 맛 하나를 고른다"
correctOptionIds: [rank, line]
shuffleOptions: true
explanation:
  - type: text
    text: "직책이나 자리처럼 순서가 결과를 바꾸는 배열은 순열로 계산합니다."
  - type: text
    text: "순서 없는 위원 선택은 조합이고, 한 가지 선택은 배열 문제가 아닙니다."
tags:
  - discrete-math
  - combinatorics
  - permutation
difficulty: 2
