schemaVersion: 1
id: pl.syntax-semantics.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 프로그래밍 언어에서 문법(syntax)과 의미(semantics)의 관계를 올바르게 설명한 것은 무엇인가요?
options:
  - id: form-meaning
    content:
      - type: text
        text: 문법은 올바른 모양을, 의미는 그 모양이 실행될 때의 뜻을 정한다.
  - id: same
    content:
      - type: text
        text: 둘은 같은 개념이라 구분할 필요가 없다.
  - id: meaning-only
    content:
      - type: text
        text: 문법은 실행 결과만, 의미는 공백 배치만 정한다.
  - id: runtime-only
    content:
      - type: text
        text: 문법과 의미는 모두 실행이 끝난 뒤에만 확인할 수 있다.
correctOptionId: form-meaning
shuffleOptions: true
explanation:
  - type: text
    text: 문법은 토큰과 구조의 허용 형태를, 의미는 그 구조가 계산하는 값과 상태 변화를 설명합니다.
tags:
  - programming-languages
  - syntax
  - semantics
difficulty: 1
