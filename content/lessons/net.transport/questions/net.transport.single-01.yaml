schemaVersion: 1
id: net.transport.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "UDP와 포트에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "UDP는 포트로 프로세스를 구분하고 데이터그램을 전달하지만 순서와 재전송을 기본 보장하지 않는다."
  - id: wrong-a
    content:
      - type: text
        text: "UDP는 모든 패킷을 반드시 순서대로 재조립하고 누락을 재전송한다."
  - id: wrong-b
    content:
      - type: text
        text: "포트 번호는 라우터의 물리 케이블을 전 세계에서 식별하는 주소다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "UDP는 포트로 프로세스를 구분하고 데이터그램을 전달하지만 순서와 재전송을 기본 보장하지 않는다."
  - type: text
    text: "포트 번호는 호스트 안의 전송 종단점을 식별합니다. UDP는 데이터그램마다 포트와 길이 등을 담고 빠르게 전달하지만 순서·재전송·혼잡 제어를 기본 보장하지 않습니다."
tags: [udp, transport, port]
difficulty: 1
