schemaVersion: 1
id: net.transport.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "호스트에서 수신 데이터그램을 알맞은 소켓에 전달할 때 사용하는 번호는 ___입니다."
choices:
  - "목적지 포트"
  - "목적지 MAC만"
  - "TTL"
acceptedAnswers:
  - "목적지 포트"
explanation:
  - type: text
    text: "같은 호스트에서 DNS 질의와 게임 패킷이 들어와도 목적지 포트를 이용해 알맞은 수신 소켓으로 보냅니다. UDP 데이터그램은 각각 독립적이며 전달·순서·재전송을 보장하지 않습니다. 따라서 응용이 필요하다면 별도로 재시도와 중복 처리를 설계해야 합니다."
tags: [udp, transport, port]
difficulty: 1
