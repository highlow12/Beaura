schemaVersion: 1
id: math.relations.steps-01
revision: 2
type: ordering
prompt:
  - type: text
    text: "두 집합에서 Cartesian product를 만드는 과정을 배열하세요."
items:
  - id: choose-first
    content:
      - type: text
        text: "첫 성분을 첫 번째 집합에서 하나 고른다"
  - id: choose-second
    content:
      - type: text
        text: "둘째 성분을 두 번째 집합에서 하나 고른다"
  - id: record
    content:
      - type: text
        text: "순서쌍 (첫 성분, 둘째 성분)을 기록한다"
  - id: repeat
    content:
      - type: text
        text: "가능한 선택을 모두 반복한다"
correctOrder:
  - choose-first
  - choose-second
  - record
  - repeat
unorderedGroups:
  - [choose-first, choose-second]
explanation:
  - type: text
    text: "각 첫 성분과 둘째 성분의 조합을 빠짐없이 순서쌍으로 기록하면 Cartesian product가 됩니다."
  - type: text
    text: "첫째와 둘째 집합의 역할을 바꾸면 다른 곱집합이 됩니다."
tags:
  - discrete-math
  - relations
  - construction
difficulty: 2
