schemaVersion: 1
id: os.protection.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "권한과 프로세스 격리의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "read-only"
  - id: left-b
    content:
      - type: text
        text: "privileged-instruction"
  - id: left-c
    content:
      - type: text
        text: "isolation"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "쓰기 접근을 막는 페이지 권한"
  - id: right-b
    content:
      - type: text
        text: "커널 권한에서만 실행되는 명령"
  - id: right-c
    content:
      - type: text
        text: "프로세스 자원과 주소 공간을 분리하는 성질"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "read-only은 쓰기 접근을 막는 페이지 권한, privileged-instruction은 커널 권한에서만 실행되는 명령입니다."
  - type: text
    text: "isolation은 프로세스 자원과 주소 공간을 분리하는 성질을 뜻하므로 세 역할을 구분해야 합니다."
tags: [protection, isolation, privilege]
