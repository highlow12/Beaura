schemaVersion: 1
id: os.protection.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "읽기 전용 페이지에 쓰기를 막는 것은 페이지의 ___ 검사입니다."
choices:
  - "접근 권한"
  - "파일 확장자"
  - "정렬 순서"
acceptedAnswers:
  - "접근 권한"
explanation:
  - type: text
    text: "읽기 전용 코드 페이지에 쓰기를 시도하면 주소 변환 과정의 권한 검사에서 예외가 납니다. 사용자 모드에서 장치 제어 같은 특권 명령을 실행할 수도 없습니다. 파일 쓰기는 시스템 호출로 커널에 요청해야 합니다."
tags: [protection, isolation, privilege]
difficulty: 2
