schemaVersion: 1
id: os.protection.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "권한과 프로세스 격리에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "페이지 권한은 읽기·쓰기·실행 접근을 구분할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "특권 작업은 일반 프로그램이 직접 하지 않고 커널 경계를 통해 요청한다."
  - id: wrong-a
    content:
      - type: text
        text: "읽기 전용 페이지는 CPU가 어떤 모드에서든 쓰기를 허용한다."
  - id: wrong-b
    content:
      - type: text
        text: "프로세스 격리는 권한 오류와 메모리 오류를 전혀 막지 못한다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "페이지 권한은 읽기·쓰기·실행 접근을 구분할 수 있다. 특권 작업은 일반 프로그램이 직접 하지 않고 커널 경계를 통해 요청한다."
  - type: text
    text: "세밀한 권한은 보안을 높이지만 검사·설정·디버깅 복잡도가 증가합니다. 격리를 강하게 하면 안전하지만 프로세스 간 공유와 통신 비용이 커질 수 있습니다."
tags: [protection, isolation, privilege]
difficulty: 3
