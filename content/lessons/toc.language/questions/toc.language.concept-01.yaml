  - id: single-symbol
    content:
      - type: text
        text: 사용할 수 있는 기호 하나를 뜻한다.
  - id: machine-state
    content:
      - type: text
        text: 오토마톤이 입력을 읽는 동안의 현재 위치다.
  - id: input-number
    content:
      - type: text
        text: 문자열의 길이를 나타내는 숫자다.
correctOptionId: set-of-strings
