  - type: text
    text: "고유 문제는 행렬 변환을 특별한 벡터와 그에 곱해지는 배율의 쌍으로 분석합니다."
  - type: text
    text: "λ=0일 때도 0이 아닌 고유벡터가 존재할 수 있지만 변환 결과는 영벡터가 됩니다."
