schemaVersion: 1
id: os.kernel-space.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "커널 공간과 사용자 공간에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "사용자 공간 코드가 장치에 접근할 때 커널의 중재가 필요하다."
  - id: correct-b
    content:
      - type: text
        text: "권한 모드는 다른 프로세스의 메모리를 함부로 읽지 못하게 하는 데 쓰인다."
  - id: wrong-a
    content:
      - type: text
        text: "사용자 공간 프로그램은 어떤 특권 명령도 제한 없이 실행한다."
  - id: wrong-b
    content:
      - type: text
        text: "커널 공간과 사용자 공간은 주소와 권한 구분이 전혀 없다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "사용자 공간 코드가 장치에 접근할 때 커널의 중재가 필요하다. 권한 모드는 다른 프로세스의 메모리를 함부로 읽지 못하게 하는 데 쓰인다."
  - type: text
    text: "권한 분리는 안전성을 높이지만 모드 전환과 검사가 비용을 만듭니다. 커널에 기능을 많이 넣으면 빠를 수 있어도 오류가 전체 시스템에 미치는 영향이 커집니다."
tags: [kernel, user-space, protection]
difficulty: 2
