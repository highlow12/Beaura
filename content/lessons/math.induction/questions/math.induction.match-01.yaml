    text: "귀납법의 각 용어는 시작, 가정, 한 단계 전진, 다음 명제라는 역할을 가집니다."
  - type: text
    text: "귀납 가정과 결론 P(k+1)을 같은 식으로 쓰지 않도록 인덱스를 구분하세요."
