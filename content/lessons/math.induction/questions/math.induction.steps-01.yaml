schemaVersion: 1
id: math.induction.steps-01
revision: 2
type: ordering
prompt:
  - type: text
    text: "수학적 귀납법의 일반 흐름을 배열하세요."
items:
  - id: base
    content:
      - type: text
        text: "시작 값에서 P(1)을 증명한다"
  - id: inductive-step
    content:
      - type: text
        text: "임의의 k에서 P(k)를 가정해 P(k+1)을 증명한다"
  - id: generalize
    content:
      - type: text
        text: "두 단계로 모든 자연수에 대해 결론낸다"
correctOrder:
  - base
  - inductive-step
  - generalize
unorderedGroups:
  - [base, inductive-step]
explanation:
  - type: text
    text: "기초 단계와 귀납 단계는 순서를 바꿔 증명할 수 있습니다. 두 단계가 모두 성립한 뒤에야 모든 자연수로 결론을 일반화할 수 있습니다."
  - type: text
    text: "k를 특정 숫자로 고정하지 않고 임의의 자연수로 다루는 것이 중요합니다."
tags:
  - discrete-math
  - proof
  - proof-steps
difficulty: 2
