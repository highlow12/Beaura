schemaVersion: 1
id: math.induction.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "귀납 증명에 반드시 필요한 요소를 모두 고르세요."
options:
  - id: base
    content:
      - type: text
        text: "기초 단계"
  - id: hypothesis
    content:
      - type: text
        text: "임의의 k에서 P(k)를 가정하는 귀납 가정"
  - id: step
    content:
      - type: text
        text: "P(k)에서 P(k+1)을 보이는 단계"
  - id: sample
    content:
      - type: text
        text: "몇 개의 예시 계산"
correctOptionIds: [base, hypothesis, step]
shuffleOptions: true
explanation:
  - type: text
    text: "기초 단계와 귀납 가정·귀납 단계가 함께 있어야 모든 자연수로 확장됩니다."
  - type: text
    text: "예시는 패턴을 찾는 데 도움을 주지만 귀납 증명의 필수 요소는 아닙니다."
tags:
  - discrete-math
  - proof
  - induction
difficulty: 2
