id: prob.independence.term-01
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "A와 B가 독립이고 P(B)>0이면 P(A|B)는 P(___)와 같습니다."
choices:
  - "A"
  - "B"
  - "A∩B"
acceptedAnswers:
  - "A"
explanation:
  - type: text
    text: "P(B)>0일 때 B에 대한 정보가 A의 확률을 바꾸지 않으므로 P(A|B)=P(A)입니다."
  - type: text
    text: "확률 0인 조건에서는 조건부 확률 자체가 정의되지 않으므로 곱셈식으로 독립성을 표현합니다."
tags:
  - probability-statistics
  - independence
  - conditional
difficulty: 1
