schemaVersion: 1
id: prob.independence.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "독립 사건에 대한 옳은 설명을 모두 고르세요."
options:
  - id: conditional-same
    content:
      - type: text
        text: "P(A|B)=P(A)이다"
  - id: product
    content:
      - type: text
        text: "P(A∩B)=P(A)P(B)이다"
  - id: coin
    content:
      - type: text
        text: "복원 추출은 독립 모델이 될 수 있다"
  - id: mutually-exclusive
    content:
      - type: text
        text: "서로 배반인 사건은 항상 독립이다"
correctOptionIds: [conditional-same, product, coin]
shuffleOptions: true
explanation:
  - type: text
    text: "독립은 조건을 알아도 확률이 변하지 않는 성질이며 복원 추출에서는 구성이 유지됩니다."
  - type: text
    text: "배반과 독립은 다른 개념이고 양의 확률 사건에서는 함께 성립할 수 없습니다."
tags:
  - probability-statistics
  - independence
  - properties
difficulty: 2
