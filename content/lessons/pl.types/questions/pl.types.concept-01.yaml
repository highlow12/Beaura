schemaVersion: 1
id: pl.types.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 정적 타입 언어(static typing)에 대한 설명으로 맞는 것은 무엇인가요?
options:
  - id: before-run
    content:
      - type: text
        text: 보통 실행 전에 프로그램의 타입 제약을 검사한다.
  - id: never-change
    content:
      - type: text
        text: 실행 중 변수의 값이 절대 바뀌지 않는다.
  - id: no-types
    content:
      - type: text
        text: 모든 값의 타입을 무시하고 연산한다.
  - id: runtime-only
    content:
      - type: text
        text: 실행 중에만 타입을 검사하고 컴파일 전에는 검사하지 않는다.
correctOptionId: before-run
shuffleOptions: true
explanation:
  - type: text
    text: 정적은 타입 오류를 주로 실행 전에 찾는다는 뜻이지, 값이 변하지 않거나 타입이 영원히 고정된다는 뜻은 아닙니다.
tags:
  - programming-languages
  - types
  - static-typing
difficulty: 1
