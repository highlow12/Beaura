id: ds.deque.steps-01
type: ordering
prompt:
  - type: text
    text: 덱의 양 끝 연산을 실행하는 순서를 배열하세요.
items:
  - id: choose-operation
    content:
      - type: text
        text: 앞·뒤 중 사용할 끝과 삽입·삭제 종류를 정한다
  - id: update
    content:
      - type: text
        text: 선택한 연산에 맞게 덱의 끝 상태를 갱신한다
  - id: continue
    content:
      - type: text
        text: 다음 양 끝 요청을 처리한다
correctOrder:
  - choose-operation
  - update
  - continue
explanation:
  - type: text
    text: 덱 연산은 끝과 삽입·삭제를 함께 정한 뒤 상태를 갱신합니다. 요청마다 다음 연산을 처리합니다.
schemaVersion: 1
revision: 2
tags:
  - queue
  - deque
difficulty: 2
