schemaVersion: 1
id: algo.mst.steps-01
revision: 1
type: ordering
prompt:
- type: text
  text: 신장 트리가 완성되는 선택 과정을 순서대로 배열하세요.
items:
- id: start
  content:
  - type: text
    text: 선택한 정점 또는 정점 묶음을 준비한다
- id: candidate
  content:
  - type: text
    text: 현재 묶음과 바깥을 잇는 간선을 살핀다
- id: safe
  content:
  - type: text
    text: 사이클을 만들지 않는 가장 가벼운 간선을 고른다
- id: repeat
  content:
  - type: text
    text: 모든 정점이 연결될 때까지 반복한다
correctOrder:
- start
- candidate
- safe
- repeat
explanation:
- type: text
  text: MST 알고리즘은 연결을 유지하면서 안전한 간선을 하나씩 선택해 V - 1개를 채웁니다.
tags:
- graph
- mst
- execution-order
difficulty: 2
