type: code-output
prompt:
  - type: text
    text: 다음 함수는 재귀 하강 파서가 숫자 토큰을 하나씩 더하는 과정을 단순화합니다. 출력은 무엇인가요?
language: python
code: |-
  tokens = [2, 3, 4]
  total = 0
  for token in tokens:
      total += token
  print(total)
choices:
  - "9"
  - "24"
  - "7"
acceptedOutputs:
