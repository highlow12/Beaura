schemaVersion: 1
id: os.address-space.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "두 프로세스의 같은 가상 주소가 서로 다른 물리 위치를 가리킬 수 있는 이유는 ___이 다르기 때문입니다."
choices:
  - "페이지 매핑"
  - "파일 이름"
  - "CPU 주파수"
acceptedAnswers:
  - "페이지 매핑"
explanation:
  - type: text
    text: "같은 가상 주소 `0x1000`을 두 프로세스가 사용해도 서로 다른 물리 프레임에 매핑하면 데이터가 섞이지 않습니다. 코드 영역(text)은 실행할 명령어, 힙(heap)은 동적 할당, 스택(stack)은 호출 프레임을 담습니다. 주소를 읽거나 쓸 때는 변환 결과뿐 아니라 해당 접근 권한도 확인합니다."
tags: [process, virtual-memory, address-space]
difficulty: 2
