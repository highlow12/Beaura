schemaVersion: 1
id: os.address-space.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "프로세스 주소 공간에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "힙은 동적 할당에, 스택은 함수 호출 프레임에 주로 사용된다."
  - id: correct-b
    content:
      - type: text
        text: "프로세스마다 가상 주소 매핑을 달리하면 메모리 격리가 가능하다."
  - id: wrong-a
    content:
      - type: text
        text: "가상 주소와 물리 주소는 모든 시스템에서 항상 숫자가 같다."
  - id: wrong-b
    content:
      - type: text
        text: "코드 영역은 실행 중 절대 읽기 전용으로 보호할 수 없다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "힙은 동적 할당에, 스택은 함수 호출 프레임에 주로 사용된다. 프로세스마다 가상 주소 매핑을 달리하면 메모리 격리가 가능하다."
  - type: text
    text: "주소 공간 분리는 보호와 프로그래밍 편의를 제공하지만 매핑 자료구조와 변환 비용이 필요합니다. 영역 사이 빈 공간은 잘못된 접근을 빠르게 잡는 보호 경계가 됩니다."
tags: [process, virtual-memory, address-space]
difficulty: 3
