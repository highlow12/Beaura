schemaVersion: 1
id: arch.memory.ordering-04
revision: 2
type: ordering
prompt:
  - type: text
    text: "캐시로 사용하는 SRAM과 주기억장치로 사용하는 DRAM을 빠른 순서대로 배열하세요."
items:
  - id: sram
    content:
      - type: text
        text: "SRAM 캐시"
  - id: dram
    content:
      - type: text
        text: "DRAM 주기억장치"
correctOrder: [sram, dram]
explanation:
  - type: text
    text: "일반적으로 CPU 가까이의 SRAM 캐시가 DRAM 주기억장치보다 빠릅니다."
  - type: text
    text: "DRAM refresh는 모든 읽기 직후에 수행되는 고정 단계가 아니라, 데이터 보존을 위해 각 행을 일정 시간 안에 갱신하도록 관리되는 별도 작업입니다."
tags: [memory, sram, dram]
difficulty: 2
