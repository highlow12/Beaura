schemaVersion: 1
id: arch.memory.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "SRAM과 DRAM의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: address
    content:
      - type: text
        text: "행과 열 주소로 셀 위치를 선택한다"
  - id: sense
    content:
      - type: text
        text: "셀의 전하나 논리 상태를 읽는다"
  - id: refresh
    content:
      - type: text
        text: "DRAM이면 약해진 전하를 다시 보충한다"
correctOrder: [address, sense, refresh]
explanation:
  - type: text
    text: "행과 열 주소로 셀 위치를 선택한다 단계가 먼저이고, 그 결과를 이용해 셀의 전하나 논리 상태를 읽는다 단계가 이어집니다."
  - type: text
    text: "DRAM이면 약해진 전하를 다시 보충한다 단계에서 최종 결과가 다음 회로 또는 프로그램으로 전달됩니다."
tags: [memory, sram, dram]
difficulty: 3
