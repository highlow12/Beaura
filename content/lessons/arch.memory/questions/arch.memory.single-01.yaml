schemaVersion: 1
id: arch.memory.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "SRAM과 DRAM에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "SRAM은 빠른 대신 셀 면적이 크고, DRAM은 조밀한 대신 refresh가 필요하다."
  - id: wrong-a
    content:
      - type: text
        text: "DRAM은 전원이 꺼져도 내용을 영구 보존한다."
  - id: wrong-b
    content:
      - type: text
        text: "SRAM과 DRAM은 저장 셀과 접근 특성이 완전히 같다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "SRAM은 빠른 대신 셀 면적이 크고, DRAM은 조밀한 대신 refresh가 필요하다."
  - type: text
    text: "SRAM은 플립플롭과 비슷한 회로로 상태를 유지해 빠르지만 셀 면적이 큽니다. DRAM은 커패시터의 전하로 비트를 저장해 조밀하지만 주기적 refresh가 필요합니다."
tags: [memory, sram, dram]
difficulty: 2
