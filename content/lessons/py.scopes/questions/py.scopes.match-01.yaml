id: py.scopes.match-01
type: matching
prompt:
- type: text
  text: 스코프 관련 이름과 의미를 연결하세요.
leftItems:
- id: parameter
  content:
  - type: text
    text: 함수 매개변수
- id: local
  content:
  - type: text
    text: 함수 안에서 대입한 이름
- id: global
  content:
  - type: text
    text: 함수 바깥에서 만든 이름
rightItems:
- id: input
  content:
  - type: text
    text: 호출 시 지역 공간으로 들어오는 입력
- id: inside
  content:
  - type: text
    text: 해당 호출 안에서만 기본적으로 보이는 이름
- id: outside
  content:
  - type: text
    text: 모듈의 최상위 범위에 있는 이름
correctPairs:
- leftId: parameter
  rightId: input
- leftId: local
  rightId: inside
- leftId: global
  rightId: outside
explanation:
- type: text
  text: 매개변수와 함수 안의 대입 이름은 지역 스코프에 놓입니다. 함수 바깥의 전역 이름은 지역에 같은 이름이 없을 때 찾아집니다.
schemaVersion: 1
revision: 2
tags:
