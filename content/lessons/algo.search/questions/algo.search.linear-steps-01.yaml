schemaVersion: 1
id: algo.search.linear-steps-01
revision: 2
type: ordering
prompt:
  - type: text
    text: 선형 탐색으로 target을 찾는 과정을 순서대로 배열하세요.
items:
  - id: inspect
    content:
      - type: text
        text: 현재 위치의 원소를 확인한다
  - id: compare
    content:
      - type: text
        text: 원소가 target과 같은지 비교한다
  - id: decide
    content:
      - type: text
        text: 같으면 위치를 반환하고, 다르면 다음 위치에서 비교를 반복한다. 끝까지 없으면 찾지 못했다고 보고한다
correctOrder:
  - inspect
  - compare
  - decide
explanation:
  - type: text
    text: 현재 원소를 확인하고 target과 비교합니다. 일치하면 반환하고, 아니면 다음 원소로 이동합니다. 끝까지 확인해도 없으면 찾지 못한 것으로 보고합니다.
tags:
  - search
  - linear-search
  - execution-order
difficulty: 2
