schemaVersion: 1
id: algo.search.binary-range-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 정렬된 [2, 4, 6, 8, 10, 12, 14]에서 10을 찾습니다. 가운데 값 8을 확인한 직후 다음 후보 범위는 무엇인가요?
options:
  - id: right-half
    content:
      - type: text
        text: '[10, 12, 14]'
  - id: left-half
    content:
      - type: text
        text: '[2, 4, 6]'
  - id: include-mid
    content:
      - type: text
        text: '[8, 10, 12, 14]'
correctOptionId: right-half
shuffleOptions: true
explanation:
  - type: text
    text: 목표 10은 가운데 값 8보다 크므로 8 이하의 범위는 버리고 오른쪽 절반만 남깁니다.
tags:
  - search
  - binary-search
  - bounds
difficulty: 2
