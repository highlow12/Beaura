    content:
      - type: text
        text: "∂f/∂x"
  - id: partial-y
    content:
      - type: text
        text: "∂f/∂y"
  - id: fixed
    content:
      - type: text
        text: "고정 변수"
  - id: mixed
    content:
      - type: text
        text: "혼합 편미분"
