schemaVersion: 1
id: calc.partial-derivatives.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "f(x,y)=x²+3xy에 대한 옳은 식을 모두 고르세요."
options:
  - id: dx
    content:
      - type: text
        text: "∂f/∂x=2x+3y"
  - id: dy
    content:
      - type: text
        text: "∂f/∂y=3x"
  - id: y-constant
    content:
      - type: text
        text: "x로 미분할 때 y는 상수로 본다"
  - id: dx-wrong
    content:
      - type: text
        text: "∂f/∂x=2x+3x"
correctOptionIds: [dx, dy, y-constant]
shuffleOptions: true
explanation:
  - type: text
    text: "x 미분에서는 3xy의 y를 상수로 보아 3y가 되고, y 미분에서는 3x가 됩니다."
  - type: text
    text: "각 편미분에서 고정하는 변수를 명시하면 항의 계수를 놓치지 않습니다."
tags:
  - calculus
  - multivariable
  - calculation
difficulty: 2
