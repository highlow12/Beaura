schemaVersion: 1
id: db.normalization.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: 정규화 설계의 올바른 설명을 모두 고르세요.
options:
  - id: anomalies
    content:
      - type: text
        text: 중복을 줄이면 삽입·삭제·갱신 이상을 줄이는 데 도움이 된다
  - id: lossless
    content:
      - type: text
        text: 분해한 테이블은 필요한 정보를 JOIN으로 손실 없이 복원할 수 있어야 한다
  - id: tradeoff
    content:
      - type: text
        text: 정규화 정도는 질의 패턴과 JOIN 비용을 고려해 판단할 수 있다
  - id: atomic-list
    content:
      - type: text
        text: 1NF에서는 한 셀에 여러 독립 값을 목록으로 저장하는 것이 권장된다
correctOptionIds: [anomalies, lossless, tradeoff]
shuffleOptions: true
explanation:
  - type: text
    text: 정규화는 이상을 줄이고 lossless join을 지향하지만, 실제 시스템에서는 읽기 비용과 모델의 명확성도 함께 판단합니다. 1NF는 목록을 한 셀에 넣지 않습니다.
tags: [database, normalization]
difficulty: 3
