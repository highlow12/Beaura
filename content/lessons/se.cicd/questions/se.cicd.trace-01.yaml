schemaVersion: 1
id: se.cicd.trace-01
revision: 2
type: code-output
prompt:
  - type: text
    text: 빌드는 성공했지만 테스트가 실패한 CI/CD 파이프라인입니다. 다음 코드의 출력은 무엇인가요?
language: python
code: |-
  steps = [("build", True), ("test", False), ("deploy", True)]
  for name, passed in steps:
      if not passed:
          print(f"stopped:{name}")
          break
choices:
  - stopped:test
  - stopped:build
  - stopped:deploy
acceptedOutputs:
  - stopped:test
explanation:
  - type: text
    text: build는 통과하지만 test가 False이므로 stopped:test를 출력하고 반복문을 중단합니다. deploy 단계는 실행되지 않습니다. 실패한 검증을 통과한 것으로 처리해 배포하면 안 됩니다.
tags:
  - software-engineering
  - cicd
  - code-trace
difficulty: 1
