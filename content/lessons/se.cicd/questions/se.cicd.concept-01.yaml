schemaVersion: 1
id: se.cicd.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: CI의 핵심 목적을 가장 잘 설명한 것은 무엇인가요?
options:
  - id: frequent-feedback
    content:
      - type: text
        text: 변경을 자주 통합하고 자동 검증으로 빠른 피드백을 얻는다.
  - id: manual-build
    content:
      - type: text
        text: 운영 서버에서만 수동으로 빌드한다.
  - id: deploy-without-test
    content:
      - type: text
        text: 테스트 없이 모든 커밋을 즉시 배포한다.
  - id: archive-only
    content:
      - type: text
        text: 소스 파일을 백업만 하고 변경을 검증하지 않는다.
correctOptionId: frequent-feedback
shuffleOptions: true
explanation:
  - type: text
    text: CI는 작은 변경을 자주 합치고 자동 빌드·테스트로 통합 문제를 일찍 발견하는 실천입니다.
tags:
  - software-engineering
  - cicd
  - continuous-integration
difficulty: 1
