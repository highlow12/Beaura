schemaVersion: 1
id: se.cicd.match-01
revision: 1
type: matching
prompt:
  - type: text
    text: CI/CD 파이프라인의 용어와 역할을 연결하세요.
leftItems:
  - id: ci
    content:
      - type: text
        text: CI
  - id: artifact
    content:
      - type: text
        text: 산출물
  - id: gate
    content:
      - type: text
        text: 승인 게이트
rightItems:
