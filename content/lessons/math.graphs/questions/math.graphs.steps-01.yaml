schemaVersion: 1
id: math.graphs.steps-01
revision: 2
type: ordering
prompt:
  - type: text
    text: "간선 목록에서 정점 v의 무방향 차수를 세는 절차를 배열하세요."
items:
  - id: scan
    content:
      - type: text
        text: "모든 간선을 하나씩 살핀다"
  - id: check
    content:
      - type: text
        text: "간선의 어느 끝점에 v가 있는지 확인한다"
  - id: count
    content:
      - type: text
        text: "v에 한 끝점만 붙은 간선은 1, 자기 루프는 2를 더한다"
  - id: report
    content:
      - type: text
        text: "최종 카운트를 차수로 보고한다"
correctOrder:
  - scan
  - check
  - count
  - report
explanation:
  - type: text
    text: "각 간선의 양 끝점 중 v에 닿는 끝점 수를 합하면 차수입니다. 자기 루프의 두 끝점은 모두 v에 닿으므로 2를 더합니다."
  - type: text
    text: "일반적인 무방향 그래프의 차수는 루프를 두 번 셉니다."
tags:
  - discrete-math
  - graphs
  - degree-count
difficulty: 2
