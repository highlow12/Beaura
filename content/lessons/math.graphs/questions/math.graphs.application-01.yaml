schemaVersion: 1
id: math.graphs.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "무방향 그래프에서 정점 v의 차수에 포함되는 것을 모두 고르세요."
options:
  - id: incident-one
    content:
      - type: text
        text: "v에 한 끝점이 붙은 간선"
  - id: incident-two
    content:
      - type: text
        text: "v와 이웃을 연결하는 간선"
  - id: outgoing
    content:
      - type: text
        text: "방향 그래프에서 v에서 나가는 간선만"
  - id: unrelated
    content:
      - type: text
        text: "v와 무관한 간선"
correctOptionIds: [incident-one, incident-two]
shuffleOptions: true
explanation:
  - type: text
    text: "무방향 그래프의 차수는 정점에 incident한 간선의 수입니다."
  - type: text
    text: "나가는 방향만 세는 개념은 방향 그래프의 outdegree에 해당합니다."
tags:
  - discrete-math
  - graphs
  - degree
difficulty: 2
