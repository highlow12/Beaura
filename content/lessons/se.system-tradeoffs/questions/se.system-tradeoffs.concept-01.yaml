schemaVersion: 1
id: se.system-tradeoffs.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 시스템 설계에서 트레이드오프를 다루는 가장 좋은 출발점은 무엇인가요?
options:
  - id: measurable-requirements
    content:
      - type: text
        text: 품질 목표와 허용 범위를 측정 가능한 요구사항으로 적는다.
  - id: maximize-everything
    content:
      - type: text
        text: 모든 품질 속성을 비용과 제약 없이 최대로 만든다.
  - id: copy-popular
    content:
      - type: text
        text: 다른 서비스의 구조를 맥락 없이 그대로 복사한다.
  - id: ignore-failure
    content:
      - type: text
        text: 정상 상황만 보고 장애 시 결과는 고려하지 않는다.
correctOptionId: measurable-requirements
shuffleOptions: true
explanation:
  - type: text
    text: 요구사항을 지연 시간·오류율·일관성 수준처럼 측정 가능하게 써야 대안의 이점과 비용을 비교할 수 있습니다.
tags:
  - software-engineering
  - system-design
  - tradeoffs
difficulty: 2
