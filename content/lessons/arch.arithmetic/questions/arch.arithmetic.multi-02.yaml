schemaVersion: 1
id: arch.arithmetic.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "이진 산술과 오버플로에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "4비트 부호 없는 수에서 15에 1을 더하면 저장된 비트는 0000이 된다."
  - id: correct-b
    content:
      - type: text
        text: "1+1의 현재 자리는 0이고 다음 자리로 carry 1을 전달한다."
  - id: wrong-a
    content:
      - type: text
        text: "이진수에서 1+1은 현재 자리에 2를 그대로 기록한다."
  - id: wrong-b
    content:
      - type: text
        text: "비트 폭이 고정되어도 결과의 모든 상위 비트가 자동으로 보존된다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "4비트 부호 없는 수에서 15에 1을 더하면 저장된 비트는 0000이 된다. 1+1의 현재 자리는 0이고 다음 자리로 carry 1을 전달한다."
  - type: text
    text: "비트 폭을 늘리면 표현 범위가 커지지만 회로와 저장 공간이 늘어납니다. 부호 없는 오버플로와 2의 보수 부호 오버플로는 판정 규칙이 다르므로 구분해야 합니다."
tags: [binary-arithmetic, carry, overflow]
difficulty: 3
