schemaVersion: 1
id: net.subnet.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "서브넷과 CIDR의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: mask
    content:
      - type: text
        text: "CIDR 프리픽스 길이로 마스크를 만든다"
  - id: and
    content:
      - type: text
        text: "IP 주소와 마스크를 AND해 네트워크 주소를 계산한다"
  - id: range
    content:
      - type: text
        text: "호스트·브로드캐스트 범위를 판정한다"
correctOrder: [mask, and, range]
explanation:
  - type: text
    text: "CIDR 프리픽스 길이로 마스크를 만든다 단계가 먼저이고, 그 결과를 이용해 IP 주소와 마스크를 AND해 네트워크 주소를 계산한다 단계가 이어집니다."
  - type: text
    text: "호스트·브로드캐스트 범위를 판정한다 단계에서 결과가 다음 네트워크 계층이나 응용으로 전달됩니다."
tags: [subnet, cidr, ipv4]
difficulty: 3
