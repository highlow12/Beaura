schemaVersion: 1
id: calc.integrals.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "부정적분에 대한 옳은 설명을 모두 고르세요."
options:
  - id: antiderivative
    content:
      - type: text
        text: "도함수가 원래 함수가 되는 원시함수를 찾는다"
  - id: constant
    content:
      - type: text
        text: "적분상수 C가 포함된다"
  - id: many
    content:
      - type: text
        text: "같은 도함수를 갖는 함수가 여러 개일 수 있다"
  - id: bounds
    content:
      - type: text
        text: "항상 구간 끝점이 필요하다"
correctOptionIds: [antiderivative, constant, many]
shuffleOptions: true
explanation:
  - type: text
    text: "부정적분은 구간 없이 원시함수의 일반형을 구하므로 C가 필요합니다."
  - type: text
    text: "끝점이 있는 정적분은 별도의 값으로 계산합니다."
tags:
  - calculus
  - integrals
  - indefinite
difficulty: 2
