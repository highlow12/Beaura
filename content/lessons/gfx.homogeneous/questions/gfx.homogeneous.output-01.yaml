type: code-output
prompt:
  - type: text
    text: 3차원 클립 좌표를 w로 나누어 NDC를 구하는 코드의 출력 결과를 고르세요.
language: python
code: |-
  clip = (1, 1, 1, 2)
  w = clip[3]
  ndc = (clip[0] / w, clip[1] / w, clip[2] / w)
  print(ndc)
choices: ["(0.5, 0.5, 0.5)", "(1, 1, 1)", "(2, 2, 2)"]
acceptedOutputs: ["(0.5, 0.5, 0.5)"]
explanation:
  - type: text
    text: 클립 좌표는 네 성분이고 마지막 w=2입니다. x, y, z 각각 1/2=0.5가 되어 Python 출력은 (0.5, 0.5, 0.5)입니다.
