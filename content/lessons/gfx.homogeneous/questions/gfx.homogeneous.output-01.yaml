type: code-output
prompt:
  - type: text
    text: 동차좌표를 w로 나누는 간단한 코드의 출력 결과를 고르세요.
language: python
code: |-
  clip = (6, 4, 2)
  w = clip[2]
  ndc = (clip[0] / w, clip[1] / w)
  print(ndc)
choices: ["(3.0, 2.0)", "(6, 4)", "(12, 8)"]
acceptedOutputs: ["(3.0, 2.0)"]
explanation:
  - type: text
    text: x와 y를 w=2로 나누므로 각각 3.0과 2.0이 됩니다. Python의 `/`는 이 경우 실수 결과를 출력합니다.
