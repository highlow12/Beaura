    text: 2×2 텍스처에서 UV (1, 0)에 해당하는 값을 단순히 정수 인덱스로 읽은 결과를 고르세요.
language: python
code: |-
  texture = [["red", "green"], ["blue", "white"]]
  u, v = 1, 0
  print(texture[v][u])
