schemaVersion: 1
id: os.thread.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "같은 프로세스의 스레드들이 공유하는 동적 객체 영역은 ___입니다."
choices:
  - "힙"
  - "각자의 호출 스택"
  - "각자의 프로그램 카운터"
acceptedAnswers:
  - "힙"
explanation:
  - type: text
    text: "한 프로세스의 두 스레드는 코드와 힙을 공유하지만 각자의 프로그램 카운터와 호출 스택을 가집니다. 두 스레드가 같은 힙 카운터를 갱신한다면 순서가 섞일 수 있으므로 동기화가 필요합니다. 스레드를 새로 만들었다는 사실만으로 안전성이 보장되지는 않습니다."
tags: [thread, concurrency, shared-memory]
difficulty: 2
