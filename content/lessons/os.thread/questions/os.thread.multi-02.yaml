schemaVersion: 1
id: os.thread.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "스레드와 동시성에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "스레드 간 공유 힙 접근은 동기화가 필요할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "스레드는 프로세스 전체를 복제하지 않고도 여러 실행 흐름을 만들 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "스레드는 언제나 순차적으로만 실행되므로 실행 순서가 고정이다."
  - id: wrong-b
    content:
      - type: text
        text: "스레드 수를 늘리면 코어 수와 무관하게 항상 속도가 빨라진다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "스레드 간 공유 힙 접근은 동기화가 필요할 수 있다. 스레드는 프로세스 전체를 복제하지 않고도 여러 실행 흐름을 만들 수 있다."
  - type: text
    text: "스레드는 생성과 통신이 프로세스보다 가볍지만 공유 메모리 때문에 오류가 복잡합니다. 코어 수보다 스레드를 지나치게 늘리면 스위치와 경합이 오히려 성능을 낮춥니다."
tags: [thread, concurrency, shared-memory]
difficulty: 3
