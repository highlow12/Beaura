schemaVersion: 1
id: math.sets.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "A={1, 2, 3}일 때 참인 문장은 무엇인가요?"
options:
  - id: member
    content:
      - type: text
        text: "2 ∈ A"
  - id: not-member
    content:
      - type: text
        text: "4 ∈ A"
  - id: set-member
    content:
      - type: text
        text: "{2} ∈ A"
  - id: empty
    content:
      - type: text
        text: "A = ∅"
correctOptionId: member
shuffleOptions: true
explanation:
  - type: text
    text: "2는 A의 원소이므로 2 ∈ A입니다."
  - type: text
    text: "{2}는 원소 2를 담은 별도의 집합이라서 원소 관계와 혼동하면 안 됩니다."
tags:
  - discrete-math
  - sets
  - membership
difficulty: 1
