schemaVersion: 1
id: la.vectors.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "벡터 (2,−1)에 대한 옳은 설명을 모두 고르세요."
options:
  - id: x-two
    content:
      - type: text
        text: "x방향 성분은 2이다"
  - id: y-minus
    content:
      - type: text
        text: "y방향 성분은 −1이다"
  - id: right-down
    content:
      - type: text
        text: "오른쪽과 아래쪽 성분을 가진다"
  - id: scalar
    content:
      - type: text
        text: "스칼라이므로 방향이 없다"
correctOptionIds: [x-two, y-minus, right-down]
shuffleOptions: true
explanation:
  - type: text
    text: "첫 성분 2는 x축, 둘째 성분 −1은 y축의 변화를 뜻합니다."
  - type: text
    text: "음수 성분은 해당 축의 양의 방향과 반대쪽으로 움직인다는 뜻입니다."
tags:
  - linear-algebra
  - vectors
  - components
difficulty: 2
