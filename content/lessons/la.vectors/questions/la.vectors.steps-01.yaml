schemaVersion: 1
id: la.vectors.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "벡터에 스칼라 −2를 곱하는 개념적 순서를 배열하세요."
items:
  - id: choose
    content:
      - type: text
        text: "스칼라 −2를 정한다"
  - id: multiply
    content:
      - type: text
        text: "모든 성분에 −2를 곱한다"
  - id: reverse
    content:
      - type: text
        text: "음수 때문에 방향이 반대가 됨을 확인한다"
  - id: magnitude
    content:
      - type: text
        text: "크기가 2배가 됨을 확인한다"
correctOrder:
  - choose
  - multiply
  - reverse
  - magnitude
explanation:
  - type: text
    text: "먼저 모든 성분에 스칼라를 적용하면 음수의 방향 반전과 절댓값 2의 크기 변화를 읽을 수 있습니다."
  - type: text
    text: "스칼라배의 효과를 부호와 크기로 나누어 확인하면 계산 실수가 줄어듭니다."
tags:
  - linear-algebra
  - vectors
  - scalar-multiplication
difficulty: 2
