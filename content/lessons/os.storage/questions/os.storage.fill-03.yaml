schemaVersion: 1
id: os.storage.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "SSD 셀의 쓰기를 여러 위치에 분산해 마모를 줄이는 기법은 ___입니다."
choices:
  - "wear leveling"
  - "헤드 탐색"
  - "라운드 로빈"
acceptedAnswers:
  - "wear leveling"
explanation:
  - type: text
    text: "HDD의 임의 읽기에서는 헤드가 목표 트랙으로 이동하는 탐색(seek)과 회전 대기가 발생합니다. SSD는 플래시 페이지에 기록하고 더 큰 블록 단위로 지우며, 셀의 마모가 한곳에 몰리지 않도록 wear leveling으로 쓰기를 분산합니다."
tags: [storage, hdd, ssd]
difficulty: 2
