schemaVersion: 1
id: os.storage.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "HDD·SSD와 블록 장치에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "HDD 임의 접근은 탐색·회전 지연의 영향을 받을 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "SSD는 플래시 페이지와 erase 블록, wear leveling을 관리한다."
  - id: wrong-a
    content:
      - type: text
        text: "SSD는 쓰기와 삭제를 동일한 최소 단위로 언제나 처리한다."
  - id: wrong-b
    content:
      - type: text
        text: "블록 계층은 파일시스템과 저장장치 사이의 변환을 하지 않는다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "HDD 임의 접근은 탐색·회전 지연의 영향을 받을 수 있다. SSD는 플래시 페이지와 erase 블록, wear leveling을 관리한다."
  - type: text
    text: "HDD는 대용량 비용이 낮지만 임의 접근이 느립니다. SSD는 낮은 지연과 높은 병렬성을 제공하지만 쓰기 내구성과 삭제 단위 제약을 고려해야 합니다."
tags: [storage, hdd, ssd]
difficulty: 3
