    content:
      - type: text
        text: 현재 상태를 확인한다.
  - id: consume
    content:
      - type: text
        text: 다음 입력 기호를 읽는다.
  - id: lookup
    content:
      - type: text
        text: 상태와 기호에 맞는 전이를 찾는다.
  - id: update
    content:
      - type: text
        text: 다음 상태로 상태값을 갱신한다.
correctOrder:
  - current
  - consume
  - lookup
  - update
explanation:
  - type: text
    text: 전이는 현재 상태와 방금 읽은 기호를 함께 입력으로 사용하므로 두 값을 먼저 확인해야 합니다.
