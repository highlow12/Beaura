schemaVersion: 1
id: algo.connected-components.trace-01
revision: 1
type: code-output
prompt:
- type: text
  text: 다음 코드가 세는 연결 요소의 개수를 고르세요.
language: python
code: |-
  graph = {"A": ["B"], "B": ["A"], "C": []}
  seen = set()
  count = 0
  for node in graph:
      if node not in seen:
          count += 1
          stack = [node]
          while stack:
              current = stack.pop()
              if current in seen:
                  continue
              seen.add(current)
              stack.extend(graph[current])
  print(count)
choices:
- '2'
- '1'
- '3'
acceptedOutputs:
- '2'
explanation:
- type: text
  text: A와 B가 한 요소를 이루고 C가 다른 요소이므로 총 두 번 탐색을 시작합니다.
