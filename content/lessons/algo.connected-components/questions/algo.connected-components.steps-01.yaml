schemaVersion: 1
id: algo.connected-components.steps-01
revision: 1
type: ordering
prompt:
- type: text
  text: 전체 그래프의 연결 요소 수를 세는 순서를 배열하세요.
items:
- id: initialize
  content:
  - type: text
    text: visited와 count를 초기화한다
- id: scan
  content:
  - type: text
    text: 정점을 앞에서부터 확인한다
- id: start
  content:
  - type: text
    text: 방문하지 않은 정점이면 count를 늘리고 탐색을 시작한다
- id: repeat
  content:
  - type: text
    text: 모든 정점을 확인할 때까지 반복한다
correctOrder:
- initialize
- scan
- start
- repeat
explanation:
- type: text
  text: 새 요소의 시작점을 만날 때만 count를 늘립니다. 탐색이 끝난 뒤에도 바깥 반복은 남은 정점을 계속 확인합니다.
tags:
- graph
- connected-components
- execution-order
difficulty: 2
