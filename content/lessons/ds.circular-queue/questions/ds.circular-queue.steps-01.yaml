    text: front와 size로 다음 삽입 위치를 계산한다
- id: wrap
  content:
  - type: text
    text: capacity로 나머지를 취해 순환시킨다
- id: write
  content:
  - type: text
    text: 계산한 칸에 새 값을 쓴다
- id: grow
