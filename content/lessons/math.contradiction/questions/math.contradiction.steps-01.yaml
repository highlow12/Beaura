schemaVersion: 1
id: math.contradiction.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "모순 증명의 표준 흐름을 순서대로 배열하세요."
items:
  - id: negate
    content:
      - type: text
        text: "목표 결론을 부정해 가정한다"
  - id: derive
    content:
      - type: text
        text: "정의와 정리를 이용해 결과를 유도한다"
  - id: conflict
    content:
      - type: text
        text: "서로 양립할 수 없는 두 결과를 찾는다"
  - id: conclude
    content:
      - type: text
        text: "부정 가정이 거짓이므로 원래 결론을 얻는다"
correctOrder:
  - negate
  - derive
  - conflict
  - conclude
explanation:
  - type: text
    text: "부정 가정에서 모순을 만든 뒤 그 가정을 버리고 원래 결론을 확정합니다."
  - type: text
    text: "마지막 귀결을 적지 않으면 모순을 찾은 것과 증명을 끝낸 것을 혼동하게 됩니다."
tags:
  - discrete-math
  - proof
  - proof-steps
difficulty: 2
