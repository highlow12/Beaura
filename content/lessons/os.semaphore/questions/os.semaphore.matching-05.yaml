schemaVersion: 1
id: os.semaphore.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "세마포어와 자원 수의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "wait"
  - id: left-b
    content:
      - type: text
        text: "signal"
  - id: left-c
    content:
      - type: text
        text: "count"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "자원을 얻거나 0이면 기다리는 연산"
  - id: right-b
    content:
      - type: text
        text: "자원을 반환하고 카운터를 늘리는 연산"
  - id: right-c
    content:
      - type: text
        text: "사용 가능한 자원 수를 나타내는 값"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "wait은 자원을 얻거나 0이면 기다리는 연산, signal은 자원을 반환하고 카운터를 늘리는 연산입니다."
  - type: text
    text: "count은 사용 가능한 자원 수를 나타내는 값을 뜻하므로 세 역할을 구분해야 합니다."
tags: [semaphore, synchronization, producer-consumer]
difficulty: 2
