schemaVersion: 1
id: os.semaphore.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "세마포어와 자원 수에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "초기값 3인 세마포어는 동시에 최대 세 단위의 자원을 나타낼 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "wait에서 카운터가 0이면 호출자는 자원을 기다릴 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "signal은 자원을 반납해도 카운터를 절대 증가시키지 않는다."
  - id: wrong-b
    content:
      - type: text
        text: "세마포어의 wait와 signal은 중간에 다른 흐름이 끼어들어도 안전할 필요가 없다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "초기값 3인 세마포어는 동시에 최대 세 단위의 자원을 나타낼 수 있다. wait에서 카운터가 0이면 호출자는 자원을 기다릴 수 있다."
  - type: text
    text: "세마포어는 수량과 순서 신호를 표현하기 좋지만 signal 누락이나 잘못된 초기값은 영원한 대기·초과 접근을 만들 수 있습니다. 소유권이 중요한 단일 잠금에는 뮤텍스가 더 명확합니다."
tags: [semaphore, synchronization, producer-consumer]
difficulty: 3
