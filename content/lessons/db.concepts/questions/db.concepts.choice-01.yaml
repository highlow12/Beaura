schemaVersion: 1
id: db.concepts.choice-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 애플리케이션이 DBMS를 사용하는 가장 중요한 이유는 무엇인가요?
options:
  - id: abstraction
    content:
      - type: text
        text: 저장·질의·동시성의 세부 처리를 관리 계층에 맡길 수 있다
  - id: display
    content:
      - type: text
        text: 모든 데이터를 자동으로 화면에 그려 준다
  - id: no-schema
    content:
      - type: text
        text: 데이터 구조와 제약을 정할 필요가 없어진다
correctOptionId: abstraction
shuffleOptions: true
explanation:
  - type: text
    text: DBMS는 저장 장치와 질의 처리의 세부 사항을 추상화하지만, 애플리케이션의 화면이나 데이터 모델 자체를 대신 설계하지는 않습니다.
tags: [database, dbms]
difficulty: 1
