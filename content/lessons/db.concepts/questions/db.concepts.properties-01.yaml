schemaVersion: 1
id: db.concepts.properties-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: 데이터베이스 시스템의 역할로 올바른 것을 모두 고르세요.
options:
  - id: query
    content:
      - type: text
        text: 조건에 맞는 데이터를 질의하고 결과를 반환한다
  - id: concurrency
    content:
      - type: text
        text: 여러 작업이 동시에 접근할 때 규칙을 제공한다
  - id: recovery
    content:
      - type: text
        text: 장애 뒤에 일관된 상태로 복구할 수 있게 한다
  - id: replace-app
    content:
      - type: text
        text: 애플리케이션의 모든 화면과 사용자 경험을 자동으로 결정한다
correctOptionIds: [query, concurrency, recovery]
shuffleOptions: true
explanation:
  - type: text
    text: DBMS의 핵심은 데이터 접근과 신뢰성 관리입니다. 화면 구성과 사용자 경험은 애플리케이션 계층의 책임입니다.
tags: [database, dbms, concurrency, recovery]
difficulty: 2
