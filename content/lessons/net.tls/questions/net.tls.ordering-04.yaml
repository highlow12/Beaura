schemaVersion: 1
id: net.tls.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "TLS와 인증서의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: handshake
    content:
      - type: text
        text: "알고리즘과 키 교환 정보를 협상한다"
  - id: verify
    content:
      - type: text
        text: "인증서 이름·서명·유효성을 검증한다"
  - id: encrypt
    content:
      - type: text
        text: "세션 키로 데이터와 무결성 태그를 보호한다"
correctOrder: [handshake, verify, encrypt]
explanation:
  - type: text
    text: "알고리즘과 키 교환 정보를 협상한다 단계가 먼저이고, 그 결과를 이용해 인증서 이름·서명·유효성을 검증한다 단계가 이어집니다."
  - type: text
    text: "세션 키로 데이터와 무결성 태그를 보호한다 단계에서 결과가 다음 네트워크 계층이나 응용으로 전달됩니다."
tags: [tls, https, security]
difficulty: 3
