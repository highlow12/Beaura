schemaVersion: 1
id: net.tls.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "TLS와 인증서에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "인증서는 공개키와 도메인 신원을 연결하는 역할을 할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "TLS 세션 데이터는 보통 협상된 대칭 키로 암호화된다."
  - id: wrong-a
    content:
      - type: text
        text: "TLS는 암호화만 하고 메시지 변조 여부는 탐지하지 못한다."
  - id: wrong-b
    content:
      - type: text
        text: "만료된 인증서도 신뢰 체인만 있으면 언제나 안전하다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "인증서는 공개키와 도메인 신원을 연결하는 역할을 할 수 있다. TLS 세션 데이터는 보통 협상된 대칭 키로 암호화된다."
  - type: text
    text: "TLS는 도청과 변조를 줄이지만 핸드셰이크·인증서 갱신·CPU 비용을 추가합니다. 인증서 신뢰 체계가 잘못 관리되면 암호화되어도 엉뚱한 서버와 통신할 수 있습니다."
tags: [tls, https, security]
difficulty: 3
