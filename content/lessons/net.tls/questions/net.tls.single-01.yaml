schemaVersion: 1
id: net.tls.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "TLS와 인증서에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "TLS는 인증서로 상대를 검증하고 세션 키로 통신의 기밀성과 무결성을 보호한다."
  - id: wrong-a
    content:
      - type: text
        text: "TLS는 도메인 이름을 IP로 바꾸는 DNS 캐시의 다른 이름이다."
  - id: wrong-b
    content:
      - type: text
        text: "TLS가 있으면 사용자는 서버 인증서의 이름과 유효 기간을 확인할 필요가 없다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "TLS는 인증서로 상대를 검증하고 세션 키로 통신의 기밀성과 무결성을 보호한다."
  - type: text
    text: "TLS는 핸드셰이크에서 암호 알고리즘과 키를 협상하고 인증서로 서버 공개키의 신원을 검증한 뒤, 세션 키로 데이터를 암호화하는 프로토콜입니다."
tags: [tls, https, security]
difficulty: 2
