type: fill-blank
prompt:
  - type: text
    text: "지연·대역폭·손실에서 핵심이 되는 용어는 ___입니다."
choices:
  - "지연"
  - "권한 비트"
  - "가상 페이지"
acceptedAnswers:
  - "지연"
explanation:
  - type: text
    text: "지연은(는) 이 레슨에서 다룬 핵심 개념입니다."
  - type: text
    text: "지연(latency)은 데이터가 목적지까지 도착하는 데 걸리는 시간이고, 대역폭은 단위 시간에 전달 가능한 최대 비트량입니다. 처리량은 실제로 성공한 데이터 속도이며 손실과 혼잡의 영향을 받습니다."
tags: [network-performance, latency, bandwidth]
difficulty: 2
