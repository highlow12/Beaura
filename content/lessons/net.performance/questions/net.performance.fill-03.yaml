schemaVersion: 1
id: net.performance.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "실제로 성공해 전달된 데이터의 단위 시간당 속도는 ___입니다."
choices:
  - "처리량"
  - "왕복 지연"
  - "패킷 크기"
acceptedAnswers:
  - "처리량"
explanation:
  - type: text
    text: "100Mb/s 링크라도 멀리 떨어진 서버의 한 번 왕복 지연이 80ms일 수 있습니다. 큰 파일을 옮길 때는 대역폭과 실제 처리량을, 작은 요청의 반응은 왕복 지연을 함께 봅니다. 패킷이 손실되면 TCP 재전송 때문에 처리량도 낮아질 수 있습니다."
tags: [network-performance, latency, bandwidth]
difficulty: 2
