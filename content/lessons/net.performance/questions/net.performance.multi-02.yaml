schemaVersion: 1
id: net.performance.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "지연·대역폭·손실에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "큐잉 지연은 링크가 포화될수록 증가할 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "패킷 손실은 TCP 재전송과 실제 처리량 저하로 이어질 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "큰 파일 전송과 대화형 입력은 성능에서 항상 같은 지표만 중요하다."
  - id: wrong-b
    content:
      - type: text
        text: "처리량은 이론 대역폭과 항상 정확히 같다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "큐잉 지연은 링크가 포화될수록 증가할 수 있다. 패킷 손실은 TCP 재전송과 실제 처리량 저하로 이어질 수 있다."
  - type: text
    text: "버퍼를 크게 하면 순간 처리량을 유지할 수 있지만 버퍼블로트로 지연이 커질 수 있습니다. 압축·병렬 연결·혼잡 제어는 대역폭과 지연 사이의 다른 균형을 만듭니다."
tags: [network-performance, latency, bandwidth]
difficulty: 3
