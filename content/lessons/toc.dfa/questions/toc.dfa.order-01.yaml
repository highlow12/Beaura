schemaVersion: 1
id: toc.dfa.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: DFA가 문자열을 수용하는지 판정하는 과정을 올바른 순서로 배열하세요.
items:
  - id: start
    content:
      - type: text
        text: 시작 상태 q₀에 놓인다.
  - id: read
    content:
      - type: text
        text: 입력 기호를 왼쪽부터 하나 읽는다.
  - id: transition
    content:
      - type: text
        text: δ로 현재 상태를 갱신한다.
  - id: accept-check
    content:
      - type: text
        text: 입력이 끝난 뒤 F에 속하는지 확인한다.
correctOrder:
  - start
  - read
  - transition
  - accept-check
explanation:
  - type: text
    text: 모든 기호를 소비한 뒤의 상태만 수용 상태인지 검사하며, 중간에 수용 상태를 만났다는 사실만으로 결정하지 않습니다.
tags:
  - theory-of-computation
  - dfa
  - acceptance
difficulty: 2
