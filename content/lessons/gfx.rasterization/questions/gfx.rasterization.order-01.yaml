schemaVersion: 1
id: gfx.rasterization.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: 삼각형 하나를 래스터화하는 간단한 계산 순서를 배열하세요.
items:
  - id: bounds
    content:
      - type: text
        text: 삼각형의 화면 bounding box를 구한다
  - id: sample
    content:
      - type: text
        text: box 안의 샘플 위치를 선택한다
  - id: inside
    content:
      - type: text
        text: 샘플이 삼각형 안에 있는지 판정한다
  - id: fragment
    content:
      - type: text
        text: 내부 샘플에 fragment 후보를 만든다
correctOrder: [bounds, sample, inside, fragment]
explanation:
  - type: text
    text: bounding box로 후보 범위를 줄인 뒤 각 샘플의 포함 여부를 판정하고, 내부인 위치만 fragment 후보로 넘깁니다.
tags: [graphics, rasterization, order]
