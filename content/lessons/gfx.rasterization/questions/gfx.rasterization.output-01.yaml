schemaVersion: 1
id: gfx.rasterization.output-01
revision: 1
type: code-output
prompt:
  - type: text
    text: bounding box의 정수 샘플 세 개를 검사한 결과를 출력합니다. 결과를 고르세요.
language: python
code: |-
  samples = [(0, 0), (1, 0), (1, 1)]
  inside = [(x, y) for x, y in samples if x + y <= 1]
  print(len(inside))
choices: ["2", "1", "3"]
acceptedOutputs: ["2"]
explanation:
  - type: text
    text: (0, 0)과 (1, 0)은 x+y가 1 이하이고 (1, 1)은 2이므로 내부 후보는 두 개입니다. 실제 edge rule은 구현에 따라 경계를 다르게 처리할 수 있습니다.
tags: [graphics, rasterization, code-output]
difficulty: 2
