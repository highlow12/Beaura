schemaVersion: 1
id: arch.hex.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "16진수와 바이트에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "0xFF는 8비트의 모든 자리가 1인 패턴을 읽기 쉽게 쓴 것이다."
  - id: correct-b
    content:
      - type: text
        text: "두 개의 16진수 자리는 한 바이트와 대응한다."
  - id: wrong-a
    content:
      - type: text
        text: "16진수의 F는 이진수에서 2개의 비트만 뜻한다."
  - id: wrong-b
    content:
      - type: text
        text: "0x 접두사는 숫자를 2진수로 바꾸라는 명령이다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "0xFF는 8비트의 모든 자리가 1인 패턴을 읽기 쉽게 쓴 것이다. 두 개의 16진수 자리는 한 바이트와 대응한다."
  - type: text
    text: "16진수는 저장 형식을 바꾸는 것이 아니라 같은 비트 패턴을 짧게 쓰는 표기입니다. 디버거와 메모리 덤프에서 비트 경계를 빠르게 확인할 때 특히 유용합니다."
tags: [hexadecimal, bits, byte]
difficulty: 2
