schemaVersion: 1
id: pl.code-generation.order-01
revision: 2
type: ordering
prompt:
  - type: text
    text: 간단한 IR 한 줄을 대상으로 코드 생성 작업을 배열하세요.
items:
  - id: analyze-liveness
    content:
      - type: text
        text: 입력 값의 수명과 사용 위치를 확인한다.
  - id: select
    content:
      - type: text
        text: 대상 ISA 명령어 패턴을 선택한다.
  - id: allocate
    content:
      - type: text
        text: 결과와 피연산자에 레지스터 또는 메모리를 배정한다.
  - id: emit
    content:
      - type: text
        text: 호출 규약에 맞는 명령어를 출력한다.
correctOrder:
  - analyze-liveness
  - select
  - allocate
  - emit
unorderedGroups:
  - [analyze-liveness, select]
explanation:
  - type: text
    text: 값 수명을 알아야 레지스터를 안전하게 재사용할 수 있고, 배정 뒤에야 실제 피연산자 위치를 넣어 명령을 출력할 수 있습니다.
tags:
  - programming-languages
  - code-generation
  - pipeline
difficulty: 3
