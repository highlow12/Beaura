schemaVersion: 1
id: os.filesystem.fill-03
revision: 2
type: fill-blank
prompt:
  - type: text
    text: "열린 파일을 가리키는 프로세스별 핸들은 ___입니다."
choices:
  - "파일 기술자"
  - "파일 확장자"
  - "디렉터리 이름"
acceptedAnswers:
  - "파일 기술자"
explanation:
  - type: text
    text: "`/home/a/note.txt`를 열 때는 루트부터 home, a, note.txt의 이름을 차례로 찾습니다. 디렉터리는 이름을 파일·하위 디렉터리에 연결하고, 메타데이터는 크기와 권한 같은 정보를 담습니다. 파일 기술자(file descriptor)는 열린 파일을 가리키는 프로세스별 핸들입니다."
tags: [filesystem, file, directory]
difficulty: 2
