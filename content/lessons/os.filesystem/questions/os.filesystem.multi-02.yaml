schemaVersion: 1
id: os.filesystem.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "파일·디렉터리와 파일시스템에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "파일 메타데이터에는 크기·소유자·권한·블록 위치가 포함될 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "열린 파일의 현재 위치는 파일 기술자나 열린 파일 상태에 기록될 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "파일시스템은 파일 이름과 내용 사이의 연결을 전혀 저장하지 않는다."
  - id: wrong-b
    content:
      - type: text
        text: "디렉터리 경로는 한 단계만 검사하면 항상 파일을 찾는다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "파일 메타데이터에는 크기·소유자·권한·블록 위치가 포함될 수 있다. 열린 파일의 현재 위치는 파일 기술자나 열린 파일 상태에 기록될 수 있다."
  - type: text
    text: "파일시스템은 블록 할당과 캐시로 편의를 제공하지만 메타데이터 일관성, 권한, 장애 복구를 함께 관리해야 합니다. 작은 파일이 많으면 디렉터리 탐색과 메타데이터 비용이 커질 수 있습니다."
tags: [filesystem, file, directory]
difficulty: 3
