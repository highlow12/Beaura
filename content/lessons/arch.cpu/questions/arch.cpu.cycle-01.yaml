schemaVersion: 1
id: arch.cpu.cycle-01
revision: 2
type: ordering
prompt:
  - type: text
    text: CPU의 기본 명령 실행 사이클을 순서대로 배열하세요.
items:
  - id: fetch
    content:
      - type: text
        text: 메모리에서 명령을 가져온다
  - id: decode
    content:
      - type: text
        text: 명령의 종류와 피연산자를 해석한다
  - id: execute
    content:
      - type: text
        text: ALU나 다른 장치로 명령을 수행한다
correctOrder:
  - fetch
  - decode
  - execute
explanation:
  - type: text
    text: 입문 수준의 기본 사이클은 fetch → decode → execute로 구분합니다.
  - type: text
    text: 결과 기록이 필요한 명령은 실행 과정에서 또는 별도의 write-back 단계에서 결과를 기록하지만, 분기처럼 모든 명령이 값을 기록하는 것은 아닙니다.
tags:
  - cpu
  - instruction-cycle
difficulty: 2
