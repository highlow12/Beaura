id: ds.tree-traversal.steps-01
type: ordering
prompt:
- type: text
  text: 전위 순회로 한 노드를 처리하는 순서를 배열하세요.
items:
- id: check
  content:
  - type: text
    text: 현재 노드가 None인지 확인한다
- id: visit
  content:
  - type: text
    text: 현재 노드의 값을 방문 기록한다
- id: left
  content:
  - type: text
    text: 왼쪽 하위 트리를 재귀적으로 순회한다
- id: right
  content:
  - type: text
    text: 오른쪽 하위 트리를 재귀적으로 순회한다
correctOrder:
- check
- visit
- left
- right
explanation:
- type: text
  text: 빈 노드는 건너뛰고, 전위 규칙에 따라 현재·왼쪽·오른쪽 순서로 재귀 방문합니다.
schemaVersion: 1
revision: 1
tags:
- tree
- traversal
difficulty: 2
