id: ds.tree-traversal.concept-01
type: single-choice
prompt:
- type: text
  text: 전위 순회(preorder)의 방문 순서는 무엇인가요?
options:
- id: pre
  content:
  - type: text
    text: 현재 노드, 왼쪽 하위 트리, 오른쪽 하위 트리
- id: in
  content:
  - type: text
    text: 왼쪽 하위 트리, 현재 노드, 오른쪽 하위 트리
- id: post
  content:
  - type: text
    text: 왼쪽 하위 트리, 오른쪽 하위 트리, 현재 노드
- id: level
  content:
  - type: text
    text: 높이가 낮은 레벨부터 큐로 방문
correctOptionId: pre
shuffleOptions: true
explanation:
- type: text
  text: 전위 순회는 root-left-right입니다. 왼쪽과 오른쪽의 순서는 같지만 현재 노드를 두 자식보다 먼저 방문합니다.
