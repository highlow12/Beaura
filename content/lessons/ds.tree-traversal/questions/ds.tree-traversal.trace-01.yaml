code: "tree = {\"value\": \"A\", \"left\": {\"value\": \"B\", \"left\": None, \"right\": None}, \"right\": {\"value\": \"C\", \"left\": None, \"right\": None}}\nresult = []\ndef preorder(node):\n    if node is None:\n        return\n    result.append(node[\"value\"])\n    preorder(node[\"left\"])\n    preorder(node[\"right\"])\npreorder(tree)\nprint(result)"
