id: ds.hash-table.concept-01
type: single-choice
prompt:
- type: text
  text: 해시 테이블의 평균 조회가 빠른 이유는 무엇인가요?
options:
- id: bucket
  content:
  - type: text
    text: 키를 해시해 후보 버킷으로 바로 이동한 뒤 항목을 확인하기 때문이다
- id: scan
  content:
  - type: text
    text: 항상 모든 키를 처음부터 끝까지 비교하기 때문이다
- id: sort
  content:
  - type: text
    text: 조회할 때마다 전체 표를 정렬하기 때문이다
- id: tree
  content:
  - type: text
    text: 모든 키를 반드시 트리의 높이만큼만 저장하기 때문이다
correctOptionId: bucket
shuffleOptions: true
explanation:
- type: text
  text: 해시 테이블은 키를 버킷 위치로 매핑해 후보를 좁힙니다. 충돌이 많으면 버킷 내부 비교가 늘어 성능이 떨어질 수 있습니다.
schemaVersion: 1
revision: 1
tags:
- hashing
- hash-table
- collision
difficulty: 2
