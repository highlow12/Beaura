id: ds.hash-table.steps-01
type: ordering
prompt:
- type: text
  text: 해시 테이블 조회의 순서를 배열하세요.
items:
- id: hash
  content:
  - type: text
    text: 조회 키를 해시한다
- id: locate
  content:
  - type: text
    text: 해시값으로 버킷을 찾는다
- id: resolve
  content:
  - type: text
    text: 버킷 안의 충돌 항목을 확인한다
- id: return
  content:
  - type: text
    text: 실제 키가 일치한 값과 결과를 반환한다
correctOrder:
- hash
- locate
- resolve
- return
explanation:
- type: text
  text: 저장 때와 같은 해시 경로로 버킷을 찾은 뒤, 충돌이 있으면 실제 키를 비교해 올바른 값을 반환합니다.
schemaVersion: 1
revision: 1
tags:
- hashing
- hash-table
- collision
difficulty: 2
