schemaVersion: 1
id: calc.gradient.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "그래디언트에 대한 옳은 설명을 모두 고르세요."
options:
  - id: steepest-up
    content:
      - type: text
        text: "가장 가파르게 증가하는 방향을 가리킨다"
  - id: contour-perp
    content:
      - type: text
        text: "등고선에 수직이다"
  - id: descent
    content:
      - type: text
        text: "−∇f 방향은 함수값을 줄이는 방향이다"
  - id: zero-change
    content:
      - type: text
        text: "항상 함수값을 0으로 만든다"
correctOptionIds: [steepest-up, contour-perp, descent]
shuffleOptions: true
explanation:
  - type: text
    text: "그래디언트는 최대 증가 방향이며, 반대 방향은 국소적으로 감소하는 방향입니다."
  - type: text
    text: "그래디언트가 0인 점은 방향 정보가 사라지는 임계점입니다."
tags:
  - calculus
  - gradient
  - geometry
difficulty: 2
