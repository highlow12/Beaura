type: matching
prompt:
  - type: text
    text: "HTTP 요청과 응답의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "method"
  - id: left-b
    content:
      - type: text
        text: "status-code"
  - id: left-c
    content:
      - type: text
        text: "header"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "요청의 의도와 동작을 나타내는 동사"
  - id: right-b
    content:
      - type: text
        text: "처리 결과를 요약하는 숫자"
  - id: right-c
    content:
      - type: text
        text: "메시지 메타데이터를 담는 필드"
correctPairs:
