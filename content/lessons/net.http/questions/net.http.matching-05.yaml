    text: "method은 요청의 의도와 동작을 나타내는 동사, status-code은 처리 결과를 요약하는 숫자입니다."
  - type: text
    text: "header은 메시지 메타데이터를 담는 필드을 뜻하므로 세 역할을 구분해야 합니다."
tags: [http, web, request-response]
