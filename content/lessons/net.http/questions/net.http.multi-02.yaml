schemaVersion: 1
id: net.http.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "HTTP 요청과 응답에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "2xx 상태 코드는 일반적으로 요청이 성공했음을 나타낸다."
  - id: correct-b
    content:
      - type: text
        text: "Content-Type 같은 헤더는 본문을 해석할 형식을 알려줄 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "GET과 POST는 서버에 전달되는 의도가 항상 완전히 같다."
  - id: wrong-b
    content:
      - type: text
        text: "404는 이름 해석이 실패했다는 DNS 전용 코드다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "2xx 상태 코드는 일반적으로 요청이 성공했음을 나타낸다. Content-Type 같은 헤더는 본문을 해석할 형식을 알려줄 수 있다."
  - type: text
    text: "HTTP는 단순하고 확장 가능하지만 매 요청 헤더와 연결 관리가 비용이 될 수 있습니다. 캐시·압축·연결 재사용으로 지연과 전송량을 줄일 수 있습니다."
tags: [http, web, request-response]
difficulty: 2
