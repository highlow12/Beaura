schemaVersion: 1
id: net.http.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "HTTP 요청과 응답의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: request
    content:
      - type: text
        text: "클라이언트가 메서드·경로·헤더를 보낸다"
  - id: process
    content:
      - type: text
        text: "서버가 자원을 찾고 요청을 처리한다"
  - id: response
    content:
      - type: text
        text: "상태 코드·헤더·본문으로 결과를 반환한다"
correctOrder: [request, process, response]
explanation:
  - type: text
    text: "클라이언트가 메서드·경로·헤더를 보낸다 단계가 먼저이고, 그 결과를 이용해 서버가 자원을 찾고 요청을 처리한다 단계가 이어집니다."
  - type: text
    text: "상태 코드·헤더·본문으로 결과를 반환한다 단계에서 결과가 다음 네트워크 계층이나 응용으로 전달됩니다."
tags: [http, web, request-response]
difficulty: 2
