schemaVersion: 1
id: math.graph-paths.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "A→B 비용 2, B→C 비용 4, A→C 비용 7일 때 A에서 C로 가는 경로에 대한 옳은 문장을 모두 고르세요."
options:
  - id: via-b
    content:
      - type: text
        text: "A→B→C의 길이는 6이다"
  - id: direct
    content:
      - type: text
        text: "A→C의 길이는 7이다"
  - id: shortest
    content:
      - type: text
        text: "현재 두 경로 중 A→B→C가 더 짧다"
  - id: vertices
    content:
      - type: text
        text: "A→B→C의 길이는 정점 3개이므로 3이다"
correctOptionIds: [via-b, direct, shortest]
shuffleOptions: true
explanation:
  - type: text
    text: "경로 길이는 간선 가중치의 합이므로 2+4=6이고 직접 경로는 7입니다."
  - type: text
    text: "정점 개수 3은 가중치 길이와 다른 척도입니다."
tags:
  - discrete-math
  - graphs
  - weighted-path
difficulty: 2
