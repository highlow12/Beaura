schemaVersion: 1
id: math.graph-paths.steps-01
revision: 1
type: ordering
prompt:
  - type: text
    text: "가중치 경로의 길이를 구하는 절차를 배열하세요."
items:
  - id: write-path
    content:
      - type: text
        text: "시작부터 목표까지 정점과 간선을 순서대로 쓴다"
  - id: list-weights
    content:
      - type: text
        text: "지나는 각 간선의 가중치를 적는다"
  - id: sum
    content:
      - type: text
        text: "가중치를 모두 더한다"
  - id: compare
    content:
      - type: text
        text: "필요하면 다른 경로의 합과 비교한다"
correctOrder:
  - write-path
  - list-weights
  - sum
  - compare
explanation:
  - type: text
    text: "먼저 경로를 확정한 뒤 그 경로의 간선 비용만 합산합니다."
  - type: text
    text: "경로를 먼저 쓰지 않으면 다른 가지의 가중치를 섞기 쉽습니다."
tags:
  - discrete-math
  - graphs
  - path-length
difficulty: 2
