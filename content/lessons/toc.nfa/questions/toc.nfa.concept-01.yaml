schemaVersion: 1
id: toc.nfa.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: NFA가 입력 문자열을 수용하는 조건은 무엇인가요?
options:
  - id: one-accepting-path
    content:
      - type: text
        text: 가능한 실행 경로 중 하나라도 수용 상태에서 끝나면 수용한다.
  - id: all-paths
    content:
      - type: text
        text: 가능한 모든 실행 경로가 수용 상태에서 끝나야 한다.
  - id: random-path
    content:
      - type: text
        text: 무작위로 고른 한 경로가 수용 상태에서 끝나야 한다.
  - id: first-state
    content:
      - type: text
        text: 시작 상태가 수용 상태이면 입력과 관계없이 수용한다.
correctOptionId: one-accepting-path
shuffleOptions: true
explanation:
  - type: text
    text: NFA는 가능한 경로들의 존재를 표현하므로 하나의 수용 경로만 있어도 문자열을 수용합니다.
tags:
  - theory-of-computation
  - nfa
  - acceptance
difficulty: 1
