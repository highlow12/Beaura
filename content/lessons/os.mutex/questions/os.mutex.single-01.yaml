schemaVersion: 1
id: os.mutex.single-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "뮤텍스와 임계 구역에 대한 설명으로 가장 정확한 것은 무엇인가요?"
options:
  - id: correct
    content:
      - type: text
        text: "뮤텍스는 한 번에 하나의 실행 흐름만 보호된 임계 구역에 들어가게 하는 잠금이다."
  - id: wrong-a
    content:
      - type: text
        text: "뮤텍스는 모든 스레드의 코드를 동시에 실행시키는 스케줄러다."
  - id: wrong-b
    content:
      - type: text
        text: "뮤텍스는 전원이 꺼져도 데이터를 보존하는 메모리 장치다."
correctOptionId: correct
shuffleOptions: true
explanation:
  - type: text
    text: "뮤텍스는 한 번에 하나의 실행 흐름만 보호된 임계 구역에 들어가게 하는 잠금이다."
  - type: text
    text: "뮤텍스(mutex)는 상호 배제를 제공하는 잠금입니다. 한 실행 흐름이 lock을 획득하면 unlock할 때까지 다른 흐름은 같은 임계 구역에 들어갈 수 없습니다."
tags: [mutex, lock, critical-section]
difficulty: 2
