schemaVersion: 1
id: os.mutex.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "뮤텍스와 임계 구역에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "공유 상태를 읽고 쓰는 전체 원자적 구간을 같은 뮤텍스로 보호해야 한다."
  - id: correct-b
    content:
      - type: text
        text: "뮤텍스를 획득한 흐름이 해제하지 않으면 다른 흐름은 기다릴 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "뮤텍스는 lock을 획득하지 않아도 임계 구역의 안전성을 보장한다."
  - id: wrong-b
    content:
      - type: text
        text: "임계 구역 안에서 오랜 입출력을 해도 다른 흐름의 대기 비용은 없다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "공유 상태를 읽고 쓰는 전체 원자적 구간을 같은 뮤텍스로 보호해야 한다. 뮤텍스를 획득한 흐름이 해제하지 않으면 다른 흐름은 기다릴 수 있다."
  - type: text
    text: "뮤텍스는 경쟁 조건을 단순하게 막지만 락을 오래 잡으면 병렬성이 줄고, 락 순서를 잘못 설계하면 데드락이 생깁니다. 예외 경로에서도 반드시 해제해야 합니다."
tags: [mutex, lock, critical-section]
difficulty: 3
