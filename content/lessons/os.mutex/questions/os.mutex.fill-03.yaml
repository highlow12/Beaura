    text: "잔액이 10일 때 두 스레드가 각각 7을 출금하려면 잔액 확인과 차감을 같은 뮤텍스의 임계 구역으로 묶어야 합니다. 먼저 lock을 얻은 작업이 검사와 변경을 끝내고 unlock한 뒤에야 다음 작업이 갱신된 잔액을 확인합니다."
