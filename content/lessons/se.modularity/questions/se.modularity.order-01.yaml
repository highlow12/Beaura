schemaVersion: 1
id: se.modularity.order-01
revision: 1
type: ordering
prompt:
  - type: text
    text: 알림 기능을 모듈로 분리하는 설계 순서를 배열하세요.
items:
  - id: responsibility
    content:
      - type: text
        text: 모듈의 책임을 한 문장으로 적는다.
  - id: surface
    content:
      - type: text
        text: 외부에 필요한 입력과 결과만 공개한다.
  - id: hide-implementation
    content:
      - type: text
        text: 전송 방식 같은 세부 구현을 경계 안에 숨긴다.
  - id: test-boundary
    content:
      - type: text
        text: 경계 양쪽을 독립적으로 테스트한다.
correctOrder:
  - responsibility
  - surface
  - hide-implementation
  - test-boundary
explanation:
  - type: text
    text: 책임을 먼저 정하고 공개 표면을 최소화한 뒤 세부 구현을 감싸고, 마지막에 경계가 독립적으로 동작하는지 확인합니다.
tags:
  - software-engineering
  - modularity
  - design-process
difficulty: 2
