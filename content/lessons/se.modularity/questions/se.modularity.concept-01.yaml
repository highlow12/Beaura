schemaVersion: 1
id: se.modularity.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 변경하기 쉬운 모듈이 보통 지향하는 조합은 무엇인가요?
options:
  - id: high-cohesion-low-coupling
    content:
      - type: text
        text: 높은 응집도와 낮은 결합도
  - id: low-cohesion-high-coupling
    content:
      - type: text
        text: 낮은 응집도와 높은 결합도
  - id: no-boundary
    content:
      - type: text
        text: 모든 기능을 하나의 모듈에 넣기
  - id: global-state
    content:
      - type: text
        text: 모듈 사이에서 전역 상태를 공유하기
correctOptionId: high-cohesion-low-coupling
shuffleOptions: true
explanation:
  - type: text
    text: 한 모듈이 하나의 목적에 집중하고 모듈 사이의 내부 지식 공유를 줄이면 변경 영향 범위를 좁힐 수 있습니다.
tags:
  - software-engineering
  - modularity
  - cohesion
difficulty: 1
