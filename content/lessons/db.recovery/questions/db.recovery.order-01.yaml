schemaVersion: 1
id: db.recovery.order-01
revision: 2
type: ordering
prompt:
  - type: text
    text: WAL을 사용하는 DBMS가 commit 성공을 응답하기까지 로그를 처리하는 순서를 배열하세요.
items:
  - id: log
    content:
      - type: text
        text: 변경 내용을 로그에 기록한다
  - id: flush
    content:
      - type: text
        text: 변경과 commit 로그를 안정 저장소에 기록한다
  - id: commit-log
    content:
      - type: text
        text: commit 사실을 로그에 남긴다
  - id: ack
    content:
      - type: text
        text: 클라이언트에 성공을 알린다
correctOrder: [log, commit-log, flush, ack]
explanation:
  - type: text
    text: 변경과 commit 로그를 남기고 그 로그를 안정 저장소에 기록한 뒤 성공을 응답합니다. 데이터 페이지의 디스크 기록은 성공 응답 뒤로 미뤄도 WAL을 통한 장애 복구가 가능하므로 이 순서 문제에 넣지 않습니다.
tags: [database, recovery, wal, order]
difficulty: 3
