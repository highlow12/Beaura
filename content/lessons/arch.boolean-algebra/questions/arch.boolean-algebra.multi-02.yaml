schemaVersion: 1
id: arch.boolean-algebra.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "불 대수와 XOR에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "A XOR A는 어떤 A에 대해서도 0이다."
  - id: correct-b
    content:
      - type: text
        text: "De Morgan 법칙에 따르면 NOT(A AND B)는 (NOT A) OR (NOT B)와 같다."
  - id: wrong-a
    content:
      - type: text
        text: "A XOR 0은 모든 A에서 0이다."
  - id: wrong-b
    content:
      - type: text
        text: "불 대수의 변수는 0, 1 이외의 임의의 실수도 값으로 갖는다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "A XOR A는 어떤 A에 대해서도 0이다. De Morgan 법칙에 따르면 NOT(A AND B)는 (NOT A) OR (NOT B)와 같다."
  - type: text
    text: "식을 단순화하면 게이트 수와 지연을 줄일 수 있지만, 변환 과정에서 괄호와 우선순위를 놓치면 의미가 달라집니다. 회로 설계에서는 진리표로 결과를 다시 확인합니다."
tags: [boolean-algebra, xor, logic]
difficulty: 3
