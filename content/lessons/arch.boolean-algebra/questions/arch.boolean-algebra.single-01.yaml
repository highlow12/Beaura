explanation:
  - type: text
    text: "XOR는 두 입력 중 정확히 하나가 1일 때 1을 출력한다."
  - type: text
    text: "불 대수에서는 변수 값이 0 또는 1이고 AND는 곱, OR는 합, NOT은 보수처럼 다룹니다. XOR는 두 입력이 서로 다를 때만 1인 연산입니다."
tags: [boolean-algebra, xor, logic]
