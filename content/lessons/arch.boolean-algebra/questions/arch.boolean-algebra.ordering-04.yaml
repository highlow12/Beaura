schemaVersion: 1
id: arch.boolean-algebra.ordering-04
revision: 1
type: ordering
prompt:
  - type: text
    text: "불 대수와 XOR의 기본 처리 흐름을 올바른 순서로 배열하세요."
items:
  - id: table
    content:
      - type: text
        text: "입력 조합별 출력 진리표를 만든다"
  - id: rewrite
    content:
      - type: text
        text: "불 대수 법칙으로 식을 동치 변환한다"
  - id: verify
    content:
      - type: text
        text: "원래 식과 단순화한 식의 출력이 같은지 확인한다"
correctOrder: [table, rewrite, verify]
explanation:
  - type: text
    text: "입력 조합별 출력 진리표를 만든다 단계가 먼저이고, 그 결과를 이용해 불 대수 법칙으로 식을 동치 변환한다 단계가 이어집니다."
  - type: text
    text: "원래 식과 단순화한 식의 출력이 같은지 확인한다 단계에서 최종 결과가 다음 회로 또는 프로그램으로 전달됩니다."
tags: [boolean-algebra, xor, logic]
difficulty: 3
