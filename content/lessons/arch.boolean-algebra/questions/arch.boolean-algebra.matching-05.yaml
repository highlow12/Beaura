schemaVersion: 1
id: arch.boolean-algebra.matching-05
revision: 1
type: matching
prompt:
  - type: text
    text: "불 대수와 XOR의 용어와 역할을 알맞게 연결하세요."
leftItems:
  - id: left-a
    content:
      - type: text
        text: "AND"
  - id: left-b
    content:
      - type: text
        text: "OR"
  - id: left-c
    content:
      - type: text
        text: "XOR"
rightItems:
  - id: right-a
    content:
      - type: text
        text: "모든 입력이 1일 때 1"
  - id: right-b
    content:
      - type: text
        text: "하나 이상의 입력이 1일 때 1"
  - id: right-c
    content:
      - type: text
        text: "입력이 서로 다를 때 1"
correctPairs:
  - leftId: left-a
    rightId: right-a
  - leftId: left-b
    rightId: right-b
  - leftId: left-c
    rightId: right-c
explanation:
  - type: text
    text: "AND은 모든 입력이 1일 때 1, OR은 하나 이상의 입력이 1일 때 1입니다."
  - type: text
    text: "XOR은 입력이 서로 다를 때 1을 뜻하므로 세 역할을 구분해야 합니다."
tags: [boolean-algebra, xor, logic]
difficulty: 2
