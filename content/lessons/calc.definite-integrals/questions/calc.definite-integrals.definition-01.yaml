schemaVersion: 1
id: calc.definite-integrals.definition-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: "∫ₐᵇ f(x)dx를 원시함수 F로 계산하는 식은 무엇인가요?"
options:
  - id: difference
    content:
      - type: text
        text: "F(b)−F(a)"
  - id: sum
    content:
      - type: text
        text: "F(a)+F(b)"
  - id: product
    content:
      - type: text
        text: "F(a)F(b)"
  - id: derivative
    content:
      - type: text
        text: "F′(b)−F′(a)"
correctOptionId: difference
shuffleOptions: true
explanation:
  - type: text
    text: "정적분은 원시함수의 끝점 값 차이입니다."
  - type: text
    text: "끝점의 순서를 바꾸면 값의 부호가 바뀝니다."
tags:
  - calculus
  - definite-integrals
  - fundamental-theorem
difficulty: 1
