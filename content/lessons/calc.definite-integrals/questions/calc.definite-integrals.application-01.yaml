schemaVersion: 1
id: calc.definite-integrals.application-01
revision: 1
type: multi-select
prompt:
  - type: text
    text: "정적분의 해석으로 옳은 것을 모두 고르세요."
options:
  - id: signed-area
    content:
      - type: text
        text: "x축 위아래를 부호 있게 누적한다"
  - id: accumulation
    content:
      - type: text
        text: "구간에서 양이 누적된 결과로 볼 수 있다"
  - id: split
    content:
      - type: text
        text: "함수의 부호가 바뀌면 구간을 나눌 수 있다"
  - id: always-positive
    content:
      - type: text
        text: "정적분은 항상 양수이다"
correctOptionIds: [signed-area, accumulation, split]
shuffleOptions: true
explanation:
  - type: text
    text: "정적분은 부호 있는 면적이며, 부호가 바뀌는 지점에서 나누어 해석할 수 있습니다."
  - type: text
    text: "기하적 전체 넓이는 정적분과 달리 음수 부분을 양수로 바꾸어 더합니다."
tags:
  - calculus
  - definite-integrals
  - area
difficulty: 2
