type: fill-blank
prompt:
  - type: text
    text: "힙의 빈 공간이 흩어져 큰 연속 블록을 얻기 어려운 현상은 ___입니다."
choices:
  - "외부 단편화"
  - "스택 반환"
  - "페이지 적중"
acceptedAnswers:
  - "외부 단편화"
explanation:
  - type: text
    text: "함수가 호출되어 프레임이 쌓이면 반환 시 스택 포인터가 돌아갑니다. 반면 힙에서 요청한 블록은 사용을 마칠 때 할당자의 규칙에 따라 해제합니다. 빈 공간이 여러 조각으로 흩어져 큰 연속 블록을 얻기 어려우면 외부 단편화라고 합니다."
