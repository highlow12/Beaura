schemaVersion: 1
id: os.allocation.multi-02
revision: 1
type: multi-select
prompt:
  - type: text
    text: "스택·힙과 메모리 할당에 해당하는 설명을 모두 고르세요."
options:
  - id: correct-a
    content:
      - type: text
        text: "재귀 호출이 지나치게 깊으면 스택 공간이 부족해질 수 있다."
  - id: correct-b
    content:
      - type: text
        text: "힙 블록이 흩어지면 외부 단편화로 큰 연속 블록을 얻기 어려울 수 있다."
  - id: wrong-a
    content:
      - type: text
        text: "힙 메모리는 해제하지 않아도 운영체제가 객체 수명을 항상 추적한다."
  - id: wrong-b
    content:
      - type: text
        text: "스택의 지역 변수는 프로그램 전체에서 영원히 같은 주소를 가진다."
correctOptionIds: [correct-a, correct-b]
shuffleOptions: true
explanation:
  - type: text
    text: "재귀 호출이 지나치게 깊으면 스택 공간이 부족해질 수 있다. 힙 블록이 흩어지면 외부 단편화로 큰 연속 블록을 얻기 어려울 수 있다."
  - type: text
    text: "스택은 빠르고 관리가 단순하지만 크기와 수명이 제한됩니다. 힙은 유연하지만 할당 비용, 단편화, 누수와 이중 해제 위험을 동반합니다."
tags: [memory-allocation, stack, heap]
difficulty: 3
