schemaVersion: 1
id: toc.grammar.concept-01
revision: 1
type: single-choice
prompt:
  - type: text
    text: 형식 문법에서 단말(terminal)의 역할은 무엇인가요?
options:
  - id: final-symbol
    content:
      - type: text
        text: 유도가 끝났을 때 문자열에 남는 실제 출력 기호다.
  - id: rule-placeholder
    content:
      - type: text
        text: 반드시 다른 규칙으로 다시 바뀌는 자리표시자다.
  - id: start-only
    content:
      - type: text
        text: 문법 전체를 시작하는 기호 하나만을 뜻한다.
  - id: state-name
    content:
      - type: text
        text: 오토마톤의 현재 상태를 기록하는 이름이다.
correctOptionId: final-symbol
shuffleOptions: true
explanation:
  - type: text
    text: 단말은 더 이상 생성 규칙의 왼쪽에서 바뀌지 않고 최종 문자열의 기호가 됩니다. 비단말은 생성 중에 계속 확장될 수 있습니다.
tags:
  - theory-of-computation
  - grammar
  - terminal
difficulty: 1
