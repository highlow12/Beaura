schemaVersion: 1
id: algo.correctness.steps-01
revision: 2
type: ordering
prompt:
  - type: text
    text: 반복문 불변식으로 정확성을 보이는 순서를 배열하세요.
items:
  - id: initialize
    content:
      - type: text
        text: 반복 시작 전에 불변식이 참임을 보인다
  - id: maintain
    content:
      - type: text
        text: 한 반복 뒤에도 불변식이 참임을 보인다
  - id: terminate
    content:
      - type: text
        text: 종료 조건과 불변식을 결합해 결과를 얻는다
correctOrder:
  - initialize
  - maintain
  - terminate
explanation:
  - type: text
    text: 초기화에서 불변식이 성립함을 보이고, 매 반복 뒤에도 유지됨을 증명합니다. 종료 조건과 불변식을 결합하면 알고리즘의 결과가 정확함을 얻습니다.
tags:
  - correctness
  - invariant
  - execution-order
difficulty: 2
