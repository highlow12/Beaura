schemaVersion: 1
id: algo.correctness.steps-01
revision: 1
type: ordering
prompt:
- type: text
  text: 반복문 불변식으로 정확성을 보이는 순서를 배열하세요.
items:
- id: initialize
  content:
  - type: text
    text: 반복 시작 전에 불변식이 참임을 보인다
- id: maintain
  content:
  - type: text
    text: 한 반복 뒤에도 불변식이 참임을 보인다
- id: terminate
  content:
  - type: text
    text: 종료 조건과 불변식을 결합해 결과를 얻는다
- id: compare
  content:
  - type: text
    text: 필요한 비용과 다른 설계의 트레이드오프를 비교한다
correctOrder:
- initialize
- maintain
- terminate
- compare
explanation:
- type: text
  text: 초기화·유지·종료가 정확성 증명의 순서이고, 비용 비교는 그 뒤 설계 선택을 평가하는 단계입니다.
tags:
- correctness
- invariant
- trade-off
- execution-order
difficulty: 2
