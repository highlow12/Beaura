type: code-output
prompt:
  - type: text
    text: 사전 조건을 통과한 함수가 반환하는 다음 코드의 출력은 무엇인가요?
language: python
code: |-
  def add_tax(price, rate):
      if price < 0:
          raise ValueError("price")
      return price + rate

  print(add_tax(100, 10))
choices:
  - "110"
  - "90"
  - price
acceptedOutputs:
  - "110"
explanation:
  - type: text
    text: price가 음수가 아니므로 사전 조건 검사를 통과하고 100과 10을 더한 110을 반환합니다.
