name: Apply ELK layout migration

on:
  push:
    branches:
      - automation/elk-layout-20260917

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply source migration
        run: node scripts/automation/migrate-elk-layout.mjs
      - name: Fix ELK result typing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/lib/curriculum/dag-layout.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            'import ELK from "elkjs/lib/elk.bundled.js";\nimport type { CurriculumNode }',
            'import ELK from "elkjs/lib/elk.bundled.js";\nimport type { ElkNode } from "elkjs/lib/elk-api";\nimport type { CurriculumNode }',
          );
          source = source.replace(
            '  const result = await elk.layout({',
            '  const graph: ElkNode = {',
          );
          source = source.replace(
            '    edges: elkEdges,\n  });\n\n  const resultById',
            '    edges: elkEdges,\n  };\n  const result = await elk.layout(graph);\n\n  const resultById',
          );
          fs.writeFileSync(path, source);
          NODE
      - name: Install ELK
        run: npm install elkjs@0.12.0 --save
      - name: Format changed TypeScript and package metadata
        run: npx prettier --write package.json src/lib/curriculum/dag-layout.ts tests/curriculum/dag-layout.test.ts
      - name: Verify
        run: npm run verify
      - name: Commit verified result
        run: |
          rm scripts/automation/migrate-elk-layout.mjs
          rm .github/workflows/elk-layout-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: use ELK for curriculum DAG layout"
          git push origin HEAD:automation/elk-layout-20260917
