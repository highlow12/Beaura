<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="짧은 설명과 반복 문제로 컴퓨터과학을 학습하는 Offline First 앱"
    />
    <meta name="theme-color" content="#f5f7f4" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Beaura" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="stylesheet" href="%sveltekit.assets%/answer-stickers.css" />
    <link
      rel="icon"
      href="%sveltekit.assets%/brand/beaura/mark.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/icons/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/icons/apple-touch-icon-180.png"
    />
    <script>
      (function () {
        try {
          var language = localStorage.getItem("beaura.locale");
          if (language !== "ko" && language !== "en") {
            language = sessionStorage.getItem("beaura.locale");
          }
          language = language === "en" ? "en" : "ko";
          document.documentElement.lang = language;
          var description = document.querySelector('meta[name="description"]');
          if (description && language === "en") {
            description.setAttribute(
              "content",
              "Learn computer science with short lessons and practice questions.",
            );
          }
        } catch (_) {
          document.documentElement.lang = "ko";
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var key = "cs-duolingo:theme";
          var stored = localStorage.getItem(key);
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", theme === "dark" ? "#111714" : "#f5f7f4");
        } catch (_) {
          /* A blocked storage API must not prevent the app from loading. */
        }
      })();
    </script>
    <script>
      (function () {
        var recoveryKey = "beaura:module-recovery-attempted";
        function recover(error) {
          var message = String(error && (error.message || error) || "");
          if (!/dynamically imported module|importing a module script|module script failed/i.test(message)) return;

          var notice = document.getElementById("module-recovery-notice");
          if (!notice) {
            notice = document.createElement("div");
            notice.id = "module-recovery-notice";
            notice.setAttribute("role", "alert");
            notice.style.cssText = "position:fixed;inset:0;z-index:9999;display:grid;place-content:center;gap:1rem;padding:2rem;background:#f5f7f4;color:#111714;text-align:center;font:1rem system-ui";
            var english = document.documentElement.lang === "en";
            notice.innerHTML = '<strong>' + (english ? 'Could not load the app.' : '앱을 불러오지 못했습니다.') + '</strong><button type="button" style="padding:.8rem;border:1px solid;border-radius:.5rem;background:white;color:inherit;font:inherit;cursor:pointer">' + (english ? 'Reload' : '다시 불러오기') + '</button>';
            document.body.appendChild(notice);
            notice.querySelector("button").addEventListener("click", retry);
          }
          try {
            if (sessionStorage.getItem(recoveryKey)) return;
            sessionStorage.setItem(recoveryKey, "1");
          } catch (_) { return; }
          retry();
        }

        async function retry() {
          if (!navigator.onLine) return;
          try {
            if ("serviceWorker" in navigator) {
              var registration = await navigator.serviceWorker.getRegistration();
              if (registration) {
                await registration.update();
                if (registration.waiting) registration.waiting.postMessage({ type: "ACTIVATE_UPDATE" });
                else await registration.unregister();
              }
            }
          } catch (_) { /* Network refresh still works without service worker access. */ }
          var url = new URL(location.href);
          url.searchParams.set("module-retry", String(Date.now()));
          location.replace(url.href);
        }

        window.addEventListener("unhandledrejection", function (event) { recover(event.reason); });
        window.addEventListener("error", function (event) { recover(event.error || event.message); }, true);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-code="viewport"
    data-sveltekit-preload-data="hover"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
